# ВЫПУСК НЕ ИМЕЕТ ПРАВА ОПИРАТЬСЯ НА КЕШ ПРИГОВОРОВ, И ЭТО ПРОВЕРЯЕТСЯ, А НЕ
# ОБЕЩАЕТСЯ.
#
# `AGENTS.md`, раздел «Кеш приговоров: где живёт и чему он НЕ основание», несёт
# правило, которое отменять нельзя:
#
#   Кешу верят для СКОРОСТИ. Для ИСТИНЫ — проверяльщику.
#   Выпуск не имеет права опираться на кеш: перед меткой всё пересчитывается
#   начисто, без `FLANG_KESH_PRIGOVOROV`.
#
# До 2 сентября 2026 правило было записано словами и не принуждалось ничем.
# Правило, которое ничто не исполняет, — не правило: сторож столкновений имён
# уже лежал в дереве, его никто не звал, и это стоило двадцати часов машины.
#
# Кеш в ветке — выложенное наружу утверждение о доказанном. Ключ защищает от
# ПРОТУХАНИЯ (смена одного правила ядра перевернула 49 приговоров из 103, и
# полный ключ разошёлся у всех 103), но не от ПОДЛОЖЕННОГО: запись с верным
# ключом и ложным приговором приняли бы. Поэтому кеш никогда не бывает
# единственным основанием сказать «доказано», а метка — ровно такое основание,
# выложенное наружу под номером версии.
#
# ── ПОЧЕМУ ЭТО СОСТАВНОЕ ДЕЙСТВИЕ, А НЕ ФАЙЛ В `scripts/` ────────────────────
#
# Первым заходом это был `scripts/release-without-cache-guard.sh` — там, где
# лежат десять его братьев `*-guard.sh`. Заход отменён замером, а не вкусом.
#
# Храповик долга («опись:долг», `scripts/tree-inventory.flang`) СЕГОДНЯ КРАСЕН:
# `docs/tree-inventory.md:1` — «долг вне JavaScript — 74 при потолке 63», разбор
# и перевод идут задачей 4838. Новый файл на оболочке сделал бы 75 и прибавил бы
# к долгу, который сейчас выплачивают. Довода «не-долг» у него нет: дозволенное
# основание одно — круг, «файл судит или собирает то, чем его самого пришлось бы
# исполнять», а «мне так дешевле» доводом не бывает (`docs/tree-inventory.md`,
# «Как держать опись честной»).
#
# Оснастка CI долгом не считалась никогда: все 129 вставок оболочки в
# `.github/workflows/**` живут в YAML и в счёт не идут. Эта проверка — оснастка
# CI по существу: она читает переменные, которые заводит GitHub (`GITHUB_REF`,
# `GITHUB_REF_TYPE`), и пишет заметки, которые читает GitHub (`::error::`,
# `$GITHUB_STEP_SUMMARY`). Её место — тот же слой.
#
# ЦЕНА РЕШЕНИЯ НАЗВАНА ВСЛУХ: составное действие руками не позовёшь так, как
# зовут сторожа в `scripts/` (`sh scripts/…-guard.sh`). Чтобы проверить его на
# своей машине, тело шага вынимают из этого файла разбором YAML и гоняют
# оболочкой раннера. Двадцать девять копий одной проверки взамен на это не
# годятся тем более.
#
# ── ЧТО ДЕЛАЕТСЯ, И ЭТО ДВЕ ПОЛОВИНЫ ────────────────────────────────────────
#
# ПЕРВАЯ, `mode: env` (умолчание) и `mode: release` — прогонная: смотрит СРЕДУ
# того шага, в котором стоит. Ловит переменную откуда угодно: из `env:` работы,
# из переменной репозитория, из `$GITHUB_ENV`, написанного шагом выше, и —
# единственный случай, которого разметкой не видно вовсе, — из среды своего
# раннера, которую работе никто не писал. `srashchivanie` в `binary.yml` идёт на
# `self-hosted`, и там среда приходит от службы раннера, а не из файла.
#
# ВТОРАЯ, `mode: workflows` — разметочная, и без неё первая неполна: шаг НИЖЕ
# сторожа в той же работе может задать переменную через `$GITHUB_ENV`, и первая
# половина этого не увидит — она точка во времени, а не запрет. Разметка
# спрашивает: ни одна работа и ни одно действие не смеет ЗАДАВАТЬ
# `FLANG_KESH_PRIGOVOROV` — ни в `env:`, ни присваиванием в оболочке. Сегодня
# таких заданий ноль, и это храповик: появится первое — придут сюда и подумают,
# а не молча ускорят выпуск.
#
# `mode: self-test` — проба самого сторожа. Сторож, разучившийся краснеть, от
# чистого дерева неотличим, а этот молчит В ПОДАВЛЯЮЩЕМ БОЛЬШИНСТВЕ прогонов по
# устройству: метки бывают раз в недели. Проба гоняет восемь пар — две обязаны
# краснеть, пять молчать, одна отвечать «смотреть нечем», — и стоит она сотые
# доли секунды.
#
# ── ПОЧЕМУ ПАДАЕТ, А НЕ СНИМАЕТ ПЕРЕМЕННУЮ МОЛЧА ────────────────────────────
#
# Снять её можно только блоком `env:` работы — а он затирает значение ДО
# сторожа, и сторож был бы зелен всегда, ничего не проверяя. Молчаливое снятие
# вдобавок прячет находку: заданная на пути выпуска переменная — признак того,
# что выпуск настроен неправильно, и увидеть это надо один раз глазами, а не
# глотать каждый раз.
#
# ── КОДЫ ВОЗВРАТА ───────────────────────────────────────────────────────────
#
#   0  либо это не путь выпуска (там кеш разрешён и нужен), либо путь выпуска и
#      переменная не задана — пересчёт пойдёт начисто;
#   1  путь выпуска, а `FLANG_KESH_PRIGOVOROV` задана: выпуск оперся бы на кеш;
#      либо разметка нашла присваивание переменной вне комментария;
#   2  сторожу нечем смотреть (неизвестный режим, нет каталога работ, не читается
#      собственное тело). ЭТО НЕ ПРОЙДЕННАЯ ПРОВЕРКА, а третий исход (AGENTS.md).

name: Выпуск не опирается на кеш приговоров
description: >-
  Отказывает, если на пути выпуска (метка, refs/tags/) задана
  FLANG_KESH_PRIGOVOROV. На ветке молчит: там кеш разрешён и нужен.

inputs:
  mode:
    description: >-
      env — решить по среде прогона; release — считать путь выпускным всегда;
      workflows — разметка работ; self-test — проба самого сторожа.
    required: false
    default: env
  workflows-dir:
    description: Где искать работы для режима workflows.
    required: false
    default: .github

runs:
  using: composite
  steps:
    # Имя входа латиницей и значение через `env:`, а не через `${{ }}` прямо в
    # теле: выражения GitHub подставляются ДО оболочки, то есть значение входа
    # попало бы в текст программы, а не в её переменную.
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        KATALOG_RABOT: ${{ inputs.workflows-dir }}
      run: |
        # `set +e` СНИМАЕТ errexit, которым раннер зовёт этот файл
        # (`bash --noprofile --norc -e -o pipefail`). Без снятия шаг умирал бы
        # на самой пробе, ДО строки `kod=$?`, и разбор не выполнялся бы никогда.
        set +e
        set -u

        PEREMENNAYA=FLANG_KESH_PRIGOVOROV

        # Исход называется ДВАЖДЫ — заметкой (`::error::`, видна в логе) и
        # заголовком в сводке прогона (виден на странице, не открывая логов).
        # Приём взят у работы `svezhest` в `.github/workflows/reprint.yml`.
        svodka() {
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || :
          fi
        }

        case "${MODE:-env}" in
          env|release|workflows|self-test) : ;;
          *)
            printf '::error::неизвестный режим сторожа: %s\n' "$MODE" >&2
            printf '::error::Есть: env, release, workflows, self-test.\n' >&2
            exit 2
            ;;
        esac

        # ── Разметка: ни одна работа не ЗАДАЁТ переменную ───────────────────
        #
        # Ищется ЗАДАНИЕ, а не всякое упоминание, и разница тут не придирка.
        # Задать переменную можно ровно двумя записями, и обе кончаются знаком
        # сразу за именем:
        #
        #   YAML  `FLANG_KESH_PRIGOVOROV: файл`     — в `env:` работы или шага
        #   shell `FLANG_KESH_PRIGOVOROV=файл`      — присваивание, `export`,
        #                                             приставка к команде, или
        #                                             строка в `$GITHUB_ENV`
        #
        # Поэтому правило: имя, за которым (сквозь кавычки и пробелы) идёт «:»
        # или «=». Имя в прозе («без FLANG_KESH_PRIGOVOROV»), в описании входа и
        # справа от присваивания (`PEREMENNAYA=FLANG_KESH_PRIGOVOROV` — строкой
        # ниже) под правило не подходит и в счёт не идёт.
        #
        # Без этой точности разметка краснела бы на СОБСТВЕННУЮ прозу — и на
        # шапки работ, которыми и объясняется, зачем сторож там стоит. Список
        # исключений при этом не заводится: исключений нет, есть правило.
        #
        # Комментарий не в счёт тоже: строка считается комментарием, если первый
        # непробельный знак в ней «#»; в теле `run: |` то же верно для оболочки.
        if [ "$MODE" = workflows ]; then
          if [ ! -d "$KATALOG_RABOT" ]; then
            printf '::error::разметка: каталога нет: %s — смотреть нечем\n' "$KATALOG_RABOT" >&2
            exit 2
          fi
          naydeno=$(
            find "$KATALOG_RABOT" -type f \( -name '*.yml' -o -name '*.yaml' \) -print \
            | sort \
            | while IFS= read -r f; do
                awk -v imya="$PEREMENNAYA" -v fayl="$f" '
                  { stroka = $0; sub(/^[ \t]+/, "", stroka) }
                  substr(stroka, 1, 1) == "#" { next }
                  {
                    hvost = $0
                    while ((k = index(hvost, imya)) > 0) {
                      hvost = substr(hvost, k + length(imya))
                      posle = hvost
                      sub(/^["'"'"'[:space:]]+/, "", posle)
                      if (substr(posle, 1, 1) == ":" || substr(posle, 1, 1) == "=") {
                        printf "%s:%d: %s\n", fayl, FNR, stroka
                        next
                      }
                    }
                  }
                ' "$f"
              done
          )
          if [ -n "$naydeno" ]; then
            printf '::error::РАБОТА CI ЗАДАЁТ КЕШ ПРИГОВОРОВ: %s присваивается вне комментария.\n' "$PEREMENNAYA" >&2
            printf '%s\n' "$naydeno" >&2
            printf '::error::Шаг, задающий её ПОСЛЕ сторожа, обходит проверку выпуска. Уберите присваивание.\n' >&2
            svodka "## ✗ Работа CI задаёт кеш приговоров"
            svodka ""
            svodka '```'
            svodka "$naydeno"
            svodka '```'
            exit 1
          fi
          printf 'разметка чиста: %s не задаётся ни одной работой и ни одним действием (%s)\n' \
            "$PEREMENNAYA" "$KATALOG_RABOT"
          svodka "## ✓ Ни одна работа CI не задаёт кеш приговоров"
          exit 0
        fi

        # ── Проба самого сторожа ────────────────────────────────────────────
        #
        # Тело этого шага раннер кладёт во временный файл и зовёт его оболочкой,
        # поэтому `$0` — сам этот файл, и проба зовёт СЕБЯ с другой средой. Не
        # прочиталось — код 2 «смотреть нечем», а не зелень.
        if [ "$MODE" = self-test ]; then
          if [ ! -r "$0" ]; then
            printf '::error::проба: собственное тело не читается ($0=%s) — проверить себя нечем\n' "$0" >&2
            exit 2
          fi
          bedy=0
          rab=$(mktemp -d 2>/dev/null)
          if [ -z "$rab" ]; then
            printf '::error::проба: негде работать (mktemp -d не дал каталога)\n' >&2
            exit 2
          fi
          mkdir -p "$rab/chisto" "$rab/gryazno"
          printf 'name: proba\non:\n  push:\njobs:\n  a:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo raz\n' \
            > "$rab/chisto/proba.yml"
          cp "$rab/chisto/proba.yml" "$rab/gryazno/proba.yml"
          printf '    env:\n      %s: kesh/prigovory.bin\n' "$PEREMENNAYA" >> "$rab/gryazno/proba.yml"
          # В ОБЕ кладётся имя в комментарии И имя в прозе без присваивания:
          # разметка обязана пропустить и то и другое, иначе она краснела бы на
          # собственную прозу в шапках работ.
          for d in chisto gryazno; do
            printf '# упоминание в комментарии: %s — это не задание переменной\n' \
              "$PEREMENNAYA" >> "$rab/$d/proba.yml"
            printf '      - run: echo "печатаем начисто, без %s"\n' \
              "$PEREMENNAYA" >> "$rab/$d/proba.yml"
          done

          proba() {
            imya=$1
            zhdyom=$2
            shift 2
            "$@" > /dev/null 2>&1
            kod=$?
            if [ "$kod" -eq "$zhdyom" ]; then
              printf 'проба: %s — код %s, как задумано\n' "$imya" "$kod"
            else
              printf 'ПРОБА НЕ СОШЛАСЬ: %s дал код %s, а ждали %s\n' "$imya" "$kod" "$zhdyom" >&2
              bedy=$((bedy + 1))
            fi
          }

          # `-u` идёт ПЕРВЫМ доводом env: после присваиваний он читался бы как
          # имя команды, и проба «переменной нет» гоняла бы не сторожа.
          proba 'выпуск + переменная задана' 1 \
            env -u GITHUB_STEP_SUMMARY MODE=env \
                GITHUB_REF=refs/tags/v0.0.0-proba GITHUB_REF_TYPE=tag \
                "$PEREMENNAYA=/net/takogo/kesha" bash "$0"
          proba 'выпуск + переменной нет' 0 \
            env -u GITHUB_STEP_SUMMARY -u "$PEREMENNAYA" MODE=env \
                GITHUB_REF=refs/tags/v0.0.0-proba GITHUB_REF_TYPE=tag bash "$0"
          proba 'выпуск + переменная задана пустым' 0 \
            env -u GITHUB_STEP_SUMMARY MODE=env \
                GITHUB_REF=refs/tags/v0.0.0-proba GITHUB_REF_TYPE=tag \
                "$PEREMENNAYA=" bash "$0"
          proba 'не выпуск + переменная задана' 0 \
            env -u GITHUB_STEP_SUMMARY MODE=env \
                GITHUB_REF=refs/heads/dev GITHUB_REF_TYPE=branch \
                "$PEREMENNAYA=/net/takogo/kesha" bash "$0"
          proba 'режим release на ветке + переменная' 1 \
            env -u GITHUB_STEP_SUMMARY MODE=release \
                GITHUB_REF=refs/heads/dev GITHUB_REF_TYPE=branch \
                "$PEREMENNAYA=/net/takogo/kesha" bash "$0"
          proba 'разметка: работа задаёт переменную' 1 \
            env -u GITHUB_STEP_SUMMARY MODE=workflows \
                "KATALOG_RABOT=$rab/gryazno" bash "$0"
          proba 'разметка: имя без присваивания — не в счёт' 0 \
            env -u GITHUB_STEP_SUMMARY MODE=workflows \
                "KATALOG_RABOT=$rab/chisto" bash "$0"
          proba 'неизвестный режим — смотреть нечем' 2 \
            env -u GITHUB_STEP_SUMMARY MODE=chush bash "$0"

          rm -rf "$rab"

          if [ "$bedy" -ne 0 ]; then
            printf '::error::сторож выпуска без кеша НЕ РАБОТАЕТ: расхождений %s из 8\n' "$bedy" >&2
            svodka "## ✗ Сторож выпуска без кеша не работает: расхождений $bedy из 8"
            exit 1
          fi
          printf 'сторож выпуска без кеша умеет краснеть и умеет молчать: 8 проб из 8\n'
          svodka "## ✓ Сторож выпуска без кеша умеет краснеть и умеет молчать (8 проб)"
          exit 0
        fi

        # ── Путь выпуска или нет ────────────────────────────────────────────
        #
        # Метка: `GITHUB_REF` вида `refs/tags/*` либо `GITHUB_REF_TYPE=tag`.
        # Плюс `mode: release` для работ, которые НИЧЕМ, кроме выпуска, не
        # бывают (`publish-npm.yml`): там выпуском является и ручной запуск.
        #
        # Ручной запуск остальных работ выпуском НЕ считается: шапка `ci.yml`
        # говорит прямо — «`workflow_dispatch` оставлен: ветку иногда надо
        # проверить целиком руками». Проверка ветки руками не выпуск, и кеш там
        # разрешён и нужен: он для скорости.
        put_vypuska=net
        otkuda=""
        if [ "$MODE" = release ]; then
          put_vypuska=da
          otkuda='режим release'
        else
          case "${GITHUB_REF:-}" in
            refs/tags/*)
              put_vypuska=da
              otkuda="GITHUB_REF=${GITHUB_REF}"
              ;;
          esac
          if [ "$put_vypuska" = net ] && [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            put_vypuska=da
            otkuda='GITHUB_REF_TYPE=tag'
          fi
        fi

        # ── Задана ли переменная ────────────────────────────────────────────
        #
        # Различаем ТРИ состояния, а не два: не задана / задана пустым / задана.
        # `FLANG_KESH_PRIGOVOROV=` (пусто) — это НЕ включённый кеш: файла нет,
        # ядро идёт прежней дорогой байт в байт. Такой записью как раз и гасят
        # переменную, протёкшую со своего раннера, и краснеть на лекарство было
        # бы вредно. Случай назван вслух, чтобы не выглядеть недосмотром.
        znachenie=$(eval "printf '%s' \"\${$PEREMENNAYA-}\"")
        if eval "[ -z \"\${$PEREMENNAYA+zadana}\" ]"; then
          sostoyanie=net
        elif [ -z "$znachenie" ]; then
          sostoyanie=pusto
        else
          sostoyanie=da
        fi

        if [ "$put_vypuska" = net ]; then
          if [ "$sostoyanie" = da ]; then
            printf 'не путь выпуска — %s=%s разрешена, кеш здесь для скорости\n' \
              "$PEREMENNAYA" "$znachenie"
          else
            printf 'не путь выпуска — %s не задана\n' "$PEREMENNAYA"
          fi
          exit 0
        fi

        if [ "$sostoyanie" = da ]; then
          # ЭТО САМО СООБЩЕНИЕ. Оно названо в наказе дословно и меняться молча
          # не должно: по нему человек ищет, почему выпуск не состоялся.
          printf '::error::ВЫПУСК НЕ ИМЕЕТ ПРАВА ОПИРАТЬСЯ НА КЕШ: на пути выпуска задана %s=%s\n' \
            "$PEREMENNAYA" "$znachenie" >&2
          printf '::error::Кешу верят для СКОРОСТИ. Для ИСТИНЫ — проверяльщику (AGENTS.md, раздел «Кеш приговоров: где живёт и чему он НЕ основание»).\n' >&2
          printf '::error::Перед меткой всё пересчитывается начисто, без %s. Снимите переменную и повторите метку.\n' "$PEREMENNAYA" >&2
          printf '::error::Путь опознан как выпускной по: %s\n' "$otkuda" >&2
          svodka "## ✗ Выпуск оперся бы на кеш приговоров"
          svodka ""
          svodka "На пути выпуска задана \`$PEREMENNAYA=$znachenie\` (путь опознан по: $otkuda)."
          svodka "Правило \`AGENTS.md\`: кешу верят для СКОРОСТИ, для ИСТИНЫ — проверяльщику."
          svodka "Перед меткой всё пересчитывается начисто, без \`$PEREMENNAYA\`."
          exit 1
        fi

        if [ "$sostoyanie" = pusto ]; then
          printf 'путь выпуска (%s): %s задана ПУСТЫМ значением — кеша нет, ядро идёт прежней дорогой\n' \
            "$otkuda" "$PEREMENNAYA"
          svodka "## ✓ Выпуск считается начисто"
          svodka ""
          svodka "\`$PEREMENNAYA\` задана пустым значением — кеш выключен (путь опознан по: $otkuda)."
          exit 0
        fi

        printf 'путь выпуска (%s): %s не задана — приговоры пересчитываются начисто\n' \
          "$otkuda" "$PEREMENNAYA"
        svodka "## ✓ Выпуск считается начисто"
        svodka ""
        svodka "\`$PEREMENNAYA\` не задана (путь опознан по: $otkuda) — приговоры пересчитывает проверяльщик."
        exit 0
