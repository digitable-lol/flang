name: Сборка на macOS

# ПОЧЕМУ ОТДЕЛЬНОЙ РАБОТОЙ И НА КАЖДЫЙ ПУШ, В ОТЛИЧИЕ ОТ CI.
#
# `ci.yml` нарочно ходит только на тег: полный прогон идёт около двух часов, и
# на каждый коммит он занимал бы очередь ради состояния, которое никого уже не
# интересует. Довод верный, и трогать его незачем.
#
# Но 19 августа 2026 из-за него уехал релиз, который НЕ СОБИРАЕТСЯ НА MAC. В
# `flang_repl.c` стоит `#define _POSIX_C_SOURCE 200809L`; на glibc эта строка
# ОТКРЫВАЕТ `mkdtemp`, на Darwin — ЗАКРЫВАЕТ, потому что заголовки Apple считают
# видимость по `__DARWIN_C_LEVEL`. Под `-std=c99` clang добавляет
# `__STRICT_ANSI__`, уровень падает ещё ниже, и сборка встаёт на
# `call to undeclared function 'mkdtemp'` — с `-Werror` это остановка, а не
# предупреждение. `brew install digitable-lol/tap/flang` не доходил до конца ни
# у кого на Mac, и ни одна из трёх работ CI этого поймать не могла: все три
# идут на `ubuntu-latest`. Разбор —
# `docs/zettel/a-feature-macro-that-opens-on-glibc-closes-on-darwin.md`.
#
# Эта работа дешёвая — минуты, а не часы, — и Node ей не нужен вовсе. Довод
# «не занимать очередь» к ней не относится, поэтому она ходит на каждый пуш и
# на каждый запрос слияния. Тег тоже её запускает: `on: push` без фильтра ветки
# ловит и ветки, и теги.
#
# Node здесь не ставится НАРОЧНО. Путь установки, ради которого этот бинарник
# существует, обязан обходиться без Node, и работа, которой Node не выдали, это
# доказывает, а не обещает.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать точку раскрутки теми же флагами, что у Homebrew
        run: make -C bootstrap -j3 CFLAGS="-std=c99 -Wall -Wextra -Werror -pedantic -O2"
      # Собралось — ещё не значит работает. Проверяется то, что человек наберёт
      # первым, и настоящий файл дерева, а не выдуманный.
      - name: Собранный бинарник отвечает человеку
        run: |
          set -eu
          ./bootstrap/flang --version
          ./bootstrap/flang --help | grep -q "flang check"
          ./bootstrap/flang check flang/self/parser.flang
