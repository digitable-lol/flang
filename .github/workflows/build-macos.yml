name: Сборка на macOS

# ПОЧЕМУ ОТДЕЛЬНОЙ РАБОТОЙ И НА КАЖДЫЙ ПУШ, В ОТЛИЧИЕ ОТ CI.
#
# `ci.yml` нарочно ходит только на тег: полный прогон идёт около двух часов, и
# на каждый коммит он занимал бы очередь ради состояния, которое никого уже не
# интересует. Довод верный, и трогать его незачем.
#
# Но 19 августа 2026 из-за него уехал релиз, который НЕ СОБИРАЕТСЯ НА MAC. В
# `flang_repl.c` стоит `#define _POSIX_C_SOURCE 200809L`; на glibc эта строка
# ОТКРЫВАЕТ `mkdtemp`, на Darwin — ЗАКРЫВАЕТ, потому что заголовки Apple считают
# видимость по `__DARWIN_C_LEVEL`. Под `-std=c99` clang добавляет
# `__STRICT_ANSI__`, уровень падает ещё ниже, и сборка встаёт на
# `call to undeclared function 'mkdtemp'` — с `-Werror` это остановка, а не
# предупреждение. `brew install digitable-lol/tap/flang` не доходил до конца ни
# у кого на Mac, и ни одна из трёх работ CI этого поймать не могла: все три
# идут на `ubuntu-latest`. Разбор —
# `docs/zettel/a-feature-macro-that-opens-on-glibc-closes-on-darwin.md`.
#
# Эта работа дешёвая — минуты, а не часы, — и Node ей не нужен вовсе. Довод
# «не занимать очередь» к ней не относится, поэтому она ходит на каждый пуш и
# на каждый запрос слияния. Тег тоже её запускает: `on: push` без фильтра ветки
# ловит и ветки, и теги.
#
# Node здесь не ставится НАРОЧНО. Путь установки, ради которого этот бинарник
# существует, обязан обходиться без Node, и работа, которой Node не выдали, это
# доказывает, а не обещает.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать точку раскрутки теми же флагами, что у Homebrew
        run: make -C bootstrap -j3 CFLAGS="-std=c99 -Wall -Wextra -Werror -pedantic -O2"
      # Собралось — ещё не значит работает. Проверяется то, что человек наберёт
      # первым, и настоящий файл дерева, а не выдуманный.
      #
      # ── ЗЕЛЁНОЕ ЗДЕСЬ ДЕРЖАЛОСЬ НА СВОПЕ, И ВОТ ЗАМЕР ─────────────────────
      #
      # До 30 августа 2026 здесь стоял `flang/self/parser.flang` — тот самый
      # файл, который в `binary.yml` работу УБИВАЛ: 37,11 ГиБ пика при 15,6 ГиБ
      # раннера Linux (замер того же дня, `339e2dc8` и ствол `6c6ae04a`). Здесь
      # он при этом проходил зелёным, и зелёное это было ложным.
      #
      # ЗАМЕР НА САМОМ РАННЕРЕ macOS, прогон 33314900829 от 30 августа 2026,
      # ветка `probe/macos-memory-measured`, `/usr/bin/time -l` вокруг шага:
      #
      #   hw.memsize                       7 516 192 768 = 7,00 ГиБ
      #   hw.ncpu                          3
      #   своп ДО шага                     total 0,00 МБ   (файла свопа нет вовсе)
      #   своп ПОСЛЕ шага                  total 2048 МБ, занято 448,69 МБ
      #   maximum resident set size        3 353 083 904 = 3,12 ГиБ
      #   peak memory footprint           42 404 244 416 = 39,49 ГиБ
      #   время шага                       11 мин 16 с
      #
      # Читается это так: программа просила 39,5 ГиБ на машине, где памяти 7.
      # Занятой у неё оставалось 3,12 — остальное держали сжатие памяти Darwin и
      # файл свопа, которого до этого шага НЕ СУЩЕСТВОВАЛО: его завела macOS под
      # этот самый прогон. Проверка проходила не потому, что влезала, а потому,
      # что машина вытягивала её на диск.
      #
      # Цена этого видна и в ленте: сам шаг стоит 6 мин 46 с — 11 мин 16 с от
      # прогона к прогону при 65 с на сборку, то есть вся работа — это он, и
      # разброс у него двукратный. Так выглядит молотьба, а не счёт.
      #
      # ЧТО СДЕЛАНО. Здесь теперь `flang/core/parser.flang` — тем же ходом, что
      # и в `binary.yml` 30 августа (`339e2dc8`), и это возвращает двум дешёвым
      # гейтам один и тот же файл: они разъехались молча, и разъезд стоил
      # ложного зелёного на одной стороне и сотни красных прогонов на другой.
      #
      # Замер на своей машине, `/usr/bin/time -f '%M'`, семя 0.6.2, ствол
      # `6c6ae04a`:
      #
      #   flang check flang/self/parser.flang   471,38 с   37,11 ГиБ   код 0
      #   flang check flang/core/parser.flang    10,06 с    1,06 ГиБ   код 0
      #
      # `flang/core/parser.flang` — настоящий файл дерева и тоже разборщик, то
      # есть требование шага соблюдено дословно; у него все 280 функций с
      # доказанным завершением против 535 из 841 у `self/parser.flang`. Запас к
      # 7 ГиБ раннера — семикратный, и свопу тут делать нечего.
      #
      # ПРОВЕРЕНО НА ТОМ ЖЕ РАННЕРЕ, прогон 33316181233 от 30 августа 2026:
      # шаг занял **11 с** вместо 6 мин 46 с — 11 мин 16 с, вся работа —
      # 1 мин 46 с вместо 8–13 мин. Разброс, который был у прежнего файла,
      # исчез вместе с молотьбой.
      #
      # ЧЕГО ЭТА ПРАВКА НЕ ЧИНИТ. Тяжёлую самопроверку на Darwin не делает никто
      # и делать негде: раннера macOS с большой памятью у нас нет, а `runs-on:
      # [self-hosted, bolshaya-pamyat]` — это Linux. Разница между целями на
      # тяжёлом входе остаётся непроверенной, и это сказано здесь прямо, а не
      # прикрыто зелёной галочкой.
      - name: Собранный бинарник отвечает человеку
        run: |
          set -eu
          ./bootstrap/flang --version
          ./bootstrap/flang --help | grep -q "flang check"
          ./bootstrap/flang check flang/core/parser.flang
