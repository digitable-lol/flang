name: CI

# ПОЧЕМУ НЕ НА КАЖДЫЙ КОММИТ.
#
# Прогон идёт около двух часов: матрица версий Node, полный набор языка и гейт
# лицензий. При работе пачкой слияний это означало
# четыре одновременно висящих прогона на одну и ту же ветку, из которых полезен
# последний, — остальные считают состояние, которое уже никого не интересует, и
# при этом занимают очередь.
#
# Тег — это решение «вот эту версию наружу», и оно принимается отдельно от
# решения «влить ветку» (ровно так же рассуждает publish-npm.yml). Проверять
# имеет смысл именно его.
#
# `workflow_dispatch` оставлен, чтобы прогон можно было позвать руками, не
# заводя тега: ветку перед слиянием иногда надо проверить целиком, и без
# ручного запуска для этого пришлось бы возвращать пуш-триггер.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read


# ЭТА РАБОТА СЕЙЧАС НЕ ДОХОДИТ ДО ПЕРВОЙ ПРОБЫ, и это сказано здесь, а не
# оставлено выясняться по красному логу.
#
# Удаление реализации на JavaScript (`fe8e8a37`, 48 файлов, 56 072 строки)
# убрало `flang/src/*.mjs` и `flang/bin/flang.mjs`, но 196 файлов проб в
# `flang/test/` остались на месте. Замерено на этом дереве:
#
#   файлов проб в flang/test                                    196
#     не загружаются вовсе (ввозят удалённый модуль)            160
#     загружаются                                                36
#
# И до них дело всё равно не доходит: `npm test` начинается с `pretest`, а тот
# зовёт `scripts/preflight.mjs`, который ввозит удалённый
# `flang/src/targets.mjs` и падает с `ERR_MODULE_NOT_FOUND`. То есть `npm test`
# сегодня отдаёт ноль проб, а не «почти все».
#
# Чинить это здесь я не стал: решение, ЧТО из 196 файлов переписать на двоичный,
# а что выбросить вместе со второй реализацией, — не решение работы CI. Пока оно
# не принято, язык в CI проверяет `dvoichnyy.yml`: он собирает двоичный и гоняет
# им обходчики корпуса, и ему Node не нужен вовсе.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      # Вся история и все теги: журнал изменений печатается из них
      # (scripts/build-changelog.mjs), и flang/test/changelog.test.mjs сверяет
      # записанный файл с историей. Клон по умолчанию — одна ревизия без единого
      # тега, и в нём эта сверка сравнивать нечего с чем: она осталась бы
      # зелёной, ничего не проверив.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Двоичный собирается ДО прогона, потому что часть проб дерева ходит
      # именно в него, а без него не падает, а ПРОПУСКАЕТСЯ: корпусный режим
      # `flang test <каталог>` есть только у двоичного
      # (`flang/test/cli-test-corpus.test.mjs`). Пропуск в отчёте читается как
      # «всё хорошо», и до этой правки так и читался — двоичный не собирался в
      # CI на Linux ни разу. Сборка стоит около минуты на четырёх ядрах против
      # двух часов самого прогона; вместе с `FTS_REQUIRE_BINARY: 1` ниже это
      # превращает молчаливый пропуск в отказ.
      - run: make -C bootstrap -j"$(nproc)"
      # FTS_REQUIRE_TOOLCHAINS=c — не украшение, а включение самой сильной проверки
      # репозитория. Неподвижная точка самоприменения (flang/test/self-bootstrap.test.mjs)
      # без `cc` честно пропускается, а «пропущено» читается как «всё хорошо»: на образе
      # ubuntu-latest `cc` есть, но требования не было, и молчаливый пропуск ничем не
      # отличался бы от проверки.
      #
      # Требовать один только `c` стало возможно после починки узкого гейта: до неё ЛЮБОЕ
      # значение FTS_REQUIRE_TOOLCHAINS делало строгими все восемь тулчейнов, и эта строка
      # останавливала бы прогон на отсутствии Go, Rust и Java ещё до первого теста. Теперь
      # строгость распространяется на НАЗВАННЫЕ тулчейны (toolchainAbsenceBlocks в
      # flang/test/toolchain-guard.mjs), а остальные семь целей пропускаются осознанно
      # и названы в отчёте preflight поимённо.
      #
      # Точку раскрутки bootstrap/ это требование не стережёт и стеречь не должно: её
      # сторож сверяет байты, компилятор C ему не нужен, и он идёт всегда и везде.
      - run: npm test
        env:
          FTS_REQUIRE_TOOLCHAINS: c
          FTS_REQUIRE_BINARY: 1

  # Лицензионная разметка проверяется отдельной работой по той же причине, что
  # и подсветка ниже: она не зависит от версии Node и в матрице прогонялась бы
  # трижды впустую. Node ей больше не нужен вовсе — проверка написана на самом
  # языке, — но нужен компилятор, а он в дереве не лежит: `bootstrap/flang` это
  # продукт сборки, и без `make` его бы просто не было.
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/storozh-licenzii.flang

  # Ссылки в документации — по той же причине отдельно: зависимостей нет, и
  # сама проверка отвечает за пять секунд. Сборка сайта проверяет ссылки на
  # своих страницах; эта проверка — на всех 467 документах дерева, включая те,
  # что на сайт не попадают: 880 ссылок.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/storozh-ssylok.flang
