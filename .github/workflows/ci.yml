name: CI

# ПОЧЕМУ СНОВА НА КАЖДЫЙ ПУШ.
#
# 14 августа 2026 (`11b311ae`) пуш-триггер сняли, оставив метку и ручной запуск.
# Довод был такой: прогон идёт около двух часов, и при работе пачкой слияний
# на одну ветку висело четыре прогона разом, из которых полезен последний.
#
# ДОВОД БЫЛ ВЕРЕН, А ЛЕКАРСТВО НЕТ. Четыре висящих прогона лечатся отменой
# предыдущего прогона той же ветки (`concurrency` ниже) — она снимает ровно то,
# на что жаловались, и ничего кроме. Снятие пуш-триггера сняло вместе с очередью
# и надзор: последняя метка `v0.6.2` от 22 августа, и с тех пор ни одна из
# работ этого файла не ходила ни разу. За те девять дней покраснели три:
# `pravila` (23 авг), `progon` (26 авг), `oblast` (29 авг) — и никто не узнал.
#
# ДВУХ ЧАСОВ БОЛЬШЕ НЕТ. Их давал набор проб на JavaScript: 14 августа в
# `flang/test/` лежало 83 файла `*.test.mjs`, сегодня — 4 (реализацию на
# JavaScript сняли `fe8e8a38` и `105943cd`).
#
# ЧИСЛА ЗДЕСЬ СНЯТЫ ДВАЖДЫ И ВТОРАЯ СЪЁМКА ВАЖНЕЕ ПЕРВОЙ. Первая — 31 августа
# 2026 на стволе `03fb4060`, двоичный 0.6.2, до починки трёх красных работ
# (сборка семени `make -j4` = 1 мин 51 с, её платит каждая работа, кроме
# `semya` и `links`). Вторая — в тот же день, тем же прибором, на том же
# стволе, но ПОСЛЕ починки: три работы, падавшие на первом же расхождении,
# стали доходить до конца, и две из трёх цифр от этого выросли, а одна
# выросла в четырнадцать раз.
#
#                    до починки   после починки
#   semya                  2 с        —          licensing      4 с
#   postoyannye            6 с        —          komandy        8 с
#   links                  0 с        —          korpus         5 с
#   pechat                22 с        —          granica        3 с
#   progon                22 с       23 с
#   oblast                22 с       24 с
#   pravila               74 с     1055 с  = 17 мин 35 с
#
# ПОЧЕМУ `pravila` ВЫРОСЛА В ЧЕТЫРНАДЦАТЬ РАЗ, А НЕ «СТАЛА ДОЛЬШЕ». 74 секунды
# были не мерой работы, а мерой её ПАДЕНИЯ: первая половина сторожа находила
# расхождение списков и выходила кодом 1, и вторая половина — 23 живых прогона
# сверщика по настоящей записи доказательства — не начиналась вовсе. Починка
# первую половину зазеленила, и работа впервые с 23 августа дошла до конца.
# Мерить надо было то, что она делает, а не то, на чём она обрывалась.
#
# ОТСЮДА ГРАНИЦА ПЕРЕСЧИТАНА, А НЕ ПОДВИНУТА. Граница та же и объявлена до
# замеров: работа дороже пяти минут стенного времени вместе со сборкой семени
# на каждый пуш не идёт. По числам ПОСЛЕ починки под неё не проходят три
# работы, а не две: матрица Node (три раннера на один ответ), `stale-pages`
# (17 мин 55 с) и `pravila` (19 мин 26 с со сборкой) — последняя теперь самая
# дорогая работа файла.
#
# `pravila` РАЗРЕЗАНА ПО ПОЛОВИНАМ 31 августа (Ч99), и на пуш вернулась её
# дешёвая половина отдельной работой `pravila-spisok` — 3 мин 07 с со сборкой,
# замер там же, в пометке над работой. Что при этом уходит на метку и почему
# это терпимо, названо там же подделками и числом, а не обещанием. Поэтому на
# пуш идут одиннадцать работ, и самая долгая из них теперь `pravila-spisok`,
# 3 мин 07 с; `oblast` (2 мин 15 с) — вторая.
#
# Один прогон на пуш стоит по этим числам 19 мин 32 с машинного времени при
# 3 мин 07 с стенного (работы идут разом); прогон по метке — 95 мин 42 с
# машинного при 19 мин 26 с стенного, и стенное задаёт как раз `pravila`.
# ⚠ 19 мин 26 с — число Ч89; Ч99 намерила ту же работу на этой же машине под
# нагрузкой вдвое большей и получила 19 мин 37 с. Числа не спорят, разница
# в нагрузке; беру меньшее, чтобы не приукрасить границу задним числом.
#
# ⚠ ЧЕГО В ЭТИХ ЧИСЛАХ НЕТ, СКАЗАНО ПРЯМО: `apt-get install valgrind` у
# `oblast`, `npm ci` у `test` и `actions/setup-node` нигде не мерены — прибор
# стоял вокруг самих проверок и сборки семени, а не вокруг раннера. Числа
# сняты на 256-ядерной машине под нагрузкой; у раннера GitHub два ядра, и
# сборка семени там дороже. Считать их потолком нельзя, они пол.
#
# `workflow_dispatch` оставлен: ветку иногда надо проверить целиком руками.
# ── ВЫПУСК НЕ ОПИРАЕТСЯ НА КЕШ ПРИГОВОРОВ ────────────────────────────────────
#
# `AGENTS.md`, раздел «Кеш приговоров: где живёт и чему он НЕ основание», несёт
# правило, которое отменять нельзя: «Кешу верят для СКОРОСТИ. Для ИСТИНЫ — про-
# веряльщику. Выпуск не имеет права опираться на кеш: перед меткой всё пересчи-
# тывается начисто, без `FLANG_KESH_PRIGOVOROV`.»
#
# До 2 сентября 2026 правило было записано словами и не принуждалось ничем.
# Правило, которое ничто не исполняет, — не правило: сторож столкновений имён
# уже лежал в дереве, его никто не звал, и это стоило двадцати часов машины.
# Теперь его принуждает составное действие `.github/actions/release-without-cache`
# (почему не файл в `scripts/` — разобрано в его шапке), и шаг
# «Выпуск не опирается на кеш приговоров» стоит ПЕРВЫМ после выкладки —
# в каждой из семнадцати работ этого файла.
#
# ПОЧЕМУ В КАЖДОЙ РАБОТЕ, А НЕ В ОДНОЙ. Работы независимы: у каждой свой раннер
# и своя среда, и заглянуть в чужую ни одна не может. Сторож в одной работе
# ничего не говорит про остальные — а метка выпускает то, что сказали ВСЕ
# вместе. Выбрать подмножество значило бы оставить дыры ровно там, куда не
# посмотрели. Четыре работы файла и вовсе живут только меткой (`zhargon`,
# `test`, `pravila`, `stale-pages`), а остальные тринадцать метка тоже гоняет.
#
# ПОЧЕМУ ПАДАЕТ, А НЕ СНИМАЕТ ПЕРЕМЕННУЮ МОЛЧА. Снять её можно только блоком
# `env:` работы — а он затирает значение ДО сторожа, и сторож был бы зелен
# всегда, ничего не проверяя. Молчаливое снятие вдобавок прячет находку:
# заданная на пути выпуска переменная — признак того, что выпуск настроен
# неправильно, и это надо увидеть один раз глазами, а не глотать каждый раз.
#
# На ветке и в запросе слияния сторож молчит: кеш там разрешён и нужен, он для
# скорости. Красным он бывает только на метке. Ручной запуск выпуском НЕ
# считается: шапка выше говорит прямо — «`workflow_dispatch` оставлен: ветку
# иногда надо проверить целиком руками», а проверка ветки руками не выпуск.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# ЛЕКАРСТВО ОТ «ЧЕТЫРЁХ ВИСЯЩИХ ПРОГОНОВ», ради которого сняли пуш-триггер.
# Новый пуш той же ветки отменяет предыдущий её прогон: считать состояние,
# которое уже никого не интересует, незачем, и очередь оно занимать перестаёт.
#
# НА МЕТКЕ НЕ ОТМЕНЯЕМ. Метка — решение «вот эту версию наружу», её прогон
# единственный и отменять его нечем: следующая метка это другая версия, а не
# то же самое состояние заново. Поэтому `cancel-in-progress` ложно на
# `refs/tags/*` и истинно на ветках.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read


# СКОЛЬКО ФАЙЛОВ ПРОБ ЗАВОДИТСЯ — СПРАШИВАЕТСЯ ПРОГОНОМ, А НЕ ЭТОЙ ПОМЕТКОЙ.
#
# Удаление реализации на JavaScript (`fe8e8a38`, 48 файлов, 56 072 строки)
# убрало `flang/src/*.mjs` и `flang/bin/flang.mjs`, а файлы проб, ввозившие их,
# остались. Они перестали ЗАГРУЖАТЬСЯ — и ни один набор этого не показал: файл,
# упавший на ввозе, не печатает ни одного проваленного утверждения, печатать
# нечего. Тогда счёт был 196 файлов, из них 160 не загружались.
#
# Число это здесь БОЛЬШЕ НЕ ЖИВЁТ, и это главное изменение: пометка в шапке
# устаревает молча, а прогон — нет. Считает его
# `flang/scripts/guards-start.flang` (ярлык `сторожа:проверка`), он ходит
# на КАЖДЫЙ пуш работой `storozha` в `binary.yml`, отвечает числом и красным
# кодом возврата, и «мне нечем смотреть» отличает от «предмет плох».
#
# `scripts/preflight.mjs`, стоявший перед прогоном и печатавший таблицу целей,
# удалён 20 августа: он ввозил удалённый `flang/src/targets.mjs` и падал с
# `ERR_MODULE_NOT_FOUND` раньше первой пробы, а список целей и проб к ним жил
# только в том удалённом модуле. Таблицы «какая цель проверяется
# по-настоящему» с тех пор нет.
#
# Язык в CI проверяет `binary.yml`: он собирает двоичный и гоняет им
# обходчики корпуса, и ему Node не нужен вовсе.

jobs:
  # ДИСЦИПЛИНА СЕМЕНИ идёт ПЕРВОЙ, и это единственная работа, которой не нужно
  # ничего: ни Node, ни `make`, ни двоичного. Она читает `.flang` дерева и
  # `bootstrap/*.c` глазами — 1245 файлов за полторы секунды.
  # СНЯТО 2026-09-04 файлов *.flang = 1245
  #
  # Первой она стоит потому, что нарушение этого правила обесценивает ВСЕ
  # остальные работы разом. 24 августа 2026 имя типа «неотрицательное» ввели в
  # исходники и там же применили — одним изменением. Семя о слове не знает и
  # узнать может только перепечаткой, а перепечатка читает эти же исходники:
  # ствол перестал проверяться НИ ОДНИМ существующим двоичным. Полдня ушло на
  # откат, и откат вышел неполным — 26 августа нашлось ещё 180 применений в
  # 78 файлах (задача 0034).
  #
  # Порядок трёхшаговый: ввести имя, НЕ применяя; перепечатать семя; применить.
  # Шаги 1 и 3 в одном изменении ломают дерево, и ловится это здесь.
  #
  # Подлог гоняется ПЕРЕД проверкой: сторож, разучившийся краснеть, зеленел бы
  # ровно так же, как чистое дерево, и разницы в ленте не было бы видно.
  semya:
    name: seed-words
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - name: сторож краснеет на подложенном слове
        run: |
          if sh scripts/seed-knows-type-words-guard.sh --подлог; then
            echo "сторож промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi
        env:
          FLANG_TMP: ${{ runner.temp }}
      - name: слова в позициях типа известны закоммиченному семени
        run: sh scripts/seed-knows-type-words-guard.sh
        env:
          FLANG_TMP: ${{ runner.temp }}

  # ЧИСЛО, НАБРАННОЕ В ПРОЗЕ РУКОЙ, ОБЯЗАНО СХОДИТЬСЯ С ДЕРЕВОМ СЕГОДНЯ.
  #
  # 31 августа 2026 в дереве нашлось 31 место в 14 файлах, где записанное рукой
  # число разошлось с тем, что лежит рядом: `docs/tree-inventory.md` считала
  # `seed-parses-sources-guard.sh` в 83 строки при 195, оболочку — в 66 файлов
  # при 71 тогдашних — сегодня их 94;
  # СНЯТО 2026-09-03 файлов *.sh = 94 `flang/cat/SPEC.md` обещала восемнадцать поручений при 22;
  # `flang/PLAN.md` — пять вариантов «Поручение» при 22. Каждое из этих чисел
  # было ВЕРНО В ДЕНЬ ЗАПИСИ и солгало назавтра, и сторожа не было ни на одном.
  #
  # Опись при этом стоит проверкой на каждый пуш — но та работа стережёт ДОЛГ
  # (храповик «долг не вырос»), а не числа в таблице. Сторож был зелен, таблица
  # врала. Здесь стережётся именно проза.
  #
  # Подлог гоняется ПЕРЕД сверкой — по тому же доводу, что и у сторожа слов
  # выше: сторож, разучившийся краснеть, в ленте не отличим от чистого дерева.
  proza:
    name: prose-numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - name: сторож чисел краснеет на подложенном числе
        run: |
          if sh scripts/prose-numbers-guard.sh --подлог; then
            echo "сторож промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi
      - name: числа, набранные в прозе рукой, сходятся с деревом
        run: sh scripts/prose-numbers-guard.sh

  # ЗАДАЧНИК СВЕРЯЕТСЯ АВТОМАТИКОЙ, А НЕ ПО ПАМЯТИ.
  #
  # 5 сентября 2026 сторож `задачник:проверка` дал 221 замечание — и ни одно из
  # них не было новым: ярлык существовал, но его не звал НИ ОДИН workflow, и
  # разъезд копился месяцами, потому что смотреть было некому. Нашли его
  # случайным ручным прогоном (задача 9990), а не воротами.
  #
  # Из 221 замечания 163 оказались одной бедой (сторож не знал про
  # `tasks/completed/`, куда уехали закрытые задачи), остальные — разнобоем
  # словаря статусов. Обе починены, остаток в 14 замечаний разобран поимённо
  # (задача 9995). Сегодня сторож зелёный, поэтому шаг ставится НАСТОЯЩИМИ
  # воротами, без `continue-on-error`: у него нет признанного долга, который
  # такую поблажку оправдывал бы (в отличие от работы `links` ниже, где долг
  # назван числом и объяснён).
  zadachnik:
    name: task-tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      # Сторожу верят только после того, как он покраснел на подлоге: зелёный
      # сторож, не умеющий краснеть, — это не проверка, а её изображение.
      - name: сторож задачника краснеет на подложенном статусе
        run: |
          set -u
          # Имя переменной — латиницей: POSIX не допускает кириллицу в именах
          # переменных оболочки, и `файл=...` было бы разобрано как команда.
          podlog=tasks/1315-vremennoe-v-dereve-ishodnikov.md
          sed -i 's/^статус: свободна$/статус: сделяно (подлог)/' "$podlog"
          if ./ярлык задачник:проверка; then
            git checkout -- "$podlog"
            echo "сторож промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi
          git checkout -- "$podlog"
      - name: задачник цел
        run: ./ярлык задачник:проверка

  # СЕМЯ ОБЯЗАНО СОБИРАТЬСЯ ТЕМИ ФЛАГАМИ, КОТОРЫЕ САМО ЖЕ И ПРОСИТ.
  #
  # Прогон по тегу — это решение «вот эту версию наружу», а наружу едет именно
  # семя: из него человек собирает компилятор одним `make`, и `bootstrap/Makefile`
  # обещает ему `-std=c99 -pedantic -Werror`, то есть переносимый C99.
  #
  # 29 августа 2026 обещание оказалось ложью. Перепечатка дошла до конца за
  # 6 ч 23 мин, а `make -C bootstrap` упал за 37,17 с: строковая постоянная в
  # 4614 знаков при обещанных C99 4095 (5.2.4.1, счёт ПОСЛЕ склейки соседних).
  # Семя при этом годное — без `-pedantic` оно собирается за 101 с и двоичный
  # работает; сломана ПАРА, печать и её собственное обещание.
  #
  # Выпустить такое семя значило бы выпустить сборку, которая не собирается у
  # того, кто поверил Makefile на слово. Сторож считает это за 2,96 с.
  postoyannye:
    name: c99-limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      # Двоичный нужен живой: вопрос «умеет ли печать резать длинную
      # постоянную» задаётся ПРОГОНОМ печати. Чтением исходников на него не
      # ответить — печатью правит эмиттер, зашитый в двоичный, а не тот, что
      # лежит в дереве.
      - run: make -C bootstrap -j"$(nproc)"
      - name: сторож краснеет на подложенной длинной постоянной
        run: sh scripts/overlong-string-guard.sh --подлог
        env:
          FLANG_TMP: ${{ runner.temp }}
      - name: длинных строковых постоянных нет ни в семени, ни во входах печати
        run: sh scripts/overlong-string-guard.sh
        env:
          FLANG_TMP: ${{ runner.temp }}

  # ДВА РАЗНЫХ ИМЕНИ, ДАЮЩИЕ ОДИН ИДЕНТИФИКАТОР, — ЗА 0,36 с, А НЕ ЗА 10 ЧАСОВ.
  #
  # Печать в C отказывает на такой паре сама, но узнаёт о ней только после
  # связывания: 580 с на компиляторе, а до перестановки проверки (задача 1174)
  # — 35 760 с. Дважды за трое суток это кончалось сожжённой перепечаткой:
  # 9 ч 56 мин 31 августа и ещё 20 ч 54 мин двумя заходами 2 сентября.
  #
  # Сторож считает то же самое по правилу, ПРОЧИТАННОМУ из
  # `flang/self/emit-c.flang` (замены кириллицы, словарные символы,
  # зарезервированные в C), и на дереве `ef718648` краснеет кодом 1. До этой
  # строки его не звала ни одна проверка — сторож, которого никто не зовёт, от
  # отсутствующего неотличим.
  stolknoveniya:
    name: id-collisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: имена замыкания компилятора не схлопываются после «Змейки»
        run: node scripts/latin-collision-guard.mjs

  # ДЕШЁВАЯ ЧЕТВЕРТЬ НАБОРА, ВЫНЕСЕННАЯ ОТДЕЛЬНО, ЧТОБЫ ХОДИТЬ НА ПУШ.
  #
  # Из четырёх файлов `flang/test/*.test.mjs` дорог не набор, а три из них:
  # `nadzor-uzla`, `planirovshchik-celi` и `svyaz-celi` печатают в восемь целей
  # и поднимают упавшие процессы на восьми языках. Замер 31 августа 2026, ствол
  # `03fb4060`: весь `npm test` — 11 мин 02 с, пик 3,87 ГиБ; один
  # `jargon-guard.test.mjs` — 3,49 с. Разница в 190 раз, и вся она в трёх
  # файлах, которым нужны восемь тулчейнов.
  #
  # ⚠ КРАСНА СЕГОДНЯ — НА ПУШ ВКЛЮЧАЕТСЯ ПОСЛЕ ПОЧИНКИ: 6 проб из 14 не
  # проходят. Одна называет дерево — внутренние слова на страницах сайта без
  # записанного долга (`docs/site/cli.ru.md:219`, `docs/site/kak-dokazat.ru.md`
  # и др.); пять — про сам сторож: пробы «КРАСНЕЕТ» берут `README.ru.md`, у
  # которого записанного долга нет вовсе («возьмите для этой проверки другой
  # файл»). Починка: долг страниц пересчитать, пробам дать файл с долгом.
  zhargon:
    name: jargon
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test flang/test/jargon-guard.test.mjs

  # ⚠ ДОРОГА: 11 МИНУТ НА ОДНОЙ ВЕРСИИ NODE, ТРИДЦАТЬ ТРИ НА ТРЁХ.
  #
  # Замер 31 августа 2026, ствол `03fb4060`, двоичный 0.6.2, один прогон
  # `npm test`: 662 с стенного времени, пик занятой памяти 3,87 ГиБ, код 1
  # (проб 38, не прошло 10). Из 662 секунд 658 приходятся на три файла из
  # четырёх — те, что печатают в восемь целей и поднимают процессы на восьми
  # языках. Дешёвый четвёртый вынесен выше отдельной работой.
  #
  # Матрица умножает это на три: три раннера заново ставят зависимости, заново
  # собирают семя (`make -C bootstrap -j4` = 1 мин 51 с) и отвечают одно и то
  # же — разойтись они могут только на зависящем от версии Node. Это и есть
  # та половина «двух часов», ради которой 14 августа сняли пуш-триггер; она
  # и остаётся на метке, а остальные двенадцать работ файла — нет.
  test:
    name: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      # Вся история и все теги: журнал изменений печатается из них
      # (scripts/build-changelog.mjs), и flang/test/changelog.test.mjs сверяет
      # записанный файл с историей. Клон по умолчанию — одна ревизия без единого
      # тега, и в нём эта сверка сравнивать нечего с чем: она осталась бы
      # зелёной, ничего не проверив.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      # `cache: npm` снят вместе с `package-lock.json`: без замка ключ падает
      # с «unable to cache dependencies». Шага `npm ci` тоже больше нет —
      # зависимостей у дерева ноль, а единственным его делом был `postinstall`,
      # собиравший двоичный в `dvoichnyy/`, куда здесь никто не смотрит.
      # Двоичный собирается шагом ниже, и всегда собирался только им.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      # Двоичный собирается ДО прогона, потому что часть проб дерева ходит
      # именно в него, а без него не падает, а ПРОПУСКАЕТСЯ: корпусный режим
      # `flang test <каталог>` есть только у двоичного (судит его теперь
      # `scripts/corpus-runner.flang`). Пропуск в отчёте читается как
      # «всё хорошо», и до этой правки так и читался — двоичный не собирался в
      # CI на Linux ни разу. Сборка стоит около минуты на четырёх ядрах против
      # двух часов самого прогона; вместе с `FTS_REQUIRE_BINARY: 1` ниже это
      # превращает молчаливый пропуск в отказ.
      - run: make -C bootstrap -j"$(nproc)"
      # FTS_REQUIRE_TOOLCHAINS=c — было включением самой сильной проверки репозитория:
      # неподвижная точка самоприменения (flang/test/self-bootstrap.test.mjs) без `cc`
      # честно пропускалась, а «пропущено» читается как «всё хорошо».
      #
      # ⚠ ЭТОТ КЛЮЧ СЕГОДНЯ НЕ ВКЛЮЧАЕТ НИЧЕГО. Проверка, ради которой он поставлен,
      # снята 20 августа 2026 коммитом `105943cd`; сегодня это не стережёт ничто. В `flang/test/` осталось четыре
      # файла `*.test.mjs` (`jargon-guard`, `nadzor-uzla`, `planirovshchik-celi`,
      # `svyaz-celi`), и ни один из них тулчейнов не спрашивает. Ключ оставлен, чтобы
      # не менять поведение вслепую, но числа за ним больше нет.
      #
      # Требовать один только `c` стало возможно после починки узкого гейта: до неё ЛЮБОЕ
      # значение FTS_REQUIRE_TOOLCHAINS делало строгими все восемь тулчейнов, и эта строка
      # останавливала бы прогон на отсутствии Go, Rust и Java ещё до первого теста. Теперь
      # строгость распространяется на НАЗВАННЫЕ тулчейны (toolchainRequired в
      # flang/test/toolchain-guard.mjs), а остальные семь целей пропускаются осознанно —
      # но НАЗЫВАТЬ их поимённо теперь нечему: отчёт preflight удалён вместе со
      # списком целей, который жил во второй реализации.
      #
      # Точку раскрутки bootstrap/ это требование не стережёт и стеречь не должно.
      # Здесь стояло «её сторож идёт всегда и везде» — НЕПРАВДА с 105943cd: сторож
      # (flang/test/self-bootstrap.test.mjs) удалён вместе с реализацией на
      # JavaScript, и семя с того дня не сверял никто. Сторожит его теперь работа
      # «semya» в binary.yml — она ходит на каждый пуш и стоит полсекунды.
      # Был `npm test` — это ровно `./ярлык тесты`. npm не делал здесь ничего,
      # кроме подстановки строки из `package.json`.
      - run: ./ярлык тесты
        env:
          FTS_REQUIRE_TOOLCHAINS: c
          FTS_REQUIRE_BINARY: 1

  # Лицензионная разметка проверяется отдельной работой по той же причине, что
  # и подсветка ниже: она не зависит от версии Node и в матрице прогонялась бы
  # трижды впустую. Node ей больше не нужен вовсе — проверка написана на самом
  # языке, — но нужен компилятор, а он в дереве не лежит: `bootstrap/flang` это
  # продукт сборки, и без `make` его бы просто не было.
  licensing:
    name: licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/license-guard.flang

  # ── ССЫЛКИ: НАЗАД НА ОБЫЧНЫЙ РАННЕР, НО ПОКА СОВЕТОМ, А НЕ ПРИГОВОРОМ ────
  #
  # Проверка читает ВСЕ документы дерева, включая те, что на сайт не попадают,
  # и в этом её смысл: сборка сайта смотрит только на свои страницы.
  #
  # ПОЧЕМУ БОЛЬШАЯ ПАМЯТЬ БОЛЬШЕ НЕ НУЖНА. Пометка «15,02 ГиБ» здесь стояла с
  # 30 августа 2026 (ствол `6c6ae04a`) и была верна В ТОТ ДЕНЬ, но описывала
  # ДВА разных изменения разом, которых с тех пор не стало: (1) семя того дня
  # было напечатано БЕЗ хвостовых вызовов (`c15f669f`, 31 августа, вернул их
  # компилятору и снял 2783 проверки) — рекурсивный обход 1000+ файлов без
  # хвостового вызова копит кадры вместо того, чтобы держать их в одном; (2)
  # проверки в кавычках («Ч41-ssylki», 31 августа) тогда ещё не было. Замер
  # ячейки Ч57, ствол `03fb4060` + правка проверки в кавычках, двоичный
  # `bootstrap/flang` собран из этого же дерева, прогон `bootstrap/flang io
  # scripts/link-guard.flang` ИЗ ДЕРЕВА (`/usr/bin/time -v`):
  #
  #   4 мин 38,90 с, пик занятой памяти 1 289 312 кБ = 1,23 ГиБ, код 1
  #   (2136 битых из 12507 — правка ниже сводит их к настоящим находкам)
  #
  # 1,23 ГиБ вместо 15,02 — «раннер GitHub» (14,66 ГиБ свободных, замер того
  # же 30 августа) снова достаточен. Кто перемеряет после следующей
  # перепечатки семени — сверяйте оба числа заново, а не верьте на слово: цена
  # уже один раз тихо выросла в 8 раз от одной только правки кавычек (45 с →
  # около 280–380 с), и ничто не мешает памяти повести себя так же.
  #
  # ПОЧЕМУ НЕ ГЕЙТ С ПЕРВОГО ДНЯ. Даже после правки кавычек и списка известных
  # не-путей (`scripts/link-guard-known-not-a-path.tsv`, ячейка Ч57) в дереве
  # остаётся порядка 470–500 подтверждённых историей мёртвых ссылок — работа
  # ячеек Ч41/Ч57 их находит и называет, но НЕ чинит: это отдельный объём
  # работы. Сделать этот шаг обязательным сегодня — значит покрасить CI на
  # каждый тег, пока эта работа не сделана, а красные ворота с первого дня
  # обесценивают все остальные. Поэтому шаг идёт ВСЕГДА (не спрятан за
  # переменную и не притворяется «Skipped»), печатает правду в сводку, но
  # `continue-on-error: true` — красный шаг виден, тег не блокирует.
  #
  # КОГДА ДЕЛАТЬ ГЕЙТОМ. Два пути, оба меньше «почини все ~500 разом»:
  #   (а) снять `continue-on-error`, когда подтверждённый список сведён к
  #       нулю (отдельная работа, не эта ячейка);
  #   (б) завести ВТОРОЙ закрытый список — снимок сегодняшних подтверждённых
  #       находок (по образцу `scripts/link-guard-known-not-a-path.tsv`, но
  #       без пометки «не путь»: это настоящие дыры на исправление) — и
  #       гейтить только НОВОЕ сверх снимка, чтобы регресс ловился сегодня, а
  #       старый долг чинился отдельно и снимался из снимка по мере починки.
  # Путь (б) можно включить раньше пути (а); что выбрать — решение владельца.
  links:
    name: links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      - name: Прогнать сторож и сказать правду в сводку независимо от вердикта
        run: |
          set -u
          echo "## Ссылки в документации" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if bootstrap/flang io scripts/link-guard.flang > /tmp/link-guard.out 2> /tmp/link-guard.err; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/link-guard.out >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**СТОРОЖ КРАСЕН** (это пока совет, не приговор — тег не заблокирован):" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/link-guard.out /tmp/link-guard.err >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Мёртвые ссылки::сторож ссылок красен — подробности в сводке прогона"
            exit 1
          fi

  # ── РАБОТА «komandy» СНЯТА 3 СЕНТЯБРЯ 2026 ВМЕСТЕ С npm ──────────────────
  #
  # Она гоняла `scripts/commands-via-symlink.flang`: команды пакета, позванные
  # ЧЕРЕЗ СИМВОЛЬНУЮ ССЫЛКУ — так, как их кладёт npm в `node_modules/.bin/`.
  # Список команд сторож брал из раздела `bin` в `package.json`; раздела больше
  # нет, и сторож отвечал «в разделе bin пакета команд 0 — package.json
  # урезали? смотреть нечем».
  #
  # ЧТО ИМЕННО ОН ЛОВИЛ. Версия 0.4.0 уехала в реестр МОЛЧАЩЕЙ: `flang` печатал
  # ноль байт и выходил кодом 0. Причина — страж точки входа на Node,
  # сравнивавший `import.meta.url` с `process.argv[1]` как строки: Node
  # разрешает ссылку для первого и не разрешает для второго. Породу эту умеет
  # только Node, и точек входа на Node в дереве больше нет — обе обёртки
  # (`packaging/flang-launch.mjs`, `flang/bin/flang-lsp.mjs`) удалены. Само
  # написание запрещено сторожем `flang/scripts/direct-run-guard.mjs`, который
  # ходит по всем `.mjs` дерева и краснеет на возврат породы.
  #
  # ЖИВОЙ ЗАПУСК ЧЕРЕЗ ССЫЛКУ ПРИ ЭТОМ НЕ ПОТЕРЯН: `brew` кладёт двоичный
  # ссылкой из Cellar, и работа `brew` в `install-path.yml` ставит формулу
  # по-настоящему и гоняет её блок `test do`.

  # Печать не печатает непроверенного, а что из проверок печать не делает —
  # названо в её же справке. Отдельной работой: зависимостей нет, десять секунд.
  pechat:
    name: emit-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/emit-and-examples.flang

  # Прогонщик корпуса: каталог, маска и ведомость строкой. Отдельной работой —
  # зависимостей нет, семь секунд.
  korpus:
    name: corpus-runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/corpus-runner.flang

  # test проверяет программу прежде, чем прогонять её примеры, а --no-check
  # снимает ровно проверку. Отдельной работой: зависимостей нет, двенадцать секунд.
  # ПОЧИНЕНА, И ПОЭТОМУ ИДЁТ НА КАЖДЫЙ ПУШ — УСЛОВИЯ ЗДЕСЬ БОЛЬШЕ НЕТ.
  # Была красна с 26 августа: код 1, расхождений 3 — «в ответе нет "total":69»
  # и «нет "passed":64». Числа 69/64 вписаны в `scripts/check-before-run.flang`
  # 24 августа (`b3167200`) и описывали `flang/stdlib/lists.flang` того дня;
  # файл с тех пор трогали четырежды, примеров стало 82. Узнать об этом было
  # неоткуда: последняя метка — 22 августа.
  #
  # ПОЧИНЕНО НЕ ПОДСТАНОВКОЙ 82 ВМЕСТО 69. Число примеров теперь БЕРЁТСЯ из
  # отчёта первого шага и служит меркой остальным, а сверяются отношения, от
  # размера библиотеки не зависящие: на целой программе прошли все; у порченого
  # ровно столько же примеров; прошло плюс упало равно всем; упало не ноль;
  # прошло не ноль. Подстановка нового числа завела бы ту же мину со сроком
  # через неделю. Проверено ростом дерева: работа осталась зелёной без правки
  # после того, как примеров в библиотеке стало больше.
  #
  # 22,72 с (замер 31 августа 2026, ствол `03fb4060`, ПОСЛЕ починки; со сборкой
  # семени 2 мин 14 с) — вдвое дешевле границы, за которой работу снимают с пуша.
  progon:
    name: pretest-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/check-before-run.flang

  # Граница входа: довод «--args» сверяется объявленному типу до вычисления.
  # Отдельной работой: зависимостей нет, две секунды.
  granica:
    name: input-bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/input-boundary.flang

  # Область на вызов в цели C: двенадцать проб на самом C, собранных теми же
  # флагами, что и напечатанное, плюс валгринд и настоящая сортировка вставками
  # под пределом памяти. Отдельной работой: нужен только компилятор, 18 секунд.
  # ПОЧИНЕНА, И ПОЭТОМУ ИДЁТ НА КАЖДЫЙ ПУШ — УСЛОВИЯ ЗДЕСЬ БОЛЬШЕ НЕТ.
  # Была красна с 29 августа: код 1, FLANG_OBLAST_NECHEM_SMOTRET — «двоичный не
  # напечатал пробу в C… смотреть нечем, и это не приговор области». Проба,
  # вшитая в `scripts/region-in-c-target.flang`, ввозила модуль как «Быстрая
  # сортировка», а `03f0359a` (переименование 206 модулей) назвал его
  # «Quicksort». Сторож при этом был честен — он говорил «смотреть нечем», а не
  # выдавал зелень; красным его делала именно эта честность.
  #
  # ПОЧИНЕНО НЕ ПОДСТАНОВКОЙ НОВОГО ИМЕНИ. Имя модуля берётся из самого файла
  # библиотеки, а не переписывается в пробу рукой: проверено переименованием —
  # работа осталась зелёной без правки после того, как модуль назвали иначе.
  #
  # 24,23 с (замер 31 августа 2026, ствол `03fb4060`, ПОСЛЕ починки; со сборкой
  # семени 2 мин 15 с — самая долгая работа этого файла из идущих на пуш).
  # В эти числа НЕ входит `apt-get install valgrind` шагом ниже: он не мерен.
  oblast:
    name: c-region
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/region-in-c-target.flang

  # Закрытый список правил сведения сверщика против набора имён, которые ядро
  # способно поставить в поле правила. Разошлись они однажды молча — и честная
  # запись честной программы была отвергнута как подделка. Отдельной работой:
  # нужен только компилятор, две минуты.
  # ПОЧИНЕНА — И ВСЁ РАВНО НЕ НА ПУШ. ЕДИНСТВЕННАЯ ИЗ ТРЁХ, У КОТОРОЙ ТАК.
  #
  # Была красна с 23 августа: код 1, СВЕРКА_ПРАВИЛ_РАЗОШЛОСЬ — «ядро ставит
  # имена, которых в закрытом списке сверщика НЕТ (честная запись с ними будет
  # отвергнута как подделка): начало по построению». Десятое правило заведено в
  # ядре (`9b109ccc`) на следующий день после метки `v0.6.2`; список сверщика с
  # того дня знал 16 имён из 17. Пометка над списком обещала «разойдутся при
  # следующем новом правиле — сторож покраснеет». Сторож покраснел. Его просто
  # не звали восемь суток. Починено: имя дописано, `обеспечивает «длина
  # списка»` — с 16 на 17.
  #
  # И ТУТ ОКАЗАЛОСЬ, ЧТО ЦЕНЫ ЭТОЙ РАБОТЫ НИКТО НЕ ЗНАЛ. 74 секунды, по которым
  # её сюда записывали, — это время ПАДЕНИЯ на первой половине; вторая, 23
  # живых прогона сверщика по настоящей записи доказательства, не начиналась.
  # Зелёный прогон целиком: 1055,18 с = 17 мин 35 с, со сборкой семени
  # 19 мин 26 с (замер 31 августа 2026, ствол `03fb4060`, ПОСЛЕ починки).
  # Это самая дорогая работа файла — дороже `stale-pages` (17 мин 55 с) и
  # дороже одной ноги матрицы Node (12 мин 53 с).
  #
  # ГРАНИЦУ ЗАДНИМ ЧИСЛОМ НЕ ДВИГАЕМ. «Дороже пяти минут — не на каждый пуш»
  # объявлено ДО замеров и принято обеими мерившими ячейками как то, что их
  # вывод опровергнет. 19 минут больше пяти в четыре раза. Подвинуть черту,
  # увидев число, — та же порода, что вписать 82 вместо 69.
  #
  # ВЕЕР ИЗ 22 ОПЫТОВ ПОСЧИТАН И ОТВЕРГНУТ. Опыты правда независимы, но веер
  # платит сборку семени на каждой ноге: 22 × (1 мин 51 с сборки + ~43 с опыта)
  # = 59 мин 33 с машинного времени против нынешних 19 мин 26 с — втрое дороже
  # на каждом пуше, при 22 раннерах разом. И даже так под пять минут он не
  # уходит: список имён рождает ПЕРВАЯ половина, значит веер от неё зависит, и
  # стенное время выходит 3 мин 05 с + 2 мин 34 с = 5 мин 39 с. Веер платит
  # втрое, занимает 22 раннера и границу всё равно не берёт.
  #
  # РАЗРЕЗАНА ПО ПОЛОВИНАМ, И СПОР С АВТОРОМ СКРИПТА РЕШЁН, А НЕ ОБОЙДЁН (Ч99,
  # 31 августа 2026). Шапка `flang/proof/сверка-правил.sh` говорила «одна
  # половина без другой ничего не значит». Довод верен про СЛОВО «сошлось», а
  # не про прогон: первая половина, напечатав своё «сошлось всё», обещала бы
  # живой прогон, которого не было. Поэтому ключ `--только-первая` печатает
  # другое слово — ровно то, что проверил, и сам называет, чего не спрашивал.
  # Довод в шапке сужен, а не вычеркнут.
  #
  # ЧТО ОСТАЁТСЯ НА ПУШЕ И ЧТО УХОДИТ НА МЕТКУ — ПРОВЕРЕНО ПОДДЕЛКАМИ:
  #   остаётся: ядро завело правило, которого нет в списке сверщика (порода
  #     23 августа слово в слово: «начало по построению», `9b109ccc`) — одна
  #     первая половина, код 1, имя названо;
  #   остаётся: в списке числится имя, которого ядро не ставит;
  #   уходит на метку: порча самого СВЕРЩИКА, оставляющая литералы списка
  #     целыми. Двумя подделками показано: первая половина зелена, а вторая
  #     краснеет 4 проверками из 23 — и в одной из подделок честная запись
  #     отвергается как подделка, то есть СИМПТОМ 23 августа проходит при
  #     зелёной первой половине. Это и есть цена деления, названная числом.
  #
  # ЗАМЕР Ч99, эта же машина, `/usr/bin/time` вокруг вызова, чужая нагрузка
  # load average 33…53: одна первая половина 76,4 с (разброс по шести прогонам
  # 76,0…99,9 с — его задаёт нагрузка, не работа), сборка семени 110,8 с,
  # вместе 3 мин 07 с — под границей впятеро. Обе половины: 1066,3 с =
  # 17 мин 46 с, со сборкой 19 мин 37 с. Числа Ч89 подтверждены, не заменены.
  pravila-spisok:
    name: rules-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      - run: sh flang/proof/сверка-правил.sh --только-первая
        env:
          FLANG_TMP: ${{ runner.temp }}

  # ВТОРАЯ ПОЛОВИНА — ЖИВОЙ ПРОГОН — на метке, и без ключа: там зовутся ОБЕ.
  # 19 мин 37 с со сборкой против границы в пять минут; на пуш она не идёт, и
  # это названо ценой, а не удобством.
  pravila:
    name: rules-check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"
      - run: sh flang/proof/сверка-правил.sh
        env:
          FLANG_TMP: ${{ runner.temp }}

  # Ключи командной строки описаны ДВАЖДЫ: рукописной оболочкой на C и эталоном
  # на самом языке (flang/self/cli.flang). Сверял их побайтовый тест против
  # свидетеля на JavaScript; свидетеля сняли 20 августа, и сверять наборы
  # перестал кто бы то ни было. Сторож снимает оба набора сам — прогоном
  # справки двоичного и разбором исходников — и называет разошедшийся ключ
  # поимённо. Отдельной работой: нужен только компилятор и node, полсекунды.
  klyuchi:
    name: cli-keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make -C bootstrap -j"$(nproc)"
      - run: node flang/scripts/cli-keys-guard.mjs

  # Страницы, отставшие от дерева: расшифровка прогона на странице — это замер,
  # и после тега он тухнет так же, как всякий замер. Отдельной работой, потому
  # что сторож зовёт семью проверок страниц и разворачивает веер прогонов —
  # рядом с чужими шагами ему тесно. Имя работы английскими словами: кириллицу
  # синтаксис идентификатора GitHub Actions не принимает, а транслита в новых
  # именах в этом дереве не заводят.
  # ДОРОГАЯ, И ЭТО ЗАМЕР, А НЕ ДОГАДКА. 31 августа 2026, ствол `03fb4060`,
  # двоичный 0.6.2, эта же строка с `--timeout 900000`: 963,5 с = 16 мин 04 с,
  # пик 0,73 ГиБ, код 1; со сборкой семени 17 мин 55 с.
  #
  # ⚠ ПОПРАВКА К ПРЕЖНЕЙ РЕДАКЦИИ ЭТОЙ ПОМЕТКИ. Здесь стояло «самая дорогая
  # работа файла» и «следующая, `pravila`, — 74 секунды, разница в тринадцать
  # раз». Неправда, и обе половины неправды из одного корня: 74 секунды были
  # временем ПАДЕНИЯ `pravila`, а не её работы. Починенная `pravila` идёт
  # 17 мин 35 с (19 мин 26 с со сборкой) и дороже этой работы. Разница не в
  # тринадцать раз, а в 1,08. Граница «дороже пяти минут — не на каждый пуш»
  # от этого не двигается: обе работы за ней, и обе остаются на метке.
  #
  # Расшифровка прогона на странице — это замер, и тухнет он после метки:
  # спрашивать «не отстали ли страницы» осмысленно именно перед выпуском.
  # На ветке она зовётся руками (`workflow_dispatch`).
  #
  # ⚠ КРАСНА СЕГОДНЯ, и это надо знать тому, кто поставит следующую метку:
  # 8 замечаний. Шесть — версия 0.6.2, набранная руками вместо подстановки
  # `{{выпуск.версия}}` (`docs/site/contributing.md:25`, `contributing.ru.md:24`,
  # `dlya-ii.md:8,32`, `dlya-ii.ru.md:7,30`). Два — свои же дети: `числа:проверка`
  # не уложилась в срок, `выпуски:страница:проверка` кончилась
  # FLANG_RECURSION_LIMIT на 10 млн шагов. Оба — ровно те две починки, которые
  # Ч77 называет «правкой на минуты в ярлыки.flang»: свой `--timeout` и
  # `--max-steps`.
  stale-pages:
    name: stale-pages
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Страница выпусков печатается ИЗ ТЕГОВ, и её сверка — член семьи.
        # В клоне глубиной в одну ревизию сверять её не с чем.
        with:
          fetch-depth: 0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: make -C bootstrap -j"$(nproc)"
      - run: bootstrap/flang io scripts/stale-pages-guard.flang --plan 'Страницы не отстали' --timeout 900000

  # ── СТОРОЖА, КОТОРЫХ НИКТО НЕ ЗВАЛ ──────────────────────────────────────────
  #
  # Перепись 5 сентября 2026 (задача ниже): ярлыков-сторожей в дереве 56, из них
  # автоматика зовёт 29, а 27 не зовёт НИКТО. Порода уже стоила дорого трижды за
  # сутки: `задачник:проверка` дорос до 220 замечаний незамеченным, числа ярлыка
  # `чекер:проверка` протухли на сотню, `перечни:проверка` копил 55 расхождений.
  # Сторож, которого не зовут, — не проверка, а её изображение; и починка тут
  # самая дешёвая из всех наших: не написать сторожа, а вписать строку сюда.
  #
  # Здесь стоят ДВОЕ из четырёх зелёных. Двое других (`занятые:проверка`,
  # `слова:проверка`) зелены прогоном, но подлог под них за один заход не
  # построился, а сторожу верят только после того, как он покраснел на подлоге.
  # Ставить их сюда без пробы значило бы поставить изображение проверки —
  # оставлены на следующего вместе с описанием, что именно ломать.
  neznanye-storozha:
    name: uncalled-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      - run: make -C bootstrap -j"$(nproc)"

      # Имена переменных — латиницей: POSIX не допускает кириллицу в именах
      # переменных оболочки. Эта же грабля уже была у работника задачника.
      - name: сторож словаря краснеет на подложенном понятии
        run: |
          set -u
          podlog=docs/glossary.md
          sed -i '0,/^| /s/^| /| ПОДЛОГ-ВЫДУМАННОЕ-ПОНЯТИЕ | подлог |\n| /' "$podlog"
          if ./ярлык словарь:проверка; then
            git checkout -- "$podlog"
            echo "сторож промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi
          git checkout -- "$podlog"
      - name: словарь сходится с таблицей поверхностей
        run: ./ярлык словарь:проверка

      - name: сторож «где что лежит» краснеет на выдуманном приборе
        run: |
          set -u
          podlog=docs/what-blocks-1-0.md
          sed -i '40s|`docs/reprint-cost.md`|`docs/вымышленный-подлог.md`|' "$podlog"
          if ./ярлык что-мешает:проверка; then
            git checkout -- "$podlog"
            echo "сторож промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi
          git checkout -- "$podlog"
      - name: таблица «Где что лежит» сходится с деревом
        run: ./ярлык что-мешает:проверка
