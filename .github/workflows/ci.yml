name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Лицензионная разметка проверяется отдельной работой по той же причине, что
  # и подсветка ниже: она не зависит от версии Node и в матрице прогонялась бы
  # трижды впустую. Плюс ей не нужны ни npm ci, ни сборка — только checkout и
  # node, поэтому она отвечает раньше матрицы и не молчит, когда та красная.
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-licensing.mjs

  # Подсветка FTS для Vim проверяется отдельной работой, а не шагом в матрице
  # выше: она не зависит от версии Node, и в матрице прогонялась бы трижды
  # впустую. Плюс падение подсветки не должно читаться как «сломался Node 20».
  vim-highlight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # vim ставим явно, а не надеемся на состав образа: tests/run.sh без него
      # сразу выходит с ошибкой «нужен vim», и такой отказ выглядел бы как
      # сломанная подсветка, хотя сломался бы образ runner-а.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim
      - run: editors/vim-fts/tests/run.sh
