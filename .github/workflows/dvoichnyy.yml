name: Двоичный

# ПОЧЕМУ ЭТА РАБОТА ЗАВЕДЕНА И ПОЧЕМУ ОНА РАЗБИТА НАДВОЕ.
#
# До неё двоичный компилятор не собирался в CI НИ РАЗУ на Linux. Собирала его
# одна `build-macos.yml` — и только на macOS, ради отдельной беды с макросом
# видимости. Следствие оказалось хуже, чем «двоичный не проверен»: всякая
# проверка, переведённая на двоичный, ТИХО переставала выполняться.
#
# Тихо — здесь главное слово. Проверка корпусного режима при
# отсутствии `bootstrap/flang` не падала, а ПРОПУСКАЛАСЬ с диагностикой, а
# «пропущено» в отчёте читается как «всё хорошо». Предохранитель на этот случай
# заведён (`FTS_REQUIRE_BINARY=1`), но не был выставлен нигде: `grep` по дереву
# находил имя ровно в двух местах, и оба — внутри самого файла пробы. Разбор —
# `docs/zettel/proverka-perevedyonnaya-na-dvoichnyy-vypadaet-iz-ci-molcha.md`.
#
# Два обходчика, целиком написанных на двоичном, не звались из CI вовсе:
# `flang/проверки/обход.sh` (98 проверок) и `flang/проверки/обход-примеров.sh`
# (корпус `.flang` всего дерева).
#
# После удаления реализации на JavaScript (`fe8e8a37`, 48 файлов, 56 072 строки)
# это единственная работа CI, которая вообще проверяет ЯЗЫК: `npm test` из
# `ci.yml` не доходит до первой пробы (см. пометку там).
#
# ── Почему надвое, а не одной работой ───────────────────────────────────────
#
# Потому что цена у двух половин разная на порядок, и замерена:
#
#   сборка `make -C bootstrap -j4`, четыре ядра, -O2 -flto        70 с
#   дым (`--version`, `--help`, `check` одного файла)              3 с
#   обходчик проверок на flang, 98 проверок                        3 с
#   примеры stdlib и ядра, 1445 штук                              53 с
#   ─────────────────────────────────────────────────────────────────
#   обходчик примеров корпуса, всё дерево                    ДЕСЯТКИ МИНУТ
#
# Первые три дёшевы и ходят на каждый пуш: полторы минуты за то, что двоичный
# вообще собирается и судит — это даром.
#
# Четвёртый дорог, и дорог НЕ ОСНАСТКОЙ, а двумя файлами дерева: `flang test`
# на `flang/self/bootstrap/compiler.flang` считается 469 с, на
# `flang/self/repl/repl.flang` — 228 с. Остальное дерево (stdlib 40 с,
# examples 187 с, core 13 с) вместе дешевле этих двух.
#
# ЗАМЕРЕНО, А НЕ ПРИКИНУТО: полный обход идёт БОЛЬШЕ ЧАСА. Два захода на этой
# машине (256 ядер, свободных больше двухсот) не уложились: первый убит на 60-й
# минуте без вывода, второй перевалил за 47 минут. Обход ОДНОПОТОЧНЫЙ — это один
# процесс `flang test . --ledger`, и свободные ядра ему не помогают ничем.
#
# Отсюда триггер: тег и рука, БЕЗ запроса слияния. Час-полтора на каждый ЗС —
# это ровно та беда, из-за которой `ci.yml` увели с пуша на тег, и повторять её
# незачем. Язык перед слиянием не остаётся неприкрытым: работа `sborka` выше
# гоняет 98 проверок и 1445 примеров за две с половиной минуты на каждый пуш.
# Здесь же — глубокая сверка всего дерева, и её место там, где решают выпуск.
#
# `timeout-minutes: 180`, а не 90: ядра раннера медленнее здешних, и час тут
# легко станет двумя там.
#
# Node не ставится ни в одной из двух работ, и это не экономия: путь установки,
# ради которого двоичный существует, обязан обходиться без Node. Работа, которой
# Node не выдали, это доказывает, а не обещает. Проверено отдельно — `обход.sh`
# проходит в `env -i PATH=/usr/bin:/bin`, где `node` недостижим.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Дешёвая половина: ходит на каждый пуш ──────────────────────────────────
  sborka:
    name: Сборка и проверки на flang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Время сборки называется числом в логе, а не «быстро». Подорожает —
      # будет видно в логе, а не выяснится жалобой.
      - name: Собрать точку раскрутки
        run: |
          set -eu
          echo "ядер: $(nproc)"
          # Имя переменной латиницей не по вкусу: `sh` и `bash` принимают в имени
          # только ASCII, и `начало=$(date +%s)` — это не присваивание, а попытка
          # запустить команду с таким именем. Поймано прогоном работы из чистого
          # клона; тот же довод записан в шапке `flang/проверки/обход.sh`.
          started=$(date +%s)
          make -C bootstrap -j"$(nproc)"
          echo "сборка двоичного: $(( $(date +%s) - started )) с"

      # Собралось — ещё не значит работает. Проверяется то, что человек наберёт
      # первым, и настоящий файл дерева, а не выдуманный.
      - name: Двоичный отвечает человеку
        run: |
          set -eu
          ./bootstrap/flang --version
          ./bootstrap/flang --help | grep -q "flang check"
          ./bootstrap/flang check flang/self/parser.flang

      # Проверки, НАПИСАННЫЕ НА FLANG: программа судит сама, `sh` только возит.
      # Сверяется СПИСОК ИМЁН целиком, а не счётчик отказов, — файл, упавший
      # разом, отдаёт ноль проверок и ноль отказов, то есть выглядит чистым.
      # Проверено снятием правки: убранная строка ведомости даёт код 1 и
      # печатает, какая именно пропала.
      - name: Проверки на flang (сверка ведомости)
        run: sh flang/проверки/обход.sh

      # Примеры двух каталогов, которые СХОДЯТСЯ ЦЕЛИКОМ и потому годятся в
      # дешёвый гейт по голому коду возврата, без ведомости:
      #
      #   flang/stdlib   20 файлов, 1216 примеров, прошли все   40 с
      #   flang/core      4 файла,   229 примеров, прошли все   13 с
      #
      # Полный обход дерева сюда не ставится (он в работе `korpus` ниже), но
      # оставлять пуш вовсе без примеров языка незачем: 1445 примеров за минуту
      # — это то, что ломается чаще всего и замечается позже всего.
      #
      # `flang/examples` здесь НЕТ намеренно: там лежит файл, который двоичный
      # законно отвергает (`monad/order-total.flang`, четыре FLANG_TYPE_PARAM),
      # и код возврата у каталога ненулевой. Такому месту нужна ведомость,
      # которая держит ТОЧНОЕ число, а не порог «ноль отказов», — и она есть,
      # в работе `korpus`.
      - name: Примеры stdlib и ядра
        run: |
          set -eu
          ./bootstrap/flang test flang/stdlib/
          ./bootstrap/flang test flang/core/

  # ── Столкновения имён: отвечает раньше сборки ─────────────────────────────
  #
  # ПОЧЕМУ ОТДЕЛЬНОЙ РАБОТОЙ, А НЕ ШАГОМ В `sborka`.
  #
  # `sborka` заведена без Node намеренно: путь установки, ради которого двоичный
  # существует, обязан обходиться без него, и работа, которой Node не выдали,
  # это доказывает, а не обещает. Сторож столкновений написан на Node — поставь
  # его шагом внутрь, и доказательство исчезнет вместе с первой же зелёной
  # галочкой.
  #
  # Отдельной работе Node от образа хватает: ни `npm ci`, ни двоичного, ни
  # сборки ей не нужно — она читает текст. Считает она замыкание компилятора
  # (29 файлов) за десятые доли секунды и отвечает РАНЬШЕ `sborka`, то есть
  # раньше двух с половиной минут сборки и на порядки раньше семнадцати минут
  # перепечатки, от которой столкновение узнавали до сих пор.
  imena:
    name: Столкновения имён в замыкании
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node flang/scripts/link-collision-guard.mjs
      # Сторож проверяется сам: подделка обязана краснить, чистое — нет, и
      # найденное обязано совпадать с тем, что скажет связывание. Двоичный для
      # сверки берётся собранным, если он уже есть; здесь его нет, и эти пробы
      # честно пропускаются — их строгий прогон стоит в `ci.yml`.
      - run: node --test flang/test/link-collision-guard.test.mjs

  # ── Дорогая половина: только тег и ручной запуск ──────────────────────────
  korpus:
    name: Примеры всего корпуса
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"
      # Корпусный режим `flang test <каталог>` есть ТОЛЬКО у двоичного, и учить
      # ему что-то ещё незачем: он написан на самом flang
      # (`flang/self/bootstrap/corpus.flang`, 763 строки), и вторая реализация
      # этого слоя решений — ровно то, что из дерева только что удалили.
      #
      # Порога «ни одного провала» здесь нет намеренно: в дереве есть законные
      # провалы (выходы замера авторства писала модель). Ведомость строже
      # порога — она держит точное число прошедших и число СВОИХ примеров у
      # КАЖДОГО файла, и потеря файлом своих примеров краснеет диффом.
      - name: Примеры корпуса (сверка ведомости)
        run: sh flang/проверки/обход-примеров.sh
