name: Двоичный

# ПОЧЕМУ ЭТА РАБОТА ЗАВЕДЕНА ОТДЕЛЬНО И ХОДИТ НА КАЖДЫЙ ПУШ.
#
# До неё двоичный компилятор не собирался в CI НИ РАЗУ на Linux. Собирала его
# только `build-macos.yml` — и только на macOS, ради одной беды с макросом
# видимости. Из-за этого всякая проверка, переведённая на двоичный, выпадала из
# общего прогона: `flang/test/cli-test-corpus.test.mjs` при отсутствии
# `bootstrap/flang` не падает, а ПРОПУСКАЕТСЯ с диагностикой, и «пропущено» в
# отчёте читается как «всё хорошо». Два обходчика на двоичном —
# `flang/проверки/обход.sh` (98 проверок) и `flang/проверки/обход-примеров.sh`
# (4382 примера) — не звались из CI вовсе, ни разу.
#
# После удаления реализации на JavaScript (`fe8e8a37`, 48 файлов, 56 072 строки)
# это единственная работа CI, которая вообще что-то проверяет в языке: `npm test`
# из `ci.yml` не доходит до первой пробы — `pretest` зовёт `scripts/preflight.mjs`,
# а тот ввозит удалённый `flang/src/targets.mjs` и падает с ERR_MODULE_NOT_FOUND.
#
# Довод `ci.yml` «не занимать очередь, прогон идёт два часа» к этой работе не
# относится: она стоит МИНУТЫ, и это замерено, а не обещано.
#
#   сборка `make -C bootstrap -j4`, четыре ядра, -O2 -flto     69 с
#   обходчик проверок на flang (98 проверок)                     3 с
#   обходчик примеров корпуса (343 файла, 4382 примера)      ~6 мин
#
# Node здесь не ставится НАРОЧНО, ровно по доводу `build-macos.yml`: путь, ради
# которого двоичный существует, обязан обходиться без Node, и работа, которой
# Node не выдали, это доказывает, а не обещает. Заодно это и есть проверка того,
# что останется, когда реализацию на JavaScript уберут.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dvoichnyy:
    name: Сборка и прогон двоичным
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Время сборки называется числом в отчёте, а не «быстро». Если она вдруг
      # подорожает — это будет видно в логе, а не выяснится жалобой.
      - name: Собрать точку раскрутки
        run: |
          set -eu
          echo "ядер: $(nproc)"
          start=$(date +%s)
          make -C bootstrap -j"$(nproc)"
          echo "сборка двоичного: $(( $(date +%s) - start )) с"

      # Собралось — ещё не значит работает. Первое, что наберёт человек.
      - name: Двоичный отвечает человеку
        run: |
          set -eu
          ./bootstrap/flang --version
          ./bootstrap/flang --help | grep -q "flang check"
          ./bootstrap/flang check flang/self/parser.flang

      # Проверки, НАПИСАННЫЕ НА FLANG: программа судит сама, `sh` только возит.
      # Сверяется список имён целиком, а не счётчик отказов: файл, упавший
      # разом, отдаёт ноль проверок и ноль отказов, то есть выглядит чистым.
      - name: Проверки на flang (обходчик, сверка ведомости)
        run: sh flang/проверки/обход.sh

      # Примеры всего корпуса `.flang` дерева. Тот самый корпусный режим
      # `flang test <каталог>`, которого у инструментария на Node нет вовсе:
      # `node flang/bin/flang.mjs test flang/stdlib/` отвечает `EISDIR`.
      - name: Примеры корпуса (обходчик, сверка ведомости)
        run: sh flang/проверки/обход-примеров.sh
