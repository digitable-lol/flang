name: Двоичный

# ПОЧЕМУ ЭТА РАБОТА ЗАВЕДЕНА И ПОЧЕМУ ОНА РАЗБИТА НАДВОЕ.
#
# До неё двоичный компилятор не собирался в CI НИ РАЗУ на Linux. Собирала его
# одна `build-macos.yml` — и только на macOS, ради отдельной беды с макросом
# видимости. Следствие оказалось хуже, чем «двоичный не проверен»: всякая
# проверка, переведённая на двоичный, ТИХО переставала выполняться.
#
# Тихо — здесь главное слово. Проверка корпусного режима при
# отсутствии `bootstrap/flang` не падала, а ПРОПУСКАЛАСЬ с диагностикой, а
# «пропущено» в отчёте читается как «всё хорошо». Предохранитель на этот случай
# заведён (`FTS_REQUIRE_BINARY=1`), но не был выставлен нигде: `grep` по дереву
# находил имя ровно в двух местах, и оба — внутри самого файла пробы. Разбор —
# `docs/zettel/proverka-perevedyonnaya-na-dvoichnyy-vypadaet-iz-ci-molcha.md`.
#
# Два обходчика, целиком написанных на двоичном, не звались из CI вовсе:
# `flang/проверки/обход.sh` (98 проверок) и `flang/проверки/обход-примеров.sh`
# (корпус `.flang` всего дерева).
#
# После удаления реализации на JavaScript (`fe8e8a37`, 48 файлов, 56 072 строки)
# это единственная работа CI, которая вообще проверяет ЯЗЫК: `npm test` из
# `ci.yml` не доходит до первой пробы (см. пометку там).
#
# ── Почему надвое, а не одной работой ───────────────────────────────────────
#
# Потому что цена у двух половин разная на порядок, и замерена:
#
#   сборка `make -C bootstrap -j4`, четыре ядра, -O2 -flto        70 с
#   дым (`--version`, `--help`, `check` одного файла)              3 с
#   обходчик проверок на flang, 98 проверок                        3 с
#   примеры stdlib и ядра, 1445 штук                              53 с
#   ─────────────────────────────────────────────────────────────────
#   обходчик примеров корпуса, всё дерево                    ДЕСЯТКИ МИНУТ
#
# Первые три дёшевы и ходят на каждый пуш: полторы минуты за то, что двоичный
# вообще собирается и судит — это даром.
#
# Четвёртый дорог, и дорог НЕ ОСНАСТКОЙ, а двумя файлами дерева: `flang test`
# на `flang/self/bootstrap/compiler.flang` считается 469 с, на
# `flang/self/repl/repl.flang` — 228 с. Остальное дерево (stdlib 40 с,
# examples 187 с, core 13 с) вместе дешевле этих двух.
#
# ЗАМЕРЕНО, А НЕ ПРИКИНУТО: полный обход идёт БОЛЬШЕ ЧАСА. Два захода на этой
# машине (256 ядер, свободных больше двухсот) не уложились: первый убит на 60-й
# минуте без вывода, второй перевалил за 47 минут. Обход ОДНОПОТОЧНЫЙ — это один
# процесс `flang test . --ledger`, и свободные ядра ему не помогают ничем.
#
# Отсюда триггер: тег и рука, БЕЗ запроса слияния. Час-полтора на каждый ЗС —
# это ровно та беда, из-за которой `ci.yml` увели с пуша на тег, и повторять её
# незачем. Язык перед слиянием не остаётся неприкрытым: работа `sborka` выше
# гоняет 98 проверок и 1445 примеров за две с половиной минуты на каждый пуш.
# Здесь же — глубокая сверка всего дерева, и её место там, где решают выпуск.
#
# `timeout-minutes: 180`, а не 90: ядра раннера медленнее здешних, и час тут
# легко станет двумя там.
#
# Node не ставится ни в одной из двух работ, и это не экономия: путь установки,
# ради которого двоичный существует, обязан обходиться без Node. Работа, которой
# Node не выдали, это доказывает, а не обещает. Проверено отдельно — `обход.sh`
# проходит в `env -i PATH=/usr/bin:/bin`, где `node` недостижим.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Дешёвая половина: ходит на каждый пуш ──────────────────────────────────
  sborka:
    name: Сборка и проверки на flang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Время сборки называется числом в логе, а не «быстро». Подорожает —
      # будет видно в логе, а не выяснится жалобой.
      - name: Собрать точку раскрутки
        run: |
          set -eu
          echo "ядер: $(nproc)"
          # Имя переменной латиницей не по вкусу: `sh` и `bash` принимают в имени
          # только ASCII, и `начало=$(date +%s)` — это не присваивание, а попытка
          # запустить команду с таким именем. Поймано прогоном работы из чистого
          # клона; тот же довод записан в шапке `flang/проверки/обход.sh`.
          started=$(date +%s)
          make -C bootstrap -j"$(nproc)"
          echo "сборка двоичного: $(( $(date +%s) - started )) с"

      # Собралось — ещё не значит работает. Проверяется то, что человек наберёт
      # первым, и настоящий файл дерева, а не выдуманный.
      - name: Двоичный отвечает человеку
        run: |
          set -eu
          ./bootstrap/flang --version
          ./bootstrap/flang --help | grep -q "flang check"
          ./bootstrap/flang check flang/self/parser.flang

      # Проверки, НАПИСАННЫЕ НА FLANG: программа судит сама, `sh` только возит.
      # Сверяется СПИСОК ИМЁН целиком, а не счётчик отказов, — файл, упавший
      # разом, отдаёт ноль проверок и ноль отказов, то есть выглядит чистым.
      # Проверено снятием правки: убранная строка ведомости даёт код 1 и
      # печатает, какая именно пропала.
      - name: Проверки на flang (сверка ведомости)
        run: sh flang/проверки/обход.sh

      # Примеры двух каталогов, которые СХОДЯТСЯ ЦЕЛИКОМ и потому годятся в
      # дешёвый гейт по голому коду возврата, без ведомости:
      #
      #   flang/stdlib   20 файлов, 1216 примеров, прошли все   40 с
      #   flang/core      4 файла,   229 примеров, прошли все   13 с
      #
      # Полный обход дерева сюда не ставится (он в работе `korpus` ниже), но
      # оставлять пуш вовсе без примеров языка незачем: 1445 примеров за минуту
      # — это то, что ломается чаще всего и замечается позже всего.
      #
      # `flang/examples` здесь НЕТ намеренно: там лежит файл, который двоичный
      # законно отвергает (`monad/order-total.flang`, четыре FLANG_TYPE_PARAM),
      # и код возврата у каталога ненулевой. Такому месту нужна ведомость,
      # которая держит ТОЧНОЕ число, а не порог «ноль отказов», — и она есть,
      # в работе `korpus`.
      - name: Примеры stdlib и ядра
        run: |
          set -eu
          ./bootstrap/flang test flang/stdlib/
          ./bootstrap/flang test flang/core/

  # ── Столкновения имён: отвечает раньше сборки ─────────────────────────────
  #
  # ПОЧЕМУ ОТДЕЛЬНОЙ РАБОТОЙ, А НЕ ШАГОМ В `sborka`.
  #
  # `sborka` заведена без Node намеренно: путь установки, ради которого двоичный
  # существует, обязан обходиться без него, и работа, которой Node не выдали,
  # это доказывает, а не обещает. Сторож столкновений написан на Node — поставь
  # его шагом внутрь, и доказательство исчезнет вместе с первой же зелёной
  # галочкой.
  #
  # Отдельной работе Node от образа хватает: ни `npm ci`, ни двоичного, ни
  # сборки ей не нужно — она читает текст. Считает она замыкание компилятора
  # (29 файлов) за десятые доли секунды и отвечает РАНЬШЕ `sborka`, то есть
  # раньше двух с половиной минут сборки и на порядки раньше семнадцати минут
  # перепечатки, от которой столкновение узнавали до сих пор.
  # ── СЕМЯ ОТСТАЁТ ОТ ИСХОДНИКОВ МОЛЧА ───────────────────────────────────────
  #
  # Заведено 22 августа 2026 после ТРЕТЬЕГО случая за сутки. Правку компилятора
  # вливают, `bootstrap/` не перепечатывают, и правило лежит в исходниках, а в
  # собранной программе не работает. Всё при этом зелёное: исходник разбирается,
  # семя собирается, ни один сторож не звал сверку. Так потерялись оговорка о
  # конечности, принцип индукции по строке и правило конъюнкции.
  #
  # Сверка `sh scripts/raskrutka.sh --check` существовала всё это время и ловила
  # беду за один прогон. Её не звал никто, и причина уважительная: она ПЕЧАТАЕТ
  # ЗАНОВО — 19 мин 58 с и 25,1 ГиБ пика, замерено 22 августа на 256 ядрах; на
  # раннере дольше. На каждый пуш столько не
  # потратить, и потому механизм был построен и не использовался.
  #
  # Здесь зовётся дешёвая половина: `--bystro` не печатает, а сверяет ВХОДЫ
  # печати — содержимое 36 файлов замыкания компилятора, 4 файлов рантайма,
  # уезжающих в вывод дословно, и пределы печати, попадающие в напечатанный
  # байт. Замерено на этом дереве: 0,52 секунды против 19 мин 58 с — в 2300 раз
  # дешевле.
  #
  # Она не доказывает побайтового совпадения — это умеет только `--check`. Она
  # отвечает на вопрос «те ли входы», и ровно этот вопрос стоял без ответа.
  #
  # Ни двоичного, ни Node, ни `npm ci` работе не нужно: sh, find, awk, sha256sum.
  semya:
    name: Семя отвечает нынешним исходникам
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Входы печати те же, что при перепечатке семени
        run: sh scripts/raskrutka.sh --bystro

  imena:
    name: Столкновения имён и ввозы во всех программах дерева
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node flang/scripts/link-collision-guard.mjs --дерево

      # ── ПОЛОМКИ ОТ СЛИЯНИЯ: сюда же, и по той же причине ──────────────────
      #
      # Слияние двух веток, тронувших одно место, git разводит без единого знака
      # конфликта: обе добавили функцию с одним именем — в файле два объявления;
      # одна убрала функцию, другая оставила вызовы — зовущие висят в пустоту.
      # Язык ловит и то и другое, но ТОЛЬКО на том файле, который кто-то
      # проверил, а список проверяемых (`ведомость-примеров.txt`, 774 записи)
      # короче дерева (958 файлов `.flang`).
      #
      # Замерено при заведении: в стволе уже лежит
      # `flang/examples/db/postgres-scram-plan.flang`, зовущий «Начало SASL» и
      # «Ответ SASL», которых нет ни в одном файле. Это в записанном долге с
      # доводом; всякое НОВОЕ повреждение красит работу.
      #
      # Место здесь, а не в `sborka`: проверка читает текст, ей не нужен ни
      # двоичный, ни `npm ci`, и отвечает она за секунды — раньше сборки.
      - run: node flang/scripts/srashchivanie.mjs

      # ── СКОЛЬКИМ СТРОКАМ ЯДРА ПРИХОДИТСЯ ВЕРИТЬ ───────────────────────────
      #
      # От поиска в проверяльщике отказались ради довода «прочитать целиком
      # можно только маленький». Довод работает, только если «маленький» — это
      # число, которое кто-то держит. Здесь оно держится: ядро решений (всё, до
      # чего доходит цепочка от ответа да/нет) обязано не расти. Читает текст,
      # отвечает за доли секунды.
      - run: node flang/scripts/skolku-verit.mjs
      # Сторож проверяется сам: подделка обязана краснить, чистое — нет, и
      # найденное обязано совпадать с тем, что скажет связывание. Двоичный для
      # сверки берётся собранным, если он уже есть; здесь его нет, и эти пробы
      # честно пропускаются — их строгий прогон стоит в `ci.yml`.
      - run: node --test flang/test/link-collision-guard.test.mjs

  # ── Сторожа заводятся: считает ЧИСЛОМ, и сегодня число красное ────────────
  #
  # ПОЧЕМУ ЭТА РАБОТА ЕСТЬ.
  #
  # Удаление реализации на JavaScript оставило файлы проверок, ввозившие
  # `flang/bin/flang.mjs`. Они перестали ЗАГРУЖАТЬСЯ — и ни один набор этого не
  # показал: файл, упавший на ввозе, не печатает ни одного проваленного
  # утверждения, печатать нечего. Среди замолчавших был
  # `flang/test/proof-soundness.test.mjs`, называвший СВОИМ ТЕКСТОМ дыру в
  # состоятельности ядра; дыру нашли и закрыли много позже, вслепую и отдельной
  # работой.
  #
  # Сторож, который называет дыру и не заводится, от её отсутствия неотличим.
  #
  # Работа отдельная по той же причине, что и `imena`: `sborka` заведена БЕЗ
  # Node намеренно, а здесь Node — сам предмет проверки. Двоичный собирается,
  # потому что сторож написан на flang и его надо чем-то исполнить.
  storozha:
    name: Файлы проверок заводятся
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Полная история не нужна: сторож спрашивает `git ls-files`, а не журнал.
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"
      - name: Каждый файл проверок ЗАВОДИТСЯ
        run: bootstrap/flang io flang/scripts/storozha-zavodyatsya.flang

      # Предмет тут другой — сторож кодов, — но работа та же по той же причине,
      # по которой `imena` не стала шагом в `sborka`: сборка двоичного стоит
      # две с половиной минуты, а эта проверка — 14 секунд, и заводить ради неё
      # вторую сборку значит платить в десять раз больше за то же самое.
      #
      # Родство прямое: сторож кодов сам себя не проверяет, и его половина
      # «а ЛОВИТ ли он» лежала в `flang/test/code-guard.test.mjs`, который не
      # заводился. Ставить её в CI отдельно от того, кто это обнаружил, незачем.
      - name: Сторож кодов умеет краснеть и умеет молчать
        run: bootstrap/flang io flang/scripts/podlog-koda.flang

      # ── Слова о доказанности: сильное слово про слабое основание ──────────
      #
      # ПОЧЕМУ ЗДЕСЬ, А НЕ ОТДЕЛЬНОЙ РАБОТОЙ. Предмет тот же, что у двух шагов
      # выше, — сторож, который сам себя проверяет, — и двоичный уже собран.
      # Прогон идёт на одной подделке, секунды.
      #
      # ЧТО ЛОВИТСЯ. Ведомость произносит три разные по силе вещи: «доказано
      # ядром» (обо ВСЕХ входах), «сетка» (счёт на конечном числе значений — НЕ
      # доказательство) и «объявлено, не доказано». Число «доказано N» — то, по
      # которому судят, заслужено ли слово «формально-доказуемый»; подмешай в
      # него счёт, и число станет ложью. Сторож сверяет слово с вердиктом,
      # число с построчным счётом, прозу с машинным видом и — прогоном с
      # заглушкой — пустоту: пережившее подмену тела утверждение верно про любую
      # функцию этой подписи и про эту не говорит ничего.
      #
      # Обе половины спрашиваются одной командой: чистое обязано молчать, и
      # каждая из пяти порч обязана быть поймана. Зелёный без показанной порчи
      # ничего не значит.
      - name: Сторож слов о доказанности краснеет на подмене и молчит, когда чисто
        run: node flang/scripts/storozh-slov.mjs --porcha vse

      # ── ПОДДЕЛКИ ЯДРА: ни одного шага CI у них не было НИ РАЗУ ─────────────
      #
      # Состоятельность ядра доказательств держится на подделках — программах,
      # которые пытаются сказать ложь и обязаны остаться недоказанными. Обе
      # проверки лежали в дереве и не звались ниоткуда: ни из `ci.yml`, ни
      # отсюда. То есть сломай завтра правило вывода — зелёным осталось бы всё.
      #
      # Замерено на этой машине: проверка на flang — 9.6 с, пик 1.2 ГиБ;
      # проверка на Node — 4.2 с, пик 0.1 ГиБ. Четырнадцать секунд за то, что
      # ядро не берёт ложь, — это даром, и место им здесь, где двоичный уже
      # собран.
      #
      # Обе, а не одна: они спрашивают одно и то же у двух разных сторон, и
      # каждая сверяет свой список с каталогом `flang/test/fixtures`. Разойдись
      # они в ожиданиях — работа покраснеет, и это то, что нужно.
      - name: Подделки ядра отвергнуты (проверка на flang)
        run: bootstrap/flang io flang/scripts/poddelki-yadra.flang
      - name: Подделки ядра отвергнуты (проверка со стороны Node)
        run: node flang/scripts/poddelki-yadra.mjs

  # ── Дорогая половина: только тег и ручной запуск ──────────────────────────
  korpus:
    name: Примеры всего корпуса
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"
      # Корпусный режим `flang test <каталог>` есть ТОЛЬКО у двоичного, и учить
      # ему что-то ещё незачем: он написан на самом flang
      # (`flang/self/bootstrap/corpus.flang`, 763 строки), и вторая реализация
      # этого слоя решений — ровно то, что из дерева только что удалили.
      #
      # Порога «ни одного провала» здесь нет намеренно: в дереве есть законные
      # провалы (выходы замера авторства писала модель). Ведомость строже
      # порога — она держит точное число прошедших и число СВОИХ примеров у
      # КАЖДОГО файла, и потеря файлом своих примеров краснеет диффом.
      - name: Примеры корпуса (сверка ведомости)
        run: sh flang/проверки/обход-примеров.sh

      # ── РАЗЛИЧИТЕЛЬНЫЙ ПОИСК: ядро против вычислителя ─────────────────────
      #
      # Порождает утверждения о функциях перебором — заведомо ложные вперемешку
      # с истинными — и на каждом сверяет вердикт `flang check --proof` с тем,
      # что говорит `flang run` на враждебных входах. Расхождение «доказано, а
      # нарушается» — дыра в состоятельности ядра, и работа краснеет.
      #
      # Место здесь, а не на каждом пуше: 454 утверждения и 7868 прогонов, на
      # этой машине 46 с при восьми потоках, на двух ядрах раннера — около
      # десяти минут. Это цена глубокой сверки, и её место там же, где полный
      # обход корпуса, — на теге и на руке.
      - name: Различительный поиск (ядро против вычислителя)
        run: node flang/scripts/razlichitelnyy-poisk.mjs
