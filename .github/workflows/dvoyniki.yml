name: Двойники на целях

# ЧЕТЫРЕ СТОРОЖА УЗЛА НЕ ЗВАЛ НИ ОДИН WORKFLOW — И ВОТ ЧТО ЭТО ЗНАЧИЛО.
#
# `grep across-targets .github/` по всем семи файлам не давал НИ ОДНОГО
# совпадения. Сторожа при этом существуют, чинены и прогоняются: они судят
# связь, планировщик, надзор и полный узел на ДЕВЯТИ целях печати. Работа
# `emit-guard` в этом же дереве уже молча краснела полтора суток ровно по этой
# причине — её никто не звал.
#
# ── ЦЕНА, СНЯТАЯ СВОИМ ПРОГОНОМ 6 сентября 2026 ────────────────────────────
# Машина 256 ядер, load average 32, шла чужая печать. `/usr/bin/time -v`:
#
#   сторож                       секунды   код   целей   пик RSS
#   link-across-targets             40,2     0   9 из 9    277 МБ
#   scheduler-across-targets       137,1     0   9 из 9    269 МБ
#   node-across-targets            604,8     1   8 из 9    391 МБ
#   supervisor-across-targets     1284,6     0   9 из 9    392 МБ
#
# Сумма 2066,7 с = 34 мин 27 с машинного времени. Работы идут разом, поэтому
# стенное время задаёт самая долгая — `supervisor`, около 22 минут.
#
# Числа сняты на 256-ядерной машине; у раннера GitHub два ядра, и сборка девяти
# тулчейнов там дороже. Считать их потолком нельзя, они пол.
#
# ── ПОЧЕМУ ПО РАСПИСАНИЮ, А НЕ НА ПУШ ──────────────────────────────────────
# Граница дерева объявлена до всяких замеров (ci.yml, шапка): работа дороже
# ПЯТИ МИНУТ стенного времени вместе со сборкой семени на каждый пуш не идёт.
# Сборка семени стоит около 1 мин 51 с (24,23 с у `oblast` против 2 мин 15 с с
# нею же). Отсюда по каждому:
#
#   link         40,2 с + 111 с = 2 мин 31 с   ПРОХОДИТ  → ушёл на пуш, в ci.yml
#   scheduler   137,1 с + 111 с = 4 мин 08 с   впритык   → сюда
#   node        604,8 с + 111 с = 11 мин 56 с  в 2,4 раза дороже границы → сюда
#   supervisor 1284,6 с + 111 с = 23 мин 16 с  в 4,7 раза дороже границы → сюда
#
# `scheduler` по своему числу границу проходит, и всё же стоит здесь: 4 мин 10 с
# — это замер на 256 ядрах, а раннер двухъядерный, и почти вся цена сторожа —
# сборка девяти тулчейнов, то есть ровно то, что от числа ядер и зависит.
# Двигать границу задним числом, увидев число впритык, — та же порода, что
# вписать 82 вместо 69.
#
# ── ЧТО ЭТИ СТОРОЖА ДАЮТ СВЕРХ JS-ПРОБ, И ЧЕГО НЕ ДАЮТ ─────────────────────
# JS-пробы (`flang/test/*.test.mjs`, 11 мин 02 с) СНИМАТЬ НЕЛЬЗЯ и здесь не
# снимаются. Замер: двойники покрывают 3 492 случая из 97 504 — 3,6 %. Шире
# они по целям (девять против восьми), уже по случаям в тридцать раз. JS даёт
# глубину, двойники — ширину; нужны оба.
#
# ── ELIXIR СТАВИТСЯ В КАЖДОЙ РАБОТЕ, И ЭТО НЕ ДУБЛЬ ────────────────────────
# Все четверо судят девять целей, а Elixir и Erlang — единственные из девяти,
# которых в образе `ubuntu-latest` нет вовсе (остальные восемь лежат готовыми,
# опись `actions/runner-images`, Ubuntu 24.04). Без них цель `elixir` молчит, а
# молчание цели теперь красное — значит без установки все четверо были бы
# красны всегда, а вечно красный сторож это выключенный сторож.
#
# У каждой работы свой раннер, поэтому строка установки стоит в каждой из них
# отдельно — это не повторение одного и того же места, а требование модели
# заданий. Единственный шаг здесь, который может покраснеть от зеркала Ubuntu,
# а не от дерева; красит он тогда ложно.

on:
  schedule:
    # Понедельник, 4 утра UTC. Не воскресенье: в 2 часа ночи воскресенья идёт
    # `reprint.yml`, и занимать очередь вдвоём незачем. Раз в неделю, а не
    # чаще: 35 мин машинного времени за заход, около 150 минут в месяц.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── ПЛАНИРОВЩИК: 176 вопросов на цель, девять целей ────────────────────────
  planirovshchik:
    name: scheduler-across-targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Elixir и Erlang — единственные из девяти, которых нет в образе
        run: sudo apt-get update && sudo apt-get install -y elixir
      - run: make -C bootstrap -j"$(nproc)"
      - name: Планировщик решает одинаково на девяти целях печати
        run: bootstrap/flang io flang/scripts/scheduler-across-targets.flang --timeout 300000

  # ── НАДЗОР: три исхода на цель поверх одной сборки, девять целей ──────────
  #
  # Самая дорогая работа файла: 1284,6 с своим замером, то есть она одна и
  # задаёт стенное время всего прогона.
  nadzor:
    name: supervisor-across-targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Elixir и Erlang — единственные из девяти, которых нет в образе
        run: sudo apt-get update && sudo apt-get install -y elixir
      - run: make -C bootstrap -j"$(nproc)"
      - name: Надзор поднимает упавший процесс на девяти целях печати
        run: bootstrap/flang io flang/scripts/supervisor-across-targets.flang --timeout 300000

  # ── ПОЛНЫЙ УЗЕЛ: КРАСЕН ПО ДЕЛУ, И ГЛУШИТЬ ЕГО ЗДЕСЬ НЕЧЕМ ────────────────
  #
  # Свой прогон 6 сентября 2026: код 1, 604,8 с, «ПОЛНЫЙ УЗЕЛ РАБОТАЕТ НА 8
  # ЦЕЛЯХ ИЗ 9: python, go, csharp, js, rust, java, c, cpp», не сошлась одна —
  # `elixir: ответ с узла опоры не поменял состояния «Счётчика»`. Это НЕ
  # отсутствие тулчейна (он ставится шагом ниже, и цель собирается), а долг
  # самого узла на цели elixir, названный задачей 6028: «на gh/dev без единой
  # правки — 7 из 8; с девятой целью стало 8 из 9, cpp сошлась, elixir как не
  # сходилась, так и не сходится».
  #
  # ЗДЕСЬ НЕТ `continue-on-error`, И ЭТО РЕШЕНИЕ, А НЕ НЕДОСМОТР. Красный
  # сторож на пуше остановил бы каждый пуш всем — поэтому он и стоит по
  # расписанию, а не там. А `continue-on-error` на пуше сделал бы его
  # УКРАШЕНИЕМ: работа зелена, долг не виден, и отличить починку от поломки
  # нечем. Здесь краснота видна в ленте, пуши от неё не встают, и зазеленеет
  # работа ровно тогда, когда закроют долг 6028, — не раньше и не иначе.
  uzel:
    name: node-across-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Elixir и Erlang — единственные из девяти, которых нет в образе
        run: sudo apt-get update && sudo apt-get install -y elixir
      - run: make -C bootstrap -j"$(nproc)"
      - name: Полный узел на каждой цели, у которой есть хозяин
        run: bootstrap/flang io flang/scripts/node-across-targets.flang --timeout 1800000

  # ── ПЕЧАТЬ СВЯЗИ: тоже КРАСЕН ПО ДЕЛУ, и долг называется числом ───────────
  #
  # `scripts/conc-link-emit.flang` сверяет напечатанные модули узла с их
  # исходниками на flang знак в знак. Свой прогон: код 1, 34,6 с, пик 329 МБ,
  # расхождений ТРИ, и все три — одна и та же строка шапки:
  #
  #   flang/conc/link.js, scheduler.js, wire.js — строка 3
  #   свежая печать: «Сгенерировано flang (бэкенд JavaScript, flang/self/emit-js.flang)»
  #   в дереве:      «Сгенерировано flang (бэкенд JavaScript, flang/src/emit/js.mjs)»
  #
  # То есть напечатанное в дереве помнит ПРЕЖНИЙ печатник — тот, что жил в
  # `flang/src/emit/js.mjs` до переезда на `flang/self/emit-js.flang`. Долг
  # закрывается перепечаткой этих трёх файлов, и он не мой: трогать напечатанное
  # узла, не разобрав, что ещё поедет вместе с шапкой, — это чужая работа.
  #
  # Сторож стоит ЗДЕСЬ, а не на пуше, по той же причине, что `node`: он красен
  # сегодня, и на пуше красил бы всем.
  pechat-svyazi:
    name: conc-link-emit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make -C bootstrap -j"$(nproc)"
      - name: Напечатанные модули узла совпадают со своими исходниками
        run: bootstrap/flang io scripts/conc-link-emit.flang
