name: Путь установки

# ПОЧЕМУ ОТДЕЛЬНОЙ РАБОТОЙ, И ПОЧЕМУ НА ДВУХ ПЛАТФОРМАХ.
#
# 19 августа 2026 путь установки сломался ПЯТЬ раз за вечер, и ни одну поломку
# не поймал ни один прогон. Общее у всех пяти: проверки в дереве гоняли то, что
# лежит в дереве, а человек получал архив, в котором лежало другое.
#
# ── Почему не в ci.yml ─────────────────────────────────────────────────────
# `ci.yml` нарочно ходит только на тег: полный прогон идёт около двух часов.
# Довод верный, но он же и пропустил четыре поломки из пяти: между правкой
# упаковки и следующим тегом упаковку не запускал никто. Эта работа идёт
# 6,5—8,6 минуты — замерено целиком, а не сложено из частей: 391 с на свободной
# машине, 518 с на занятой; с готовым архивом 260 с. Ходит она на КАЖДУЮ правку
# упаковки, релизного скрипта и точки раскрутки.
#
# ── Почему macOS обязателен ────────────────────────────────────────────────
# Первая из пяти поломок видна ТОЛЬКО вне Linux: `_POSIX_C_SOURCE 200809L`
# открывает `mkdtemp` на glibc и ЗАКРЫВАЕТ на Darwin, и `brew install` не
# доходил до конца ни у кого на Mac — при том что три работы CI из трёх шли на
# ubuntu и все три были зелёные. Разбор:
# docs/zettel/a-feature-macro-that-opens-on-glibc-closes-on-darwin.md
#
# `build-macos.yml` собирает на Маке точку раскрутки — это ловит СБОРКУ, но не
# установку. Здесь на Маке проходит весь путь: архив, раскладка, запуск.
#
# ── Чего этой работой всё равно не видно ───────────────────────────────────
# Названо, а не умолчано. Условной компиляцией мы проверяем ноль: строка
# `#if defined(__APPLE__)` на Linux не выполняется вовсе, и «зелёный Linux»
# про Darwin не говорит ничего. Единственная улика — сборка на Маке, и она
# ниже. Windows не проверяется ни здесь, ни где-либо ещё.

# ── ВЫПУСК НЕ ОПИРАЕТСЯ НА КЕШ ПРИГОВОРОВ ────────────────────────────────────
#
# `AGENTS.md`, раздел «Кеш приговоров: где живёт и чему он НЕ основание», несёт
# правило, которое отменять нельзя: «Кешу верят для СКОРОСТИ. Для ИСТИНЫ — про-
# веряльщику. Выпуск не имеет права опираться на кеш: перед меткой всё пересчи-
# тывается начисто, без `FLANG_KESH_PRIGOVOROV`.»
#
# До 2 сентября 2026 правило было записано словами и не принуждалось ничем.
# Правило, которое ничто не исполняет, — не правило: сторож столкновений имён
# уже лежал в дереве, его никто не звал, и это стоило двадцати часов машины.
# Теперь его принуждает составное действие `.github/actions/release-without-cache`
# (почему не файл в `scripts/` — разобрано в его шапке), и шаг
# «Выпуск не опирается на кеш приговоров» стоит ПЕРВЫМ после выкладки —
# в обеих работах этого файла.
#
# ПОЧЕМУ В КАЖДОЙ РАБОТЕ, А НЕ В ОДНОЙ. Работы независимы: у каждой свой раннер
# и своя среда, и заглянуть в чужую ни одна не может. Сторож в одной работе
# ничего не говорит про вторую — а метка выпускает то, что сказали обе вместе.
# Здесь это особенно прямо: `put` и `brew` собирают и ставят ровно тот архив,
# который уедет человеку.
#
# ПОЧЕМУ ПАДАЕТ, А НЕ СНИМАЕТ ПЕРЕМЕННУЮ МОЛЧА. Снять её можно только блоком
# `env:` работы — а он затирает значение ДО сторожа, и сторож был бы зелен
# всегда, ничего не проверяя. Молчаливое снятие вдобавок прячет находку:
# заданная на пути выпуска переменная — признак того, что выпуск настроен
# неправильно, и это надо увидеть один раз глазами, а не глотать каждый раз.
#
# На ветке и в запросе слияния сторож молчит: кеш там разрешён и нужен, он для
# скорости. Красным он бывает только на метке.

on:
  push:
    paths:
      - "packaging/**"
      - "scripts/release/release-in-c.flang"
      - "scripts/release/path-without-node.flang"
      - "scripts/raskrutka.sh"
      - "scripts/guards/version-guard.flang"
      - "bootstrap/**"
      - "flang/src/emit/**"
      - "package.json"
      - ".github/workflows/install-path.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/release/release-in-c.flang"
      - "scripts/release/path-without-node.flang"
      - "scripts/raskrutka.sh"
      - "scripts/guards/version-guard.flang"
      - "bootstrap/**"
      - "flang/src/emit/**"
      - "package.json"
      - ".github/workflows/install-path.yml"
  # Раз в сутки — потому что ломает путь установки не только своя правка.
  # `asdf global` удалили в ЧУЖОМ инструменте, и наше дерево в тот день не
  # менялось вовсе: проверка, ходящая только на свои правки, такое пропустит.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  put:
    name: install-path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Красный на одной платформе не отменяет прогон на второй: нам важно
      # знать, обе сломаны или одна, — в этом и была вся беда с Маком.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # «формула:проверка» ниже сверяет формулу дерева с формулой крана —
          # сабмодулем packaging/homebrew-tap, а «плагин:проверка» — файлы
          # packaging/asdf с сабмодулем плагина packaging/asdf-plugin. Не
          # развёрнут любой из двух — свой сторож красен.
          submodules: true
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      # `cache: npm` и `npm ci` сняты вместе с `package-lock.json`. Двоичный
      # они здесь и не давали: `postinstall` клал его в `dvoichnyy/`, а всё
      # ниже зовёт `bootstrap/flang`, который собирает себе сам `./ярлык`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # GNU tar. Обычный `tar` на macOS — это bsdtar, у него нет ни `--sort`,
      # ни `--mtime`, и архив вышел бы с другими байтами и другим sha256, чем
      # тот, что сверяет brew. Формула это оговаривает словами; проверка сама
      # ищет `gtar`, но найти его она может, только если он поставлен.
      - name: GNU tar на macOS
        if: runner.os == 'macOS'
        run: brew install gnu-tar

      # Прежде здесь стоял прогон на JavaScript (flang/test/install-path.test.mjs,
      # 894 строки). Он был снят: к тому дню он звал flang/bin/flang.mjs, которого
      # в дереве уже нет, и потому НЕ ПРОХОДИЛ ни одного из четырёх путей —
      # красным был не путь установки, а сам прогон. Статическую его половину
      # держат сторожа на flang; настоящую установку держит работа brew ниже.
      - name: Сборка на Darwin не сломана молча
        run: ./ярлык дарвин:проверка

      # ── АРХИВ, ЗА КОТОРЫМ ХОДИТ BREW ──────────────────────────────────────
      #
      # Шаг ниже («формула:проверка») сверяет объявленный в формуле sha256 с
      # архивом и КРАСНЕЕТ, когда архива нет: хеш, который никто не может
      # сверить, — это хеш, который никто и не сверял. Архива в этой работе не
      # собиралось никогда, поэтому шаг был красен с 0.7.9 на обеих платформах
      # (прогон 34012604580 от 6 сентября 2026, обе работы `install-path`).
      #
      # ОТКУДА БЕРЁТСЯ АРХИВ — ЭТО РЕШЕНИЕ, А НЕ МЕЛОЧЬ, И ВОТ ОНО.
      #
      # Работа зовётся «путь установки», а путь установки начинается с того,
      # что brew скачивает файл ПО ССЫЛКЕ ИЗ ФОРМУЛЫ и сверяет его sha256. Тот
      # самый файл здесь и берётся — ссылкой из самой формулы, а не сборкой
      # своими руками. Так проверяется ровно то, что случится у человека:
      # ссылка ведёт куда обещано, и лежащий по ней архив отвечает объявленному
      # числу.
      #
      # ПОЧЕМУ НЕ СОБИРАТЬ ЕГО ЗДЕСЬ ВСЕГДА — ЗАМЕРЕНО, А НЕ ПРИКИНУТО. Дерево
      # ветки уходит вперёд выпуска: после v0.7.14 на dev лёг `394b2607`
      # (редактор строки в repl), и архив, собранный из нынешнего дерева, весит
      # 4 794 370 байт против 4 775 478 опубликованных, sha256
      # 31a51749… против 7106c141…. Сборка своими руками сделала бы работу
      # КРАСНОЙ НАВСЕГДА между выпусками — а вечно красный сторож это
      # выключенный сторож. Дерево при этом не сломано: расхождение снимает
      # следующий выпуск, где `bump-version` пересчитывает и версию, и хеш.
      #
      # НА МЕТКЕ ССЫЛКИ ЕЩЁ НЕТ: `release.yml` выкладывает архив в конце своего
      # прогона, а эта работа идёт с ним рядом. Тогда — и только тогда — архив
      # собирается тем же составным действием, каким его собирает `release.yml`
      # (сборка идёт около шести минут). Проверка не пропускается ни в одном из
      # двух случаев: в обоих у сторожа на руках настоящий архив.
      - name: Архив выпуска — тот, за которым ходит brew
        id: arhiv_vypuska
        run: |
          set -u
          ssylka="$(sed -n 's/^  url "\(.*\)"$/\1/p' packaging/homebrew/flang.rb)"
          if [ -z "$ssylka" ]; then
            echo "::error::в packaging/homebrew/flang.rb не нашлось поля url — сверять нечего, и поправить надо ЭТОТ шаг" >&2
            exit 1
          fi
          imya="${ssylka##*/}"
          case "$imya" in
            *.tar.gz) : ;;
            *) echo "::error::ссылка формулы ведёт не на архив: $ssylka" >&2; exit 1 ;;
          esac
          mkdir -p output
          echo "иду по ссылке формулы: $ssylka"
          if curl -fL --retry 3 --retry-delay 2 -o "output/$imya" "$ssylka"; then
            ls -l "output/$imya"
            echo "vzyat=da" >> "$GITHUB_OUTPUT"
            echo "архив выпуска взят по ссылке формулы — ровно тот файл, что скачает brew"
          else
            rm -f "output/$imya"
            echo "vzyat=net" >> "$GITHUB_OUTPUT"
            echo "по ссылке формулы архива нет — так бывает на метке: выпуск идёт прямо сейчас."
            echo "Собираю архив сам, тем же действием, что и release.yml."
          fi

      - name: Собрать архив, пока выпуск не выложен
        if: steps.arhiv_vypuska.outputs.vzyat != 'da'
        uses: ./.github/actions/release-archive

      - name: Формула Homebrew сходится сама с собой
        run: ./ярлык формула:проверка

      # `asdf plugin add flang` клонирует НЕ packaging/asdf, а отдельный
      # репозиторий digitable-lol/asdf-flang — с 8 сентября 2026 он сабмодуль
      # packaging/asdf-plugin. Четыре файла плагина (README.md, bin/download,
      # bin/install, bin/list-all) обязаны совпасть с packaging/asdf знак в
      # знак, три скрипта — быть исполняемыми, лишних файлов сверх LICENSE —
      # не быть. Так уже расходились: bin/install в дереве принимал новое имя
      # выхода сборки, а опубликованный искал flang_cli — и `asdf install`
      # падал последним шагом (docs/zettel/a-packaging-copy-in-another-
      # repository-drifts-both-ways.md).
      - name: Плагин asdf не отстал от дерева
        run: ./ярлык плагин:проверка

      # Сторожу верят после того, как он покраснел на подложенном. Подлог здесь
      # внутренний: план «Подлог» того же файла подменяет прочитанный bin/install
      # копии и ОБЯЗАН ответить провалом «подлог пойман». Ответил кодом 0 —
      # значит сравнение выпотрошено, и зелёный шаг выше ничего не значит.
      # Зовётся файлом, а не ярлыком `плагин:подлог`: прибор проб порчи
      # (scripts/guards/storozha-bez-podloga.sh) относит пробу к сторожу по файлу.
      - name: Сторож плагина asdf умеет краснеть
        run: |
          set -u
          if bootstrap/flang io scripts/guards/asdf-plugin-guard.flang --plan 'Подлог'; then
            echo "сторож плагина промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi

      # СОСТАВ ПОСТАВКИ. Проверки выше спрашивают, ЧТО делает поставка с тем,
      # что до неё доехало; эта спрашивает, доехало ли вообще. Повод — живой:
      # проводник по языку `flangtutor` и пять его уроков пролежали в дереве
      # готовыми и не попали ни в архив, ни в установку — ни одна проверка
      # этого не заметила, потому что состав архива не смотрел никто.
      # Список исполняемых файлов корня берётся у `find`, а не выписан: новый
      # файл обязан либо поехать в поставку, либо быть назван с причиной
      # остаться в дереве.
      - name: Состав поставки сходится с деревом
        run: ./ярлык поставка:проверка

      # И тот же порядок, что у плагина: сторожу верят после того, как он
      # покраснел на подложенном. Подлог внутренний — план «Подлог» того же
      # файла вычёркивает проводник из прочитанного состава архива и ОБЯЗАН
      # ответить провалом «подлог пойман». Зовётся файлом, а не ярлыком:
      # прибор проб порчи (scripts/guards/storozha-bez-podloga.sh) относит пробу к
      # сторожу по файлу.
      - name: Сторож состава поставки умеет краснеть
        run: |
          set -u
          if bootstrap/flang io scripts/guards/postavka-guard.flang --plan 'Подлог'; then
            echo "сторож состава поставки промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi

      # Сторожу верят только после того, как он покраснел на подложенном.
      # Порча — поле «version» в package.json; сторож обязан назвать ОБЕ строки
      # и оба места. Правка не привязана к номеру строки (задача 6612: подлог,
      # прибитый к числу, молча перестаёт собираться), но «подлог не собрался»
      # ловится отдельно и по имени — иначе шаг покраснел бы с неверной причиной.
      #
      # `sed` БЕЗ `-i`, из копии в оригинал, и это не стиль: работа идёт и на
      # macos-latest, а `sed -i` там — BSD sed, который требует после `-i`
      # обязательный довод-расширение и на форме GNU падает. Копия всё равно
      # снимается ради проверки «подлог собрался», так что лишнего шага нет.
      - name: Сторож версии умеет краснеть
        run: |
          set -u
          podlog=package.json
          cp "$podlog" "$podlog.do"
          sed 's/"version": "[^"]*"/"version": "0.0.0-podlog"/' "$podlog.do" > "$podlog"
          if cmp -s "$podlog.do" "$podlog"; then
            rm -f "$podlog.do"; git checkout -- "$podlog"
            echo "ПОДЛОГ НЕ СОБРАЛСЯ: поля version в $podlog уже нет — поправить подлог, сторож ни при чём" >&2
            exit 1
          fi
          rm -f "$podlog.do"
          if ./ярлык версия:проверка; then
            git checkout -- "$podlog"
            echo "сторож промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi
          git checkout -- "$podlog"
      - name: FLANG_VERSION совпадает с package.json
        run: ./ярлык версия:проверка

  # ── НАСТОЯЩИЙ brew, а не воспроизведение ───────────────────────────────────
  #
  # Работа выше повторяет раскладку формулы своими руками — потому что на
  # машине разработчика brew нет. Здесь он есть, и здесь проверяется ровно то,
  # чего повторение проверить не может: что файл РАЗБИРАЕТСЯ как Ruby, что
  # `bin.install`, `man1.install` и `share.install` делают обещанное и что
  # блок `test do` формулы проходит.
  #
  # Формула ставится на СВЕЖИЙ архив, а не на выпущенный: `url` и `sha256`
  # подменяются на локально собранный. Иначе проверялся бы прошлый релиз, то
  # есть ровно то дерево, которое уже уехало, — а нам нужно узнать про то,
  # которое уедет.
  brew:
    name: homebrew
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
      # `cache: npm` и `npm ci` сняты вместе с `package-lock.json`. Двоичный
      # они здесь и не давали: `postinstall` клал его в `dvoichnyy/`, а всё
      # ниже зовёт `bootstrap/flang`, который собирает себе сам `./ярлык`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: brew install gnu-tar

      # ПОСЛЕДНЕЕ ИМЯ В СПИСКЕ — `runtime`, каталог рантаймов девяти целей.
      # Прежде здесь стояло `share`, и такого каталога скрипт выпуска не клал
      # НИКОГДА: с самого заведения этого файла шаг падал на
      # `gtar: share: Cannot stat`, то есть работа brew ниже не доходила до
      # brew вовсе. Проверено прогоном 5 сентября 2026: та же команда со словом
      # `share` даёт код 2, со словом `runtime` — собирает архив.
      # ОБЕЩАНИЕ «ТОЙ ЖЕ КОМАНДОЙ» ТЕПЕРЬ ИСПОЛНЯЕТСЯ, А НЕ ПОВТОРЯЕТСЯ СЛОВАМИ.
      #
      # Здесь стояла КОПИЯ шага из `release.yml`, и в имени шага было написано
      # «той же командой». Копия разошлась с подлинником молча и в двух местах:
      # перечисляла файлы архива руками (подлинник берёт их вычитанием) и не
      # собирала точку раскрутки вовсе — `bootstrap/flang: No such file or
      # directory`, работа красна с 0.7.9 (прогон 34012604580). Теперь команда
      # одна на три работы: `.github/actions/release-archive`, и разойтись ей
      # не с чем. Путь собранного архива действие кладёт в `$ARHIV`.
      - name: Собрать архив тем же действием, что и release.yml
        uses: ./.github/actions/release-archive

      # ФОРМУЛУ ИЗ ФАЙЛА BREW БОЛЬШЕ НЕ СТАВИТ, И ЭТО ЗАМЕРЕНО.
      #
      # Здесь стояло `brew install --build-from-source ./output/tap/flang.rb`.
      # Нынешний Homebrew отвечает на это отказом: «Homebrew requires formulae
      # to be in a tap, rejecting: ./output/tap/flang.rb» (прогон 34263934131
      # от 8 сентября 2026). Поэтому формула кладётся в ЛОКАЛЬНЫЙ кран, заведённый
      # тут же. Имя крана `flang/proba` — нарочно НЕ `digitable-lol/tap`:
      # настоящий кран трогать нельзя, его сверяет отдельный сторож.
      - name: Формула на свежий архив
        run: |
          set -eu
          # Имена переменных латиницей: оболочка берёт в имена только ASCII, и
          # «архив=…» она читает как команду. Эта ошибка в этом репозитории уже
          # случалась, в workflow публикации, и стоила шага с кодом 127.
          archive="$PWD/$ARHIV"
          digest="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          brew tap-new flang/proba
          kran="$(brew --repository flang/proba)"
          mkdir -p "$kran/Formula"
          sed -e "s|^  url .*|  url \"file://${archive}\"|" \
              -e "s|^  sha256 .*|  sha256 \"${digest}\"|" \
              packaging/homebrew/flang.rb > "$kran/Formula/flang.rb"
          brew install --build-from-source --verbose flang/proba/flang

      - name: Блок test do формулы
        run: brew test flang/proba/flang

      - name: Поставленное brew умеет печатать в C
        run: |
          set -eu
          printf '%s\n' 'модуль «Проба»' '' 'тотальная функция «Два»' '  возвращает число' '  2' > проба.flang
          # Ответ ЧИТАЕТСЯ, а не выбрасывается. Прежде здесь стоял голый вызов
          # `--version`: команда шла как дым, «не упало — и ладно». Ровно этот
          # вопрос — «как поставленный двоичный себя зовёт» — и есть предмет
          # задачи 9959, где он дважды отвечал не так, и оба раза нашёл человек.
          # Формула объявляет `version` сама, есть с чем сверять.
          # ПЕРВАЯ СТРОКА, а не весь ответ. `--version` отвечает ДВУМЯ строками
          # НАРОЧНО: вторая называет отпечаток оболочки. Это поставлено туда
          # сознательно (flang/src/emit/c/flang_repl.c:274 и довод на 247/257):
          # без неё две разные сборки отвечали одинаково, и отличить их было
          # нечем. Формула сверяет ВХОЖДЕНИЕМ (assert_match) и потому зелена;
          # здесь стояло точное равенство всей выдачи — и шаг был обречён.
          # Смысл задачи 9959 сохранён: разойдись версия, первая строка покажет.
          otvet="$("$(brew --prefix)/bin/flang" --version | head -1)"
          v_formule="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' packaging/homebrew/flang.rb)"
          if [ -z "$v_formule" ]; then
            echo "::error::в packaging/homebrew/flang.rb не нашлось поля version — поправить надо ЭТОТ шаг"
            exit 1
          fi
          if [ "$otvet" != "flang $v_formule" ]; then
            echo "::error::brew поставил двоичный, который отвечает «${otvet}», а формула объявляет version $v_formule"
            echo "::error::Формула и отгруженный архив разошлись — это беда задачи 9959, а не придирка."
            exit 1
          fi
          echo "поставленный brew двоичный и формула сошлись: $v_formule"
          "$(brew --prefix)/bin/flang" emit проба.flang --target c --out печать
          test -f печать/flang_runtime.h
          grep -q 'SPDX-FileCopyrightText' печать/flang_runtime.h

      # ВСЕ ЦЕЛИ, А НЕ ОДНА. Шаг выше щупает `c` — и щупал только её, пока brew
      # ставил рантайм одной цели из девяти и восемь остальных у поставившего не
      # работали (задача 7261). Здесь каждая цель печатается из поставленного
      # brew, без единого ключа, и красная называется по имени.
      #
      # СПИСОК ЦЕЛЕЙ СПРАШИВАЕТСЯ У ПОСТАВЛЕННОГО ДВОИЧНОГО, а не выписан здесь.
      # Выписанный, он отстал бы молча при десятой цели: brew ставил бы её, этот
      # шаг бы её не щупал — ровно порода 7261, только этажом выше. Двоичный
      # называет цели сам (`EMIT_TARGETS_WORDS` в flang_repl.c) и печатает их в
      # справке; отбор идёт по ASCII (`--target` и палка), чтобы не зависеть от
      # локали работника.
      - name: Поставленное brew умеет печатать во все цели, какие называет само
        run: |
          set -eu
          printf '%s\n' 'модуль «Проба»' '' 'тотальная функция «Два»' '  возвращает число' '  2' > проба.flang
          beda=0
          celi="$("$(brew --prefix)/bin/flang" --help | grep -- '--target' | tr ' ' '\n' | grep '|' | tr '|' ' ')"
          n_celey="$(printf '%s\n' $celi | grep -c .)"
          # Длина списка проверяется ДО цикла: справка, из которой ничего не
          # вычиталось, дала бы список пустой, цикл не выполнился бы ни разу, и
          # шаг зазеленел бы, не пощупав ничего.
          if [ "$n_celey" -lt 9 ]; then
            echo "::error::flang --help назвал целей печати: $n_celey, а их девять — справка разошлась с пробой"
            exit 1
          fi
          echo "двоичный называет цели: $celi"
          for cel in $celi; do
            if "$(brew --prefix)/bin/flang" emit проба.flang --target "$cel" --out "печать-$cel"; then
              echo "  зелена  $cel"
            else
              echo "::error::цель $cel не печатается из установки brew — рантайма нет в share/flang/$cel"
              beda=$((beda + 1))
            fi
          done
          # Число каталогов НЕ ЕСТЬ их состав: девять каталогов с чужими именами
          # дали бы то же самое число. Поэтому спрашивается каждый поимённо.
          for cel in $celi; do
            if [ ! -d "$(brew --prefix)/share/flang/$cel" ]; then
              echo "::error::в share/flang нет каталога цели $cel, а двоичный в неё печатает"
              beda=$((beda + 1))
            fi
          done
          celey=$(find "$(brew --prefix)/share/flang" -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$celey" -ne "$n_celey" ]; then
            echo "::error::в share/flang легло каталогов целей: $celey, а печать обещает $n_celey"
            beda=$((beda + 1))
          fi
          [ "$beda" -eq 0 ] || exit 1
