name: Lean crosscheck

# СВЕРКА ПРАВИЛ ВЫВОДА ЯДРОМ LEAN 4 ГОНЯЕТСЯ ПО РАСПИСАНИЮ, А НЕ ПО ПАМЯТИ.
#
# ЗАЧЕМ ЗАВЕДЕНА. До 23 сентября 2026 `flang/proof/lean/run.sh` не звал НИКТО:
# ни `.githooks/pre-push`, ни одна работа CI. Цена этого измерена и названа:
# коммит `bc962bb38` (22 сентября, переименование каталога доказательств)
# переименовал девять файлов Lean в латиницу, поправил пути в скрипте, но
# пропустил цикл сборки — тот продолжал звать `Модель.lean`, `Правила.lean`,
# `Терм.lean` и остальные кириллические имена, которых в дереве уже нет.
#
#   Модель.lean НЕ СОБРАЛСЯ: no such file or directory (error code: 2)   код 1
#
# Поломка прожила ДЕСЯТЬ КОММИТОВ и не покраснела нигде. Проверка, которую
# никто не гоняет, ломается молча и годами показывает зелёное — именно та
# порода, от которой в этом дереве заведены пробы на подлог.
#
# ПОЧЕМУ РАСПИСАНИЕМ, А НЕ НА КАЖДЫЙ ПУШ. Замер 23 сентября 2026 на этом же
# прогоне: `Term.lean` собирается 55,6 с, `Consistency.lean` 20,4 с,
# `Acceptance.lean` 16,8 с, `Rules.lean` 6,2 с, плюс 52 искажения ловушки
# отдельными файлами и сверка вердиктов по 248 парам (1491 блок) через весь
# набор проб сверщика. Это десятки минут, и на каждый пуш они не кладутся —
# ровно тот довод, по которому хук перед пушем гоняет только дешёвое.
#
# ЧТО ЗНАЧИТ КРАСНЫЙ. Скрипт печатает ЧИСЛА и отвечает кодом: 0 — сошлось всё,
# 1 — разошлось. Красное здесь — честный замер: либо Lean перестал собирать
# формализацию, либо теорема «состоятельность» встала на аксиому сверх трёх
# стандартных, либо ловушка перестала ловить, либо вердикт сверщика разошёлся
# с вердиктом Lean. Ни одно из этого не чинится правкой работы.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: lean-crosscheck
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Версия берётся из дерева, а не вписывается сюда: `lean-toolchain`
      # лежит рядом с формализацией и меняется вместе с ней.
      - name: Install Lean
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$(cat flang/proof/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean version
        run: lean --version

      # Сверка вердиктов C ↔ Lean гоняет весь набор проб сверщика, поэтому
      # сверщик обязан быть собран.
      - name: Build proof checker
        run: make -C flang/proof/checker

      - name: Build flang
        run: make -C bootstrap -j4

      # Каждый приём `шаг_вывода` сверщика либо в приёмке Lean, либо строкой
      # долга с номером задачи (ADR-0064): иначе теоремы состоятельности у него
      # нет, а сверка ниже молча считает его «вне приёмки». Н6 и О9 прожили так
      # девять дней (26 сентября — 5 октября 2026), пока число 81 переписывалось
      # в прозе от руки. Lean этому шагу не нужен; подлог — три порчи копий.
      - name: Every checker move has a theorem or a debt row
        run: |
          bootstrap/flang run-script lean-rules:forgery
          bootstrap/flang run-script lean-rules:check

      # ПОЧЕМУ ЗДЕСЬ FLANG_TMP. План просит временный каталог по образцу
      # «FLANG_TMP, а если переменной нет — /srv/tmp». `/srv/tmp` есть на машине
      # разработки и нет у работника, поэтому на работнике каталог не заводился
      # и сверка отвечала кодом 3 «временный каталог не заведён»: НИЧЕГО НЕ
      # ПРОВЕРЕНО. Снято 4 октября 2026 — первый красный прогон после того, как
      # план на flang сменил на `main` прежний shell-обходчик (до него шесть
      # суток подряд зелено). Переменная называется явно, а не чинится правкой
      # умолчания в плане: умолчание трогает и другие планы.
      - name: Run Lean crosscheck
        env:
          FLANG_TMP: ${{ runner.temp }}
        run: bootstrap/flang io flang/proof/lean/run.fscript --max-steps 4000000000 --timeout 900000

      - name: Build the second checker
        run: make -C flang/proof/checker second

      - name: Run the second checker against the first
        env:
          FLANG_TMP: ${{ runner.temp }}
        run: |
          bootstrap/flang run-script checker:second-forgery
          bootstrap/flang run-script checker:second
