# Публикация сайта документации на GitHub Pages.
#
# Сайт собирается из docs/ одной командой без единой зависимости — поэтому
# здесь нет ни установки пакетов, ни кеша: `actions/setup-node` и `node`.
#
# Сборка ОТКАЗЫВАЕТ, если исходного файла нет, ссылка ведёт в никуда или
# заметка не вписана в указатель базы знаний. Значит сломанный сайт до Pages
# не доедет — он не соберётся.

name: Сайт документации

on:
  push:
    branches: [main]
    # Гоняем только когда менялось то, из чего сайт собирается.
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'flang/SPEC.md'
      - 'flang/proof/SPEC.md'
      - 'flang/cat/SPEC.md'
      - 'flang/conc/SPEC.md'
      - 'scripts/build-changelog-page.mjs'
      - 'scripts/build-changelog.mjs'
      - 'scripts/releases.flang'
      - 'scripts/releases-page.flang'
      - '.github/workflows/pages.yml'
      # Подсветка блоков кода красит НАСТОЯЩИМ лексером языка, а он живёт в
      # двоичном компиляторе: правка точки раскрутки или двери к двоичному
      # меняет то, что увидит читатель.
      - 'bootstrap/**'
      - 'flang/scripts/binary.mjs'
      # Замер контраста подсветки: правка сторожа меняет то, чем сборка судит
      # палитру, а правка таблицы стилей — то, что он судит.
      - 'docs/site/storozh-kontrasta.flang'
      - 'docs/site/style.css'
  # Позволяет опубликовать вручную, не дожидаясь правки документов.
  workflow_dispatch:

# Один заход на публикацию за раз. Уже идущий не прерываем: недособранный
# сайт хуже, чем сайт на минуту старее.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sobrat:
    name: Собрать
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — не запас на будущее. Страница «Что изменилось»
      # печатается ИЗ ИСТОРИИ: вливания, их коммиты и числа дерева на каждом
      # слиянии. В клоне глубиной в одну ревизию печатать её не из чего.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # ДВОИЧНЫЙ САЙТУ ОБЯЗАТЕЛЕН, и с 20 августа 2026 это уже не «желательно».
      # Он делает две вещи: красит блоки кода настоящим лексером языка
      # (docs/site/podsvetka.mjs) и МЕРЯЕТ КОНТРАСТ подсветки —
      # docs/site/storozh-kontrasta.flang, план ввода-вывода, который сборка
      # зовёт прогоном. Без него палитра уехала бы на сайт непроверенной, а это
      # ровно та беда, ради которой замер и заведён; поэтому отсутствие
      # двоичного сборка теперь называет бедой и отказывает, а не молчит.
      # `continue-on-error` по этой причине снят: падать надо здесь, где видно
      # причину, а не через два шага.
      #
      # Флаги дешёвые НАМЕРЕННО: `-O0` вместо `-O2 -flto`. Сайту нужен разбор
      # трёх сотен коротких блоков, а не скорость счёта; замерено — сборка
      # двоичного 35 с вместо трёх минут, а время сборки сайта не изменилось
      # вовсе (4 с в обоих случаях).
      #
      # ШАГ СТОИТ ПЕРВЫМ, И ЭТО НЕ ВКУС. Двоичного нет в дереве — он
      # собирается здесь; всё, что зовёт `bootstrap/flang`, обязано стоять
      # ниже. С 23 августа 2026 шаг стоял ТРЕТЬИМ, после перепечатки страницы
      # выпусков, которая в тот день перешла с Node на flang. Работа падала на
      # ней сотню прогонов подряд с `bootstrap/flang: No such file or
      # directory`, код 127, за сорок секунд — до сборки дело не доходило
      # вовсе. Порядок тот же, что у соседних работ дерева (`binary.yml`):
      # сборка сразу за выемкой, прогоны после неё.
      - name: Собрать двоичный компилятор (подсветка и замер контраста)
        run: make -C bootstrap CFLAGS='-std=c99 -O0' -j2

      # Перепечатка ДО сборки. Записанная в дереве страница — снимок на момент
      # последней перепечатки, и между слиянием и перепечаткой она отстаёт на
      # одно вливание. За это отставание краснеет flang/test/changelog-page.test.mjs
      # — то есть чинится оно в дереве. Но пока не починено, читатель сайта не
      # обязан видеть вчерашний день: здесь страница печатается заново, и
      # опубликованное всегда свежее. Сборка НЕ коммитит: дерево правит человек,
      # а не работник.
      - name: Перепечатать журнал вливаний
        run: node scripts/build-changelog-page.mjs

      # По той же причине, что и журнал: страница выпусков печатается из тегов,
      # и между новым тегом и перепечаткой она отстаёт. Опубликованное всегда
      # свежее; дерево при этом не правится — сборка не коммитит.
      #
      # `--max-steps 40000000` — не запас на глаз, а команда, записанная в
      # ведомости ярлыков дерева (`ярлыки.flang`, ярлык «выпуски:страница»).
      # У `flang io` умолчание предела плана — 10 000 000 шагов, и разбор
      # `docs/release-notes.json` (42 КиБ, вложенность 5) в него не влезает:
      # прогон отвечает кодом 3 и словами «функция «Шаг разметки json»
      # исчерпала лимит шагов (10000000)». Замерено здесь же: с ключом план
      # доходит до конца и печатает «Напечатано: выпусков 14».
      - name: Перепечатать страницу выпусков
        run: LC_ALL=C.UTF-8 bootstrap/flang io scripts/releases-page.flang --max-steps 40000000

      # Отдельным шагом до сборки: если ссылки битые, видно сразу и по имени,
      # а не среди вывода сборки.
      - name: Проверить ссылки
        run: node docs/site/build.mjs --check

      - name: Собрать
        run: node docs/site/build.mjs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/site/out

  opublikovat:
    name: Опубликовать
    needs: sobrat
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
