# ВРЕМЕННАЯ РАБОТА ВЕТКИ `r/ci-install-path` — СНИМАЕТСЯ ПЕРЕД СЛИЯНИЕМ.
#
# Первый заход (прогон 34261764782) показал: `put` зелена на обеих площадках,
# а `brew` встаёт внутри `scripts/release-in-c.flang` на проверке страницы
# руководства — «страница набралась, но это не страница про flang». Здесь
# замер того, чем именно она давится на macOS: чем набирает groff и что
# оставляет sed.

name: Проба ветки

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groff:
    name: proba-groff
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Чем набирают и чем чистят
        run: |
          groff --version 2>&1 | head -1 || true
          sed --version 2>&1 | head -1 || true
          command -v col || true
      - name: Три вида одной и той же страницы
        run: |
          set -u
          echo "── как сейчас: groff | sed 's/\\x1b\\[…m//g'"
          sh -c 'groff -K utf8 -man -Tutf8 "$0" | sed "s/\x1b\[[0-9;]*m//g" | head -2 | cat -v' packaging/flang.1 || true
          echo
          echo "── ESC собран printf-ом"
          sh -c 'esc=$(printf "\033"); groff -K utf8 -man -Tutf8 "$0" | sed "s/${esc}\[[0-9;]*m//g" | head -2 | cat -v' packaging/flang.1 || true
          echo
          echo "── GROFF_NO_SGR + col -b"
          sh -c 'GROFF_NO_SGR=1 groff -K utf8 -man -Tutf8 "$0" | col -b | head -2 | cat -v' packaging/flang.1 || true
          echo
          echo "── сырой groff, без чистки"
          sh -c 'groff -K utf8 -man -Tutf8 "$0" | head -2 | cat -v' packaging/flang.1 || true
