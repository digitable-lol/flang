name: Доказуемость

# ВЕРДИКТ «ДОКАЗУЕМ / НЕ ДОКАЗУЕМ» СНИМАЕТСЯ ПРИБОРОМ ПО РАСПИСАНИЮ, А НЕ
# ВПИСЫВАЕТСЯ РУКОЙ.
#
# Работа зовёт `sh scripts/доказуемость.sh`: четыре проверки, у каждой число,
# слово выводится из чисел (шапка скрипта). Код возврата несёт вердикт:
# 0 — ДОКАЗУЕМ, 1 — НЕ ДОКАЗУЕМ, 2 — не смог измерить. Работа отвечает тем же
# кодом, поэтому её цвет — это вердикт, а не «прошла ли сборка».
#
# ── Почему работа КРАСНАЯ сегодня, и это законно ────────────────────────────
# Порог проверки 2 — доли обязательств корпуса, которую сверщик проиграл
# независимо от ядра, — 100 %: слово владельца 17 сентября 2026 (задача 3348).
# Доля на этот день — 633 из 650 = 97,38 %: 17 мест сверщик берёт на слово
# ядра или закрывает вычислением; где стоит каждое и чего стоит его закрыть —
# docs/road-to-one-hundred-measured.md. Пока эти места не проиграны, прибор
# печатает «НЕ ДОКАЗУЕМ», выходит кодом 1, и работа красна. Красный здесь —
# ЧЕСТНЫЙ ЗАМЕР, а не поломка: чинится не работа и не порог, а доля (записи
# корпуса и сверщик, стек K). Зелёной работа станет сама, когда доля дорастёт
# до знаменателя, а набор проб и оба храповика останутся целы. Вписать
# «ДОКАЗУЕМ» рукой или опустить порог, чтобы работа позеленела, — подлог.
#
# Код 2 — другое дело: прибор не дал числа (линейка упала, набор проб не
# запустился). Это поломка прибора или дерева, её чинят, и сводка называет её
# отдельно от вердикта.
#
# ── Почему не на каждый пуш ─────────────────────────────────────────────────
# Прогон стоит около 3 минут поверх сборки двоичного (`make -C bootstrap`,
# 5–7 минут); вердикт двигают правки в flang/proof, а не каждый коммит. Раз в
# сутки плюс запуск рукой (`workflow_dispatch`) — довольно, чтобы слово
# «ДОКАЗУЕМ» в документах не устаревало молча. Час выбран вне окон других
# расписаний: reprint.yml — воскресенье 02:00 UTC, dvoyniki.yml — понедельник
# 04:00 UTC, install-path.yml — ежедневно 04:17 UTC.
#
# ── Что нужно прибору (шапка scripts/доказуемость.sh) ───────────────────────
# Дерево под учётом git (линейка берёт ведомость из `git archive HEAD`, глубины
# 1 довольно); исходник сверщика flang/proof/чекер/сверщик.c — скрипт соберёт
# его сам, если двоичного нет, но здесь он собирается заранее тем же Makefile,
# что и в пробах; линейке flang/proof/доля-корпуса.sh нужен bootstrap/flang.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verdikt:
    name: provability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Двоичное ядро — линейке доли нужен bootstrap/flang
        run: make -C bootstrap -j"$(nproc)"
      - name: Сверщик — тем же Makefile, что и пробы
        run: make -C flang/proof/чекер
      - name: Вердикт прибором — код 0 ДОКАЗУЕМ, 1 НЕ ДОКАЗУЕМ, 2 не смог измерить
        run: |
          set +e
          export LC_ALL=C.UTF-8
          log="$RUNNER_TEMP/доказуемость.log"
          sh scripts/доказуемость.sh > "$log" 2>&1
          kod=$?
          cat "$log"
          {
            echo "## Доказуемость — вердикт прибора, код $kod"
            echo
            echo '```'
            cat "$log"
            echo '```'
            echo
            case $kod in
              0) echo 'ДОКАЗУЕМ: все четыре проверки сошлись.' ;;
              1) echo 'НЕ ДОКАЗУЕМ: хоть одна проверка не сошлась — какая и каким числом, названо выше. Красный здесь — честный замер, а не поломка работы (см. шапку provability.yml); порог доли — 100 %.' ;;
              *) echo 'НЕ СМОГ ИЗМЕРИТЬ: прибор не дал числа — это поломка прибора или дерева, а не вердикт.' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$kod"
