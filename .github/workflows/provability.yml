name: Provability

# ВЕРДИКТ «ДОКАЗУЕМ / НЕ ДОКАЗУЕМ» СНИМАЕТСЯ ПРИБОРОМ ПО РАСПИСАНИЮ, А НЕ
# ВПИСЫВАЕТСЯ РУКОЙ.
#
# Работа зовёт `sh scripts/доказуемость.sh`: четыре проверки, у каждой число,
# слово выводится из чисел (шапка скрипта). Код возврата несёт вердикт:
# 0 — ДОКАЗУЕМ, 1 — НЕ ДОКАЗУЕМ, 2 — не смог измерить. Работа отвечает тем же
# кодом, поэтому её цвет — это вердикт, а не «прошла ли сборка».
#
# ── Когда работа красна, и почему это законно ───────────────────────────────
# Порог проверки 2 — доли обязательств корпуса, которую сверщик проиграл
# независимо от ядра, — 100 %: слово владельца 17 сентября 2026 (задача 3348).
# Доля ниже порога — прибор печатает «НЕ ДОКАЗУЕМ» и выходит кодом 1, и работа
# красна. Красный здесь — ЧЕСТНЫЙ ЗАМЕР, а не поломка: чинится не работа и не
# порог, а доля (записи корпуса и сверщик). Числа не переписываются в эту
# шапку: они устаревают молча, а прибор печатает их сам. Вписать «ДОКАЗУЕМ»
# рукой или опустить порог, чтобы работа позеленела, — подлог.
#
# ── ЧТО ЭТА РАБОТА МЕРИТ, А ЧЕГО НЕ МЕРИТ (пункт 11 внешнего аудита) ────────
# Замер 19 сентября 2026 на дереве 404c4ec0a: `sh scripts/доказуемость.sh`
# печатает ДОКАЗУЕМ и отвечает кодом 0 ДАЖЕ ТОГДА, когда `bootstrap/flang` из
# дерева убран. Все четыре его проверки читают записи корпуса, манифест
# подделок и сверщика — и ни одна не зовёт собранный двоичный. Шаг
# `make -C bootstrap` выше при этом стоял и создавал вид, будто вердикт снят
# на финальном двоичном; на деле он был снят на исходниках и записях.
# Ниже это закрыто тремя шагами: отпечаток при двоичном, переигрывание записей
# корпуса ПЕЧАТЬЮ СОБРАННОГО ДВОИЧНОГО (`--вложенность`) и проба, которая
# требует от этого шага красного, когда двоичного нет.
#
# Код 2 — другое дело: прибор не дал числа (линейка упала, набор проб не
# запустился). Это поломка прибора или дерева, её чинят, и сводка называет её
# отдельно от вердикта.
#
# ── Почему не на каждый пуш ─────────────────────────────────────────────────
# Прогон стоит около 3 минут поверх сборки двоичного (`make -C bootstrap`,
# 5–7 минут); вердикт двигают правки в flang/proof, а не каждый коммит. Раз в
# сутки плюс запуск рукой (`workflow_dispatch`) — довольно, чтобы слово
# «ДОКАЗУЕМ» в документах не устаревало молча. Час выбран вне окон других
# расписаний: reprint.yml — воскресенье 02:00 UTC, dvoyniki.yml — понедельник
# 04:00 UTC, install-path.yml — ежедневно 04:17 UTC.
#
# ── Что нужно прибору (шапка scripts/доказуемость.sh) ───────────────────────
# Дерево под учётом git (линейка берёт ведомость из `git archive HEAD`, глубины
# 1 довольно); исходник сверщика flang/proof/checker/checker.c — скрипт соберёт
# его сам, если двоичного нет, но здесь он собирается заранее тем же Makefile,
# что и в пробах; линейке flang/proof/corpus-share.sh нужен bootstrap/flang.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verdikt:
    name: provability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build bootstrap
        run: make -C bootstrap -j"$(nproc)"
      - name: Build proof checker
        run: make -C flang/proof/checker

      # ── ФИНАЛЬНЫЙ ДВОИЧНЫЙ, А НЕ ТОЛЬКО ИСХОДНИКИ ────────────────────────
      # Отпечаток кладётся СРАЗУ после сборки тем, кто собрал: без него
      # признак свежести падает на сравнение времён файлов, а в CI время врёт
      # в обе стороны (кеш отдаёт двоичный со старым временем, checkout кладёт
      # семя свежим).
      - name: Record seed fingerprint
        run: sh flang/proof/corpus-share.sh --отпечаток

      # `--вложенность` — единственная проверка этого дерева, где предмет суда
      # есть САМ СОБРАННЫЙ ДВОИЧНЫЙ: каждая запись корпуса печатается заново
      # `bootstrap/flang check --proof --записать` и сверяется с лежащей в
      # дереве побайтово, а отставший от семени двоичный роняет шаг кодом 2.
      # Без этого шага вердикт ниже говорил бы о записях, напечатанных когда-то,
      # а не о двоичном, который выйдет в выпуск.
      - name: Check corpus records
        run: sh flang/proof/corpus-share.sh --вложенность

      # Сторож, которого нельзя покрасить, неотличим от выключенного. Двоичный
      # уносится в RUNNER_TEMP и возвращается при ЛЮБОМ исходе: иначе неудача
      # пробы оставила бы работу без двоичного и следующий шаг врал бы о другом.
      - name: Probe missing binary
        run: |
          set +e
          mv bootstrap/flang "$RUNNER_TEMP/flang.отложен"
          sh flang/proof/corpus-share.sh --вложенность > "$RUNNER_TEMP/без-двоичного.log" 2>&1
          kod=$?
          mv "$RUNNER_TEMP/flang.отложен" bootstrap/flang
          cat "$RUNNER_TEMP/без-двоичного.log"
          if [ "$kod" -eq 0 ]; then
            echo "::error::шаг «Записи корпуса» промолчал без собранного двоичного — проверять им нечего"
            exit 1
          fi
          echo "проба сошлась: без двоичного шаг отвечает кодом $kod"

      # Четыре покрытия публикуются ПОРОЗНЬ — доля корпуса, формализация,
      # известные нарушения состоятельности, трансляция. Код 2 значит «Lean на
      # раннере нет, блоки вне приёмки здесь не сняты» и работу не роняет:
      # прибор МЕРИТ, а не судит.
      - name: Measure four coverages
        run: |
          set +e
          export LC_ALL=C.UTF-8
          log="$RUNNER_TEMP/покрытия.log"
          sh scripts/four-coverages.sh > "$log" 2>&1
          kod=$?
          cat "$log"
          {
            echo "## Четыре покрытия — порознь (код $kod)"
            echo
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$kod" -le 2 ] || exit 1

      - name: Report verdict
        run: |
          set +e
          export LC_ALL=C.UTF-8
          log="$RUNNER_TEMP/доказуемость.log"
          sh scripts/доказуемость.sh > "$log" 2>&1
          kod=$?
          cat "$log"
          {
            echo "## Доказуемость — вердикт прибора, код $kod"
            echo
            echo '```'
            cat "$log"
            echo '```'
            echo
            case $kod in
              0) echo 'ДОКАЗУЕМ: все четыре проверки сошлись.' ;;
              1) echo 'НЕ ДОКАЗУЕМ: хоть одна проверка не сошлась — какая и каким числом, названо выше. Красный здесь — честный замер, а не поломка работы (см. шапку provability.yml); порог доли — 100 %.' ;;
              *) echo 'НЕ СМОГ ИЗМЕРИТЬ: прибор не дал числа — это поломка прибора или дерева, а не вердикт.' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$kod"
