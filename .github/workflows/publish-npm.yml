# Выпуск версии: релизный архив C на GitHub и пакет @digitable-lol/flang в npm.
#
# Запускается только на теге вида v0.4.0 — не на каждый push в main. Причина в
# необратимости: опубликованную версию нельзя переиздать под тем же номером, а
# снять её можно лишь в первые 72 часа и ценой репутации пакета. Тег — это
# явное решение человека «вот эту версию наружу», и оно должно приниматься
# отдельно от решения «влить ветку».
#
# ── ЧТО БЫЛО СЛОМАНО ДО 20 АВГУСТА 2026 ─────────────────────────────────────
#
# Порядок шагов был замкнут сам на себя, и выпуск не мог состояться НИ РАЗУ.
# `npm test` шёл первым шагом проверок, а в наборе есть
# `flang/test/release-exists.test.mjs`: он спрашивает у GitHub, существует ли
# релиз с версией из `package.json` и лежит ли в нём архив
# `flang-<версия>-c.tar.gz`. На новом теге такого релиза, разумеется, ещё нет —
# и ни один шаг этого прогона архив не собирал и никуда не клал. Проверка
# краснела, публикация не наступала, а собрать архив было нечем: скрипт
# `scripts/release-in-c.flang` звали руками с чьей-то машины.
#
# Отсюда починка, и она не косметическая: архив СОБИРАЕТСЯ И ПРИКЛАДЫВАЕТСЯ К
# РЕЛИЗУ ЗДЕСЬ ЖЕ, до `npm test`. После этого набор проверяет то, что уже
# существует, и порядок перестаёт быть кругом: собрали → приложили → проверили
# → опубликовали.
#
# ── ВТОРОЕ, ЧТО БЫЛО СЛОМАНО ────────────────────────────────────────────────
#
# Шаг «Проверить, что flang запускается из пакета» распаковывал тарбол и звал
# `flang/bin/flang.mjs` — реализацию на JavaScript. С 20 августа 2026 пакет
# отдаёт человеку ДВОИЧНЫЙ компилятор (`packaging/postinstall.mjs` собирает его
# при установке), и звать `.mjs` напрямую значило проверять не то, что получает
# человек. Теперь шаг ставит тарбол в пустой каталог обычным `npm install` и
# зовёт `node_modules/.bin/flang` — то есть ровно ту команду и тем же путём.
#
# Требуется секрет NPM_TOKEN — токен npm с правом публикации в scope
# @digitable-lol. Без него шаг публикации не выполняется, а workflow сообщает
# об этом предупреждением, а не падает: отсутствие секрета на форке не должно
# выглядеть поломкой.
#
# Провенанс (--provenance) включён: npm свяжет опубликованную версию с этим
# workflow и коммитом, и любой сможет проверить, откуда взялся тарбол. Для
# этого нужны права id-token: write, они выданы ниже.

name: Выпуск — релиз на GitHub и публикация в npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Только проверить, не публикуя"
        type: boolean
        default: true

permissions:
  # contents: write — не расширение полномочий ради удобства, а то, без чего
  # порядок шагов остаётся кругом: релиз и вложение к нему создаются этим же
  # прогоном. Прежде стояло `read`, и приложить архив было нечем.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история и все теги: журнал изменений печатается из них
          # (scripts/build-changelog.mjs), и flang/test/changelog.test.mjs
          # сверяет записанный файл с историей. В клоне из одной ревизии эта
          # сверка сравнивает пустоту с пустотой и молчит.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Установить зависимости
        # `npm ci` здесь заодно собирает двоичный компилятор: у пакета появился
        # postinstall. Это около 35 секунд и это НУЖНО — набор тестов проверяет
        # путь установки целиком (flang/scripts/npm-install.flang, ярлык `установка:npm`).
        run: npm ci

      - name: Проверить, что тег совпадает с версией пакета
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          # Имена переменных латиницей. В именах оболочка допускает только
          # [A-Za-z_][A-Za-z0-9_]*, поэтому «тег=…» она разбирает не как
          # присваивание, а как команду — и шаг падал с кодом 127 «command not
          # found», не назвав ни одной причины. Внутри значений и сообщений
          # кириллица по-прежнему уместна, в именах — нет.
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::тег $GITHUB_REF_NAME обещает версию $tag_version, а package.json говорит $package_version"
            exit 1
          fi
          echo "версия $package_version подтверждена тегом"

      - name: Собрать двоичный из семени
        # ШАГ ДОБАВЛЕН 3 СЕНТЯБРЯ, И БЕЗ НЕГО ВЫПУСК НЕ ПРОХОДИЛ НИ РАЗУ.
        #
        # Следующий шаг зовёт `bootstrap/flang`, а собрать его было некому:
        # `npm ci` кладёт двоичный в `dvoichnyy/`, а `./ярлык` звался шагом
        # `npm test` ПОСЛЕ архива. На метке v0.7.0 шаг упал кодом 127 —
        # «команда не найдена», — и релиз не создался. Нашла ячейка Ч367,
        # разбирая уход npm; проверено на живом прогоне 33726967091.
        run: |
          set -eu
          make -C bootstrap -j"$(nproc)"
          ls -l bootstrap/flang
          LC_ALL=C.UTF-8 bootstrap/flang --version

      - name: Собрать релизный архив C
        # Скрипт не только печатает компилятор в C99, но и СОБИРАЕТ напечатанное
        # в окружении без Node в PATH и запускает собранное. Битый архив дальше
        # этого шага не уедет.
        #
        # Список файлов берётся вычитанием, а не перечислением: сборка идёт в том
        # же каталоге и оставляет рядом *.o, libcompiler_flang.a и сам бинарник —
        # `tar … .` унёс бы человеку бинарник чужой машины вместо исходников.
        # Перечислять имена поимённо тоже нельзя: между 0.5.1 и 0.5.2 два файла
        # из девяти переименовались, и список молча отстал бы.
        #
        # Ключи tar — ради ПОВТОРИМОСТИ: простой `tar -czf` кладёт в архив время
        # правки, права и владельца, и один и тот же каталог даёт разные байты.
        # Хеш, который нельзя повторить, нельзя и проверить.
        run: |
          set -eu
          LC_ALL=C.UTF-8 bootstrap/flang io scripts/release-in-c.flang --timeout 1800000
          version="$(node -p 'require("./package.json").version')"
          files="$(cd output/release-c && ls | grep -Ev '\.(o|a)$|^flang(_cli)?$')"
          echo "в архив идут файлы:"; echo "$files" | sed 's/^/  /'
          tar --sort=name --format=ustar --owner=0 --group=0 --numeric-owner \
              --mtime=@0 --mode=u=rw,go=r,a+X -C output/release-c -cf - $files \
            | gzip -9n > "output/flang-$version-c.tar.gz"
          ls -l "output/flang-$version-c.tar.gz"
          sha256sum "output/flang-$version-c.tar.gz"
          echo "ARHIV=output/flang-$version-c.tar.gz" >> "$GITHUB_ENV"

      - name: Сверить хеш архива с формулой Homebrew
        # Формула несёт sha256 архива, и brew сверяет его сам: разойдись он —
        # `brew install` встанет на скачивании, у ВСЕХ и сразу. Проверять это
        # надо здесь, до того как архив уедет в релиз, а не по жалобам.
        run: |
          set -eu
          sobran="$(sha256sum "$ARHIV" | cut -d' ' -f1)"
          v_formule="$(sed -n 's/^ *sha256 "\([0-9a-f]\{64\}\)".*/\1/p' packaging/homebrew/flang.rb)"
          if [ "$sobran" != "$v_formule" ]; then
            echo "::error::архив собрался с sha256 $sobran, а packaging/homebrew/flang.rb ждёт $v_formule."
            echo "::error::Хеш описывает ДЕРЕВО, а не номер версии, и пересчитывается при каждом выпуске."
            echo "::error::Впишите в формулу: sha256 \"$sobran\" — и повторите тег."
            exit 1
          fi
          echo "хеш архива совпал с формулой: $sobran"

      - name: Приложить архив к релизу
        # Порядок здесь и есть починка: архив ложится в релиз ДО `npm test`,
        # потому что набор его существования и требует. `gh release create` на
        # уже существующем релизе отвечает ошибкой — поэтому сначала спрашиваем.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" \
              --notes "$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          fi
          gh release upload "$GITHUB_REF_NAME" "$ARHIV" --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'

      - name: Прогнать весь набор тестов
        # Идёт ПОСЛЕ выкладки архива, и это не вкусовщина: в наборе есть
        # flang/test/release-exists.test.mjs, который ходит в GitHub и требует,
        # чтобы релиз с этой версией существовал и нёс архив. Раньше архива он
        # краснел всегда, и выпуск не мог состояться ни разу.
        run: npm test

      - name: Проверить состав пакета
        # Тесты и служебное в тарбол попадать не должны: однажды туда уже
        # уезжали 50 тестовых файлов. Проверка дешёвая, а находка дорогая.
        run: |
          set -eu
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [pkg] = require("/tmp/pack.json")
            const лишнее = pkg.files.map((f) => f.path).filter((p) => /(^|\/)test\/|\.test\.mjs$/.test(p))
            if (лишнее.length > 0) {
              console.error("в пакет попали тестовые файлы:\n  " + лишнее.slice(0, 10).join("\n  "))
              process.exit(1)
            }
            console.log(`файлов ${pkg.entryCount}, размер ${(pkg.size / 1024).toFixed(0)} КБ`)
          '

      - name: Проверить, что пакет ставится и отдаёт двоичный
        # Не «распаковать и позвать .mjs», а поставить обычным `npm install` и
        # позвать ту команду, которую получает человек. Разница принципиальная:
        # двоичный компилятор появляется только на установке (postinstall), и
        # распакованный тарбол его не содержит вовсе.
        run: |
          set -eu
          rm -rf /tmp/pustoy && mkdir -p /tmp/pustoy
          npm pack --pack-destination /tmp >/dev/null
          cd /tmp/pustoy
          echo '{"name":"proba","private":true}' > package.json
          npm install /tmp/digitable-lol-flang-*.tgz --no-audit --no-fund --foreground-scripts
          ./node_modules/.bin/flang --version
          # Версия ОТ ДВОИЧНОГО начинается словом «flang»; реализация на Node
          # печатает голый номер. По этой строке видно, кто ответил.
          ./node_modules/.bin/flang --version | grep -q '^flang '
          cp node_modules/@digitable-lol/flang/flang/stdlib/lists.flang .
          ./node_modules/.bin/flang check lists.flang
          ./node_modules/.bin/flang test lists.flang

      - name: Проверить, настроен ли секрет
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Имя выхода — латиницей, и это не вкусовщина. Выражения GitHub
        # разбирают идентификатор по [a-zA-Z_][a-zA-Z0-9_-]*, поэтому
        # `outputs.настроен` не проходит разбор файла, и workflow падает на
        # старте — без единого шага, за ноль секунд, на каждый push. Значения
        # внутри строк кириллице не мешают, а имена — мешают.
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN не задан — публикация пропущена. Заведите токен с правом публикации в scope @digitable-lol."
          else
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Опубликовать
        # inputs['dry-run'], а не inputs.dry-run: дефис в выражении читается
        # как вычитание, и `inputs.dry - run` тоже роняет разбор файла.
        if: steps.guard.outputs.configured == 'yes' && inputs['dry-run'] != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --access public обязателен: пакеты в scope по умолчанию приватные, и
        # без флага первая публикация упрётся в платный план.
        run: npm publish --access public --provenance

      - name: Показать, что было бы опубликовано
        if: inputs['dry-run'] == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --dry-run
