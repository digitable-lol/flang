# Публикация пакета @digitable/fts в npm.
#
# Запускается только на теге вида v0.4.0 — не на каждый push в main. Причина в
# необратимости: опубликованную версию нельзя переиздать под тем же номером, а
# снять её можно лишь в первые 72 часа и ценой репутации пакета. Тег — это
# явное решение человека «вот эту версию наружу», и оно должно приниматься
# отдельно от решения «влить ветку».
#
# Проверки идут ДО публикации и в полном объёме: npm test (ядро, инструменты и
# язык), сборка TypeScript и сверка версии в теге с версией в package.json.
# Расхождение тега и package.json — самая частая причина того, что в реестр
# уезжает не то, что ожидали, поэтому это отдельный шаг с внятным сообщением.
#
# Требуется секрет NPM_TOKEN — токен npm с правом публикации в scope
# @digitable. Без него шаг публикации не выполняется, а workflow сообщает об
# этом предупреждением, а не падает: отсутствие секрета на форке не должно
# выглядеть поломкой.
#
# Провенанс (--provenance) включён: npm свяжет опубликованную версию с этим
# workflow и коммитом, и любой сможет проверить, откуда взялся тарбол. Для
# этого нужны права id-token: write, они выданы ниже.

name: Публикация в npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Только проверить, не публикуя"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Установить зависимости
        run: npm ci

      - name: Проверить, что тег совпадает с версией пакета
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          # Имена переменных латиницей. В именах оболочка допускает только
          # [A-Za-z_][A-Za-z0-9_]*, поэтому «тег=…» она разбирает не как
          # присваивание, а как команду — и шаг падал с кодом 127 «command not
          # found», не назвав ни одной причины. Внутри значений и сообщений
          # кириллица по-прежнему уместна, в именах — нет.
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::тег $GITHUB_REF_NAME обещает версию $tag_version, а package.json говорит $package_version"
            exit 1
          fi
          echo "версия $package_version подтверждена тегом"

      - name: Собрать
        run: npm run build

      - name: Прогнать весь набор тестов
        # Ядро, инструменты и язык. prepublishOnly сделал бы то же самое, но
        # отдельным шагом видно, что именно упало, не разбирая вывод publish.
        run: npm test

      - name: Проверить состав пакета
        # Тесты и служебное в тарбол попадать не должны: однажды туда уже
        # уезжали 50 тестовых файлов. Проверка дешёвая, а находка дорогая.
        run: |
          set -eu
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [pkg] = require("/tmp/pack.json")
            const лишнее = pkg.files.map((f) => f.path).filter((p) => /(^|\/)test\/|\.test\.mjs$/.test(p))
            if (лишнее.length > 0) {
              console.error("в пакет попали тестовые файлы:\n  " + лишнее.slice(0, 10).join("\n  "))
              process.exit(1)
            }
            console.log(`файлов ${pkg.entryCount}, размер ${(pkg.size / 1024).toFixed(0)} КБ`)
          '

      - name: Проверить, что flang запускается из пакета
        # Пакет объявляет исполняемый файл flang; если он не находит свои
        # модули, потребитель узнает об этом первым. Дешевле узнать здесь.
        run: |
          set -eu
          # Каталог назначения создаём ДО упаковки: npm --pack-destination его
          # не заводит, и шаг падал с ENOENT на файле, который сам же собирался
          # положить. mkdir стоял строкой ниже — этого хватило, чтобы workflow
          # ни разу не дошёл до публикации.
          mkdir -p /tmp/pkg/распакованный
          npm pack --pack-destination /tmp/pkg >/dev/null
          tar -xzf /tmp/pkg/*.tgz -C /tmp/pkg/распакованный
          node /tmp/pkg/распакованный/package/flang/bin/flang.mjs check \
               /tmp/pkg/распакованный/package/flang/stdlib/lists.flang > /tmp/pkg/итог.json
          node -e '
            const итог = require("/tmp/pkg/итог.json")
            if (итог.valid !== true) { console.error("flang из пакета не работает"); process.exit(1) }
            console.log(`flang из пакета проверил модуль «${итог.module}»: ${итог.functions.length} функций`)
          '

      - name: Проверить, настроен ли секрет
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Имя выхода — латиницей, и это не вкусовщина. Выражения GitHub
        # разбирают идентификатор по [a-zA-Z_][a-zA-Z0-9_-]*, поэтому
        # `outputs.настроен` не проходит разбор файла, и workflow падает на
        # старте — без единого шага, за ноль секунд, на каждый push. Значения
        # внутри строк кириллице не мешают, а имена — мешают.
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN не задан — публикация пропущена. Заведите токен с правом публикации в scope @digitable."
          else
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Опубликовать
        # inputs['dry-run'], а не inputs.dry-run: дефис в выражении читается
        # как вычитание, и `inputs.dry - run` тоже роняет разбор файла.
        if: steps.guard.outputs.configured == 'yes' && inputs['dry-run'] != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --access public обязателен: пакеты в scope по умолчанию приватные, и
        # без флага первая публикация упрётся в платный план.
        run: npm publish --access public --provenance

      - name: Показать, что было бы опубликовано
        if: inputs['dry-run'] == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --dry-run
