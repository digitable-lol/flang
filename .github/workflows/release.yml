# Выпуск версии: релизный архив C на GitHub.
#
# Запускается только на теге вида v0.8.0 — не на каждый push в main. Причина в
# необратимости: тег — это явное решение человека «вот эту версию наружу», и
# оно должно приниматься отдельно от решения «влить ветку».
#
# ── ЧТО ЭТОТ ФАЙЛ ПЕРЕСТАЛ ДЕЛАТЬ 3 СЕНТЯБРЯ 2026 ───────────────────────────
#
# Он назывался `publish-npm.yml` и делал две работы сразу: собирал релизный
# архив И публиковал пакет в npm. Владелец решил npm убрать; половина про
# публикацию удалена целиком, половина про архив осталась здесь. Поимённо
# удалены шаги: «Установить зависимости» (`npm ci`), «Проверить состав пакета»
# (`npm pack --dry-run`), «Проверить, что пакет ставится и отдаёт двоичный»
# (`npm install` тарбола), «Проверить, настроен ли секрет» (`NPM_TOKEN`),
# «Опубликовать» (`npm publish --access public --provenance`) и «Показать, что
# было бы опубликовано» (`npm publish --dry-run`). Вместе с ними ушло право
# `id-token: write` — оно было нужно только провенансу npm.
#
# СЕКРЕТ `NPM_TOKEN` В ХРАНИЛИЩЕ GITHUB ЭТИМ НЕ ТРОНУТ. Его читал единственный
# шаг «Проверить, настроен ли секрет», и шага больше нет: задан токен или нет,
# ни одна работа этого дерева его теперь не спрашивает. Убирать сам секрет —
# решение владельца, не этой правки.
#
# ЧТО ПРИ ЭТОМ ПОТЕРЯНО, названо прямо: установка под Windows. `bin` в npm
# обязан быть файлом, который запустит `node`, — ради этого и жили обёртки
# `packaging/flang-launch.mjs` и `flang/bin/flang-lsp.mjs`. Формула Homebrew
# Windows не ставит, а релизный архив ниже — исходники C99 под `make`. Разбор:
# задача 8649 (закрыта).
#
# ── ЧТО БЫЛО СЛОМАНО ЗДЕСЬ, И ЧИНИТСЯ ЭТОЙ ЖЕ ПРАВКОЙ ──────────────────────
#
# Шаг «Build release archive» зовёт `bootstrap/flang`, а собирать его в этом
# файле было НЕКОМУ: `bootstrap/flang` — продукт сборки и в дереве не лежит
# (`.gitignore`), `npm ci` клал двоичный в `dvoichnyy/`, а не в `bootstrap/`.
# То есть выпуск падал на первом же собственном шаге. Теперь семя собирается
# явным шагом до архива.
#
# ── ПОЧЕМУ ПОРЯДОК ИМЕННО ТАКОЙ ────────────────────────────────────────────
#
# Собрали семя → собрали архив → сверили его хеш с формулой Homebrew →
# приложили к релизу → прогнали набор. Сверка хеша стоит ДО выкладки: разойдись
# он с формулой, `brew install` встал бы на скачивании у всех и сразу, и узнать
# об этом надо здесь, а не по жалобам.
#
# ── ВЫПУСК НЕ ОПИРАЕТСЯ НА КЕШ ПРИГОВОРОВ ──────────────────────────────────
#
# `AGENTS.md`, раздел «Кеш приговоров: где живёт и чему он НЕ основание», несёт
# правило, которое отменять нельзя: «Кешу верят для СКОРОСТИ. Для ИСТИНЫ — про-
# веряльщику. Выпуск не имеет права опираться на кеш: перед меткой всё пересчи-
# тывается начисто, без `FLANG_PROOF_CACHE`.» Принуждает его составное
# действие `.github/actions/release-without-cache`, и шаг стоит ПЕРВЫМ после
# выкладки. Сторож зовётся с `mode: release`, а не решает по среде: этот файл
# НИЧЕМ, кроме выпуска, не бывает.

name: Release

on:
  push:
    tags: ["v*"]
  # Ручной запуск — сам себе проба: шаг выкладки идёт только на теге, поэтому
  # с ветки прогон соберёт архив и сверит его хеш, ничего никуда не выложив.
  # Отдельный ключ `dry-run` был нужен публикации в npm и ушёл вместе с ней.
  workflow_dispatch:

permissions:
  # contents: write — не расширение полномочий ради удобства, а то, без чего
  # порядок шагов остаётся кругом: релиз и вложение к нему создаются этим же
  # прогоном. Прежде стояло `read`, и приложить архив было нечем.
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # The C archive name goes to the jobs below: they build the prebuilt
    # tarballs from that very archive, so a prebuilt build and a source build
    # (brew, asdf) compile the same C99.
    outputs:
      archive: ${{ steps.archive.outputs.arhiv }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Вся история и все теги: журнал изменений печатается из них
          # (scripts/site/build-changelog.fscript, команда `changelog:build`), и сверка сверяет
          # записанный файл с историей. В клоне из одной ревизии эта сверка сравнивает пустоту с
          # пустотой и молчит.
          fetch-depth: 0
          # `fetch-depth: 0` тянет всю историю КОММИТОВ, но не гарантирует сами
          # ТЕГИ — по умолчанию `actions/checkout` их не забирает, даже с
          # глубиной 0. Без этого шаг ниже, зовущий
          # `git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME"`,
          # находит тег как пустоту, и `gh release create` тихо подставляет
          # вместо заголовка метки первую строку коммита, на который она
          # указывает. Так вышел релиз v0.7.3 на main (найдено и починено
          # там же 3 сентября 2026) — перенесено сюда той же правкой.
          fetch-tags: true
          # Кран Homebrew — сабмодуль packaging/homebrew-tap: шаг «Кран не
          # отстал от дерева» читает его формулу. Без развёрнутого сабмодуля
          # читать нечего, а «нечего читать» здесь — красное, не зелёное.
          submodules: true
      - name: Check verdict cache
        uses: ./.github/actions/release-without-cache
        with:
          mode: release

      # Node остаётся ради набора проверок (`bootstrap/flang run-script tests` — это
      # `node --test`). `cache: npm` снят вместе с `package-lock.json`: без
      # замка этот ключ падает с «unable to cache dependencies», а `registry-url`
      # был нужен только публикации.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # Семя собирается ЗДЕСЬ, до всего остального: им печатается архив.
      - name: Build bootstrap
        run: make -C bootstrap -j"$(nproc)"

      - name: Check binary version
        # ЗАЧЕМ ОТДЕЛЬНО ОТ «version:check» (install-path.yml:138). Тот сторож
        # (scripts/guards/version-guard.fscript) читает ИСХОДНИК —
        # flang/src/emit/c/flang_repl.c. А выпуск собирается из СЕМЕНИ (шаг
        # выше, make -C bootstrap), и между перепечатками эти два файла
        # расходятся ЗАКОННО. Значит зелёный «version:check» ничего не
        # обещает про то, как назовёт себя отгружаемый двоичный.
        #
        # Что это не выдумка, видно числом на 5 сентября 2026 (задача 9111):
        #   источник (dev)  0.7.10      сторож версии: код 0, «совпадают»
        #   семя     (dev)  0.7.0       двоичный из него: «flang 0.7.0»
        # Выпуск с dev в тот день отгрузил бы двоичный, зовущий себя 0.7.0,
        # под меткой v0.7.11 — и ни один шаг этого не заметил бы.
        #
        # ЗДЕСЬ СМОТРИТСЯ АРТЕФАКТ, А НЕ ФАЙЛ: спрашиваем у только что
        # собранного двоичного, как он себя зовёт. Это ровно тот вопрос, на
        # который дважды отвечал не сторож, а человек живым прогоном
        # `--version` (задачи 9959 и 9983).
        #
        # Шаг идёт БЕЗ `if:` — на ручном прогоне с ветки он сам себе проба, как
        # и весь этот файл по замыслу шапки.
        #
        # Три места CI уже зовут `--version` (binary.yml:252,
        # build-macos.yml:139, install-path.yml:198) и все три ВЫБРАСЫВАЮТ
        # ответ: команда идёт как дым, «не упало — и ладно». Здесь ответ
        # читается.
        run: |
          set -eu
          package_version="$(bootstrap/flang io scripts/flangrc.fscript -- version | sed -n 's/^{"plan":"Settings","result":"\([^"\\]*\).*/\1/p')"
          if [ -z "$package_version" ]; then
            echo "::error::версию не вычитать из .flangrc — ключа «version» нет или scripts/flangrc.fscript не ответил; разносит его bootstrap/flang run-script version из scripts/release/emit-package.flang"
            exit 1
          fi
          # `head -1` — не украшение. С 8 сентября 2026 оболочка печатает ВТОРУЮ
          # строку: отпечаток своей сборки (задача 5498). Первая строка вида
          # «flang <версия>» закреплена и не менялась, а этот шаг читал весь
          # вывод целиком — и покраснел на выпуске 0.7.15 словами «ответил
          # «flang 0.7.15\nоболочка fd002c5a: …», а ждали одной строкой». Шаг
          # сам предсказал это в своём же сообщении ниже: «Поправить надо ЭТОТ
          # шаг: вид ответа изменился, двоичный ни при чём».
          otvet="$(./bootstrap/flang --version | head -1)"
          # Вид ответа закреплён: «flang <версия>» одной строкой. Разойдись вид —
          # виноват не двоичный, а ЭТОТ шаг, и сказать об этом надо отдельно:
          # иначе он покраснеет с чужой причиной, и чинить пойдут исправное.
          # Приставку мало снять — надо ещё убедиться, что снятое ПОХОЖЕ на
          # версию. Первая редакция этого шага брала всё после «flang », и
          # ответ «flang version 0.7.10» проезжал как версия «version 0.7.10»:
          # шаг краснел, но причину называл чужую — «двоичный зовёт себя не
          # так», — и чинить пошли бы исправное. Поймано собственной пробой.
          binary_version=""
          case "$otvet" in
            "flang "*) binary_version="${otvet#flang }" ;;
          esac
          case "$binary_version" in
            "" | *" "* | *"	"* ) binary_version="" ;;
            [0-9]*) : ;;
            *) binary_version="" ;;
          esac
          if [ -z "$binary_version" ]; then
            echo "::error::«flang --version» ответил «${otvet}», а ждали «flang <версия>» одной строкой"
            echo "::error::Поправить надо ЭТОТ шаг: вид ответа изменился, двоичный ни при чём."
            exit 1
          fi
          if [ "$binary_version" != "$package_version" ]; then
            echo "::error::собранный двоичный зовёт себя «${binary_version}», а .flangrc объявляет «${package_version}»"
            echo "::error::Выпуск собирается из СЕМЕНИ (bootstrap/), и версию в нём поднимает ПЕРЕПЕЧАТКА,"
            echo "::error::а не правка flang/src/emit/c/flang_repl.c — её видит только «version:check»."
            echo "::error::Так вышли 9959 («двоичный называл себя версией на два релиза позади») и 9983."
            exit 1
          fi
          echo "двоичный и .flangrc сошлись: $binary_version"

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        # Имена переменных латиницей. В именах оболочка допускает только
        # [A-Za-z_][A-Za-z0-9_]*, поэтому «тег=…» она разбирает не как
        # присваивание, а как команду — и шаг падал с кодом 127 «command not
        # found», не назвав ни одной причины.
        #
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(bootstrap/flang io scripts/flangrc.fscript -- version | sed -n 's/^{"plan":"Settings","result":"\([^"\\]*\).*/\1/p')"
          if [ -z "$package_version" ]; then
            echo "::error::версию не вычитать из .flangrc — ключа «version» нет или scripts/flangrc.fscript не ответил; разносит его bootstrap/flang run-script version из scripts/release/emit-package.flang"
            exit 1
          fi
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::тег $GITHUB_REF_NAME обещает версию $tag_version, а .flangrc говорит $package_version"
            exit 1
          fi
          echo "версия $package_version подтверждена тегом"

      # ТЕЛО РЕЛИЗА БЕРЁТСЯ ИЗ ЗАМЕТОК, А НЕ ПИШЕТСЯ РУКОЙ В ЭТОМ ФАЙЛЕ.
      #
      # До 8 сентября 2026 шаг «Upload release archive» звал `gh release
      # create` с `--title "$GITHUB_REF_NAME"` и одной вшитой строкой в
      # `--notes`. Что из этого выходило, видно числом: у релизов v0.7.10 и
      # v0.7.14 — тех двух, что создал сам работник, — тело 168 знаков, одно и
      # то же на обоих, и имя «v0.7.14» вместо «flang 0.7.14». За v0.7.14 стоят
      # 45 коммитов, и из тела не понять ни одного. Остальные релизы содержательны
      # потому, что их писал человек РУКАМИ ПОСЛЕ выпуска, — то есть держалось
      # это на памяти, а не на дереве.
      #
      # Заметка о выпуске в дереве уже есть и уже сверяется: из
      # `docs/release-notes.json` печатается страница «Выпуски», и
      # `scripts/site/releases-page-verify.fscript` краснеет на теге без заметки.
      # Здесь тот же файл становится телом релиза — обеими половинами, русской
      # и английской, — чтобы опубликованное и страница сайта не могли
      # разойтись: у них один источник.
      #
      # ЭТО ЖЕ И СТОРОЖ. Плана два исхода: заметка есть — тело и имя лежат в
      # `output/`; заметки нет — план отвечает `FLANG_VYPUSK_NET_ZAMETKI` и
      # кодом 1, и выпуск останавливается ЗДЕСЬ, до сборки архива и до выкладки.
      # Версию план берёт из `.flangrc` (ключ «version»), а шаг выше уже доказал,
      # что она совпадает с тегом.
      #
      # ШАГ ИДЁТ БЕЗ `if:` — на ручном прогоне с ветки он сам себе проба, как и
      # весь этот файл по замыслу шапки: тело собирается и на сухом прогоне,
      # только применять его там некуда.
      #
      # `--max-steps 80000000` — не запас на глаз, а то же число, что стоит у
      # печати страницы выпусков (`.flangrc`, «releases:page»): у `flang
      # io` умолчание предела 10 000 000 шагов, и разбор `docs/release-notes.json`
      # в него не влезает.
      - name: Build release body
        run: |
          set -eu
          mkdir -p output
          LC_ALL=C.UTF-8 bootstrap/flang io scripts/site/release-body.fscript --на-веру --max-steps 80000000
          echo "имя релиза: $(cat output/release-title.txt)"
          echo "знаков в теле: $(wc -c < output/release-body.md)"

      # ПОКАЗАНО ПРОГОНОМ, ЧТО СТОРОЖ ВЫШЕ УМЕЕТ КРАСНЕТЬ.
      #
      # Сторож, у которого не показано, что он краснеет, — это сторож, которому
      # верят зря: ровно этот род долга считает `scripts/guards/guards-without-forgery-probe.fscript`.
      # Проба подставляет версию, заметки о которой в json заведомо нет, и
      # требует от плана ОТКАЗА. Прошёл план — красный здесь, а не молчание.
      #
      # `.flangrc` возвращается на место в ОБОИХ исходах, и возврат
      # проверяется `git diff --exit-code`: проба, оставившая дерево правленым,
      # испортила бы все шаги ниже, и знать об этом надо здесь. «Подлог не
      # собрался» ловится отдельно: строка ключа «version» обязана измениться,
      # иначе шаг покраснел бы с чужой причиной.
      - name: Probe release body
        run: |
          set -eu
          podlog=.flangrc
          cp "$podlog" "$podlog.do"
          sed -i 's/^version[[:space:]]*=.*/version = 0.0.0/' "$podlog"
          if cmp -s "$podlog.do" "$podlog"; then
            rm -f "$podlog.do"; git checkout -- "$podlog"
            echo "::error::ПОДЛОГ НЕ СОБРАЛСЯ: ключа version в $podlog уже нет — поправить подлог, сторож ни при чём"
            exit 1
          fi
          rm -f "$podlog.do"
          if LC_ALL=C.UTF-8 bootstrap/flang io scripts/site/release-body.fscript --на-веру --max-steps 80000000 >/dev/null 2>&1; then
            git checkout -- "$podlog"
            echo "::error::проба не сработала: тело собралось для версии 0.0.0, о которой заметки нет."
            echo "::error::Значит шаг «Build release body» пропустит выпуск без заметки — сторожа нет."
            exit 1
          fi
          git checkout -- "$podlog"
          git diff --exit-code -- "$podlog"
          echo "проба сработала: на версии без заметки план отвечает отказом, .flangrc возвращён"

      # Тело шага переехало в составное действие целиком, вместе с доводами:
      # скрипт не только печатает компилятор в C99, но и СОБИРАЕТ напечатанное
      # без Node в PATH; список файлов берётся вычитанием, а не перечислением;
      # ключи tar стоят ради повторимости хеша. Переехало оно потому, что жило
      # ЗДЕСЬ и в КОПИИ (`install-path.yml`, работа `brew`), копия разошлась с
      # подлинником молча, и работа `brew` была красна с 0.7.9. Путь архива
      # действие кладёт в `$ARHIV` — им пользуются три шага ниже.
      - name: Build release archive
        id: archive
        uses: ./.github/actions/release-archive

      # Handed to the prebuilt jobs at once, before the checks below: on a
      # manual run between releases the formula hash check is red by design
      # (the header of this file), and the prebuilt builds are still wanted.
      - name: Keep release archive for prebuilt builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c-archive
          path: ${{ steps.archive.outputs.arhiv }}
          if-no-files-found: error
          retention-days: 7

      # ЧТО В АРХИВЕ ЛЕЖИТ, ПРОВЕРЯЕТСЯ ЗДЕСЬ, А НЕ У ПОСТАВИВШЕГО.
      #
      # Список файлов выше берётся ВЫЧИТАНИЕМ (`ls | grep -Ev`), и это верно: он
      # не отстаёт при переименовании. Но у вычитания есть обратная сторона —
      # оно молча пропускает и ПРОПАЖУ. Перестань `scripts/release/release-in-c.fscript`
      # класть каталог `runtime`, и архив уедет без рантаймов, хеш сойдётся,
      # формула поставится, а `flang emit --target js` откажет у каждого
      # поставившего. Ровно это и была задача 7261, найденная владельцем живьём
      # 5 сентября 2026, — тогда в тираж ехала одна цель из девяти.
      #
      # Цели спрашиваются у двоичного, а не выписываются здесь: он называет их
      # сам (`EMIT_TARGETS_WORDS` в flang_repl.c). Отбор по ASCII — чтобы не
      # зависеть от локали работника.
      - name: Check archive runtimes
        run: |
          set -eu
          celi="$(bootstrap/flang --help | grep -- '--target' | tr ' ' '\n' | grep '|' | tr '|' ' ')"
          n_celey="$(printf '%s\n' $celi | grep -c .)"
          if [ "$n_celey" -lt 9 ]; then
            echo "::error::flang --help назвал целей печати: $n_celey, а их девять — справка разошлась с проверкой"
            exit 1
          fi
          sostav="$(tar -tzf "$ARHIV")"
          beda=0
          for cel in $celi; do
            if printf '%s\n' "$sostav" | grep -q "^runtime/$cel/[^/]"; then
              echo "  везём  runtime/$cel"
            else
              echo "::error::в архиве нет runtime/$cel — цель $cel не заработает ни у одного поставившего (задача 7261)"
              beda=$((beda + 1))
            fi
          done
          # Файлов рантайма 32 на девять целей; число сторожит scripts/release/release-in-c.fscript
          # своим примером, здесь же проверяется, что они доехали до архива.
          fajlov="$(printf '%s\n' "$sostav" | grep -c '^runtime/[^/]*/[^/]' || true)"
          echo "файлов рантайма в архиве: $fajlov"
          if [ "$fajlov" -lt 32 ]; then
            echo "::error::файлов рантайма в архиве $fajlov, а дерево несёт 32 — часть целей уедет неполной"
            beda=$((beda + 1))
          fi
          [ "$beda" -eq 0 ] || exit 1

      - name: Check archive hash
        # Формула несёт sha256 архива, и brew сверяет его сам: разойдись он —
        # `brew install` встанет на скачивании, у ВСЕХ и сразу. Проверять это
        # надо здесь, до того как архив уедет в релиз, а не по жалобам.
        run: |
          set -eu
          sobran="$(sha256sum "$ARHIV" | cut -d' ' -f1)"
          v_formule="$(sed -n 's/^ *sha256 "\([0-9a-f]\{64\}\)".*/\1/p' packaging/homebrew/flang.rb)"
          if [ "$sobran" != "$v_formule" ]; then
            echo "::error::архив собрался с sha256 $sobran, а packaging/homebrew/flang.rb ждёт $v_formule."
            echo "::error::Хеш описывает ДЕРЕВО, а не номер версии, и пересчитывается при каждом выпуске."
            echo "::error::Впишите в формулу: sha256 \"$sobran\" — и повторите тег."
            exit 1
          fi
          echo "хеш архива совпал с формулой: $sobran"

      - name: Check Homebrew tap
        # С 0.7.29 `brew install digitable-lol/tap/flang-package` (и прежнее имя
        # `digitable-lol/tap/flang` — ссылкой Aliases/flang) ставит ГОТОВУЮ сборку:
        # Formula/flang-package.rb крана, а не формулу архива C из дерева. Её
        # sha256 — от сборок ЭТОГО прогона (работа packages, артефакт
        # package-manifests), поэтому до выкладки совпасть с ним кран не может.
        # Здесь сверяется устройство крана: формула пакета есть, ссылка Aliases/flang
        # ведёт на неё, старой Formula/flang.rb нет. Отставшая версия — пометка
        # с лечением, а не красное: кран поднимают после выкладки, и это же сверяет
        # «homebrew-formula:check» в дереве.
        run: |
          set -eu
          kran=packaging/homebrew-tap/Formula/flang-package.rb
          if [ ! -f "$kran" ]; then
            echo "::error::$kran нет — сабмодуль крана не развёрнут (checkout с submodules: true?) или кран не переведён на flang-package"
            exit 1
          fi
          if [ "$(readlink packaging/homebrew-tap/Aliases/flang 2>/dev/null)" != "../Formula/flang-package.rb" ]; then
            echo "::error::Aliases/flang крана не ведёт на ../Formula/flang-package.rb — brew install digitable-lol/tap/flang сломается"
            exit 1
          fi
          if [ -e packaging/homebrew-tap/Formula/flang.rb ]; then
            echo "::error::в кране осталась Formula/flang.rb — она заслоняет ссылку Aliases/flang"
            exit 1
          fi
          v_derevo="$(sed -n 's/^  version "\([^"]*\)".*/\1/p' packaging/homebrew/flang.rb)"
          v_kran="$(sed -n 's/^  version "\([^"]*\)".*/\1/p' "$kran")"
          if [ "$v_derevo" != "$v_kran" ]; then
            echo "::notice::кран на ${v_kran}, дерево на ${v_derevo}: после выкладки положите flang-package.rb из артефакта package-manifests в Formula/flang-package.rb крана, push, git add packaging/homebrew-tap"
          fi
          echo "кран устроен как надо: $(git -C packaging/homebrew-tap rev-parse --short HEAD)"

      - name: Check asdf plugin
        # `asdf plugin add flang` клонирует digitable-lol/asdf-flang — сабмодуль
        # packaging/asdf-plugin, — а не packaging/asdf. Копия отставала молча:
        # опубликованный bin/install искал flang_cli, когда сборка уже клала
        # flang, и `asdf install` падал последним шагом. Здесь четыре файла
        # плагина сверяются с деревом побайтово ДО выкладки, три скрипта — на
        # бит исполнимости. Расхождение — красное; неразвёрнутый сабмодуль —
        # тоже. Ту же сверку без сети держит «asdf-plugin:check»
        # (scripts/guards/asdf-plugin-guard.fscript).
        run: |
          set -eu
          plagin=packaging/asdf-plugin
          if [ ! -f "$plagin/README.md" ]; then
            echo "::error::$plagin/README.md нет — сабмодуль плагина asdf не развёрнут (checkout с submodules: true?)"
            exit 1
          fi
          beda=0
          for f in README.md bin/download bin/install bin/list-all; do
            if ! cmp -s "packaging/asdf/$f" "$plagin/$f"; then
              echo "::error::$f: в плагине не тот же файл, что в packaging/asdf — плагин отстал, «asdf plugin add flang» привезёт не то"
              beda=$((beda + 1))
            fi
          done
          for f in bin/download bin/install bin/list-all; do
            if [ ! -x "$plagin/$f" ]; then
              echo "::error::$f: в плагине снят бит исполнимости — asdf этот скрипт не запустит"
              beda=$((beda + 1))
            fi
          done
          if [ "$beda" -ne 0 ]; then
            echo "::error::Лечится: cp -R packaging/asdf/. $plagin/; коммит и push в asdf-flang; git add $plagin; повторить тег."
            exit 1
          fi
          echo "плагин asdf совпал с деревом по четырём файлам: $(git -C "$plagin" rev-parse --short HEAD)"

      - name: Upload release archive
        # `gh release create` на уже существующем релизе отвечает ошибкой —
        # поэтому сначала спрашиваем.
        #
        # ИМЯ И ТЕЛО БЕРУТСЯ ИЗ ФАЙЛОВ, собранных шагом «Тело релиза собрано из
        # заметок» выше. Прежде здесь стояли `--title "$GITHUB_REF_NAME"` и одна
        # вшитая строка `--notes` — довод и числа записаны у того шага.
        #
        # УЖЕ СОЗДАННЫЙ РЕЛИЗ НЕ ПЕРЕПИСЫВАЕТСЯ, и это решение, а не забывчивость:
        # человек правит тело руками после выпуска (так появились содержательные
        # тела у 0.7.12 и 0.7.13), и `gh release edit` затёр бы его правку
        # печатью из дерева. Тело из заметок — это то, с чего релиз НАЧИНАЕТСЯ.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$(cat output/release-title.txt)" \
              --notes-file output/release-body.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$ARHIV" --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'

      - name: Run all checks
        # Был `npm test` — это ровно `bootstrap/flang run-script tests`, то есть
        # `node --test flang/test/*.test.mjs`. npm не делал здесь ничего, кроме
        # подстановки строки из `package.json`.
        run: bootstrap/flang run-script tests

  # ── PREBUILT BUILDS ───────────────────────────────────────────────────────
  #
  # Four tarballs flang-package-<version>-<os>-<arch>.tar.gz, each built on its
  # own runner from the C archive of the job above and run there before it is
  # kept. The package is named flang-package because `flang` is taken by LLVM
  # Flang in homebrew/core and in the AUR; the command stays `flang`.
  #
  # Linux: Alpine (musl) in a container, linked statically, so one binary runs
  # on any distribution of that CPU. It is then run on the Ubuntu host,
  # outside the container: a binary that needed the container's libc would
  # fail right there. macOS: the flags of the Homebrew formula on the native
  # runner; macos-15-intel stands for x86_64 because macos-13 was retired on
  # 4 December 2025 (ADR-0067, section 1.5).
  #
  # A manual run builds and checks everything and publishes nothing: the
  # upload step below runs only on a tag.
  prebuilt:
    name: prebuilt (${{ matrix.os }}-${{ matrix.arch }})
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.archive != '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-24.04 }
          - { os: linux, arch: aarch64, runner: ubuntu-24.04-arm }
          - { os: macos, arch: arm64, runner: macos-14 }
          - { os: macos, arch: x86_64, runner: macos-15-intel }
    env:
      ARCHIVE: ${{ needs.release.outputs.archive }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: c-archive
          path: input

      - name: Build tarball (Linux, static, musl)
        if: matrix.os == 'linux'
        run: |
          set -eu
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c \
            "apk add --no-cache build-base tar >/dev/null && sh packaging/prebuilt/build-tarball.sh input/$(basename "$ARCHIVE") linux ${{ matrix.arch }} output/prebuilt"
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Build tarball (macOS)
        if: matrix.os == 'macos'
        run: sh packaging/prebuilt/build-tarball.sh "input/$(basename "$ARCHIVE")" macos ${{ matrix.arch }} output/prebuilt

      - name: Run prebuilt flang
        run: |
          set -eu
          version="$(basename "$ARCHIVE")"; version="${version#flang-}"; version="${version%-c.tar.gz}"
          tarball="output/prebuilt/flang-package-$version-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          ls -l "$tarball"
          mkdir -p probe
          tar -xzf "$tarball" -C probe
          dir="probe/flang-package-$version-${{ matrix.os }}-${{ matrix.arch }}"
          file "$dir/bin/flang"
          if [ "${{ matrix.os }}" = linux ]; then
            if ! file "$dir/bin/flang" | grep -q 'statically linked'; then
              echo "::error::the Linux binary is not static; it would depend on the libc of the machine"
              exit 1
            fi
          else
            otool -L "$dir/bin/flang"
          fi
          "$dir/bin/flang" --version
          sh packaging/prebuilt/smoke.sh "$dir" "$version"

      # The hash is taken here, on the runner that built and ran the tarball;
      # the packages job checks every tarball against it before SHA256SUMS.
      - name: Hash the tarball on its runner
        run: |
          set -eu
          cd output/prebuilt
          for f in flang-package-*.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; cat "$f.sha256"; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prebuilt-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            output/prebuilt/*.tar.gz
            output/prebuilt/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # deb and rpm from the two Linux tarballs, one SHA256SUMS for every asset of
  # the release (the C archive included), the Homebrew formula and the AUR
  # PKGBUILD filled with those checksums. The manifests are kept as a workflow
  # artifact: they go into digitable-lol/homebrew-tap and the AUR by hand.
  packages:
    name: packages
    needs: [release, prebuilt]
    if: ${{ !cancelled() && needs.prebuilt.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      ARCHIVE: ${{ needs.release.outputs.archive }}
      NFPM_VERSION: "2.47.0"
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true

      # Each tarball must be the bytes its runner hashed. The probe after it
      # flips one byte of a copy and requires the same check to fail: a check
      # that passes a forged file is not a check.
      - name: Check prebuilt checksums
        run: |
          set -eu
          cd assets
          ls flang-package-*.tar.gz.sha256 >/dev/null
          for f in flang-package-*.tar.gz.sha256; do sha256sum -c "$f"; done
          forged="$RUNNER_TEMP/forged"
          mkdir -p "$forged"
          one="$(ls flang-package-*.tar.gz | head -1)"
          cp "$one" "$one.sha256" "$forged/"
          printf 'x' | dd of="$forged/$one" bs=1 seek=1000 conv=notrunc status=none
          if (cd "$forged" && sha256sum -c "$one.sha256" >/dev/null 2>&1); then
            echo "::error::a tarball with one changed byte passed the checksum check"
            exit 1
          fi
          echo "forgery probe: a changed byte in $one is caught"
          rm -f flang-package-*.tar.gz.sha256

      - name: Install nfpm
        run: |
          set -eu
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nfpm"
          tar -xzf nfpm.tar.gz -C "$RUNNER_TEMP/nfpm" nfpm
          rm nfpm.tar.gz
          "$RUNNER_TEMP/nfpm/nfpm" --version | grep -i '^GitVersion'

      - name: Build deb and rpm
        run: |
          set -eu
          version="$(basename "$ARCHIVE")"; version="${version#flang-}"; version="${version%-c.tar.gz}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          for pair in x86_64:amd64 aarch64:arm64; do
            arch="${pair%%:*}"; goarch="${pair##*:}"
            work="$RUNNER_TEMP/pkg-$arch"
            mkdir -p "$work"
            tar -xzf "assets/flang-package-$version-linux-$arch.tar.gz" -C "$work"
            for packager in deb rpm; do
              (cd "$work/flang-package-$version-linux-$arch" && \
                PKG_VERSION="$version" PKG_ARCH="$goarch" "$RUNNER_TEMP/nfpm/nfpm" package \
                  --config "$GITHUB_WORKSPACE/packaging/nfpm.yaml" --packager "$packager" --target "$GITHUB_WORKSPACE/assets/")
            done
          done
          ls -l assets

      - name: Install the deb and run flang
        run: |
          set -eu
          sudo dpkg -i "assets/flang-package_${VERSION}_amd64.deb"
          dpkg -L flang-package | grep -c . 
          /usr/bin/flang --version
          sh packaging/prebuilt/smoke.sh /usr "$VERSION"

      - name: Write SHA256SUMS
        run: |
          set -eu
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Fill package manifests
        run: sh packaging/prebuilt/manifests.sh "$VERSION" assets/SHA256SUMS manifests

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-manifests
          path: manifests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # Only on a tag, and only when the release job went through: that job
      # created the release and uploaded the C archive itself, so it is not
      # uploaded twice here.
      - name: Upload prebuilt builds
        if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd assets
          gh release upload "$GITHUB_REF_NAME" flang-package* SHA256SUMS --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'

  # Every channel installed from the assets of this run, then compared by the
  # parity instrument (packaging/install-parity.flang, `install-parity:check`):
  # 63 calls, the first install is the reference, every other one must
  # answer each call with the same code, stdout and stderr. A different
  # `--version` is named apart as "not the same binary".
  #   Linux: tarball, install.sh, deb (dpkg), rpm (unpacked by rpm2cpio),
  #          asdf (prebuilt).
  #   macOS: tarball, install.sh, brew (the filled formula in a local tap,
  #          plus `brew test` and the old name `flang` through Aliases/flang),
  #          asdf (prebuilt), asdf (ASDF_FLANG_FROM_SOURCE=1, the C archive).
  # The instrument itself runs on the prebuilt binary: no seed build needed.
  install-parity:
    name: install-parity (${{ matrix.os }})
    needs: packages
    if: ${{ !cancelled() && needs.packages.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-24.04 }
          - { os: macos, arch: arm64, runner: macos-14 }
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: assets

      - name: Install every channel
        run: |
          set -eu
          assets="$PWD/assets"
          version="$(sed -n 's/.*flang-package-\(.*\)-${{ matrix.os }}-${{ matrix.arch }}\.tar\.gz$/\1/p' assets/SHA256SUMS)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          root="$RUNNER_TEMP/installs"
          mkdir -p "$root/tarball" "$root/work"
          tar -xzf "assets/flang-package-$version-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C "$root/tarball"
          tarball="$root/tarball/flang-package-$version-${{ matrix.os }}-${{ matrix.arch }}/bin/flang"
          FLANG_VERSION="$version" FLANG_DOWNLOAD_URL="file://$assets" PREFIX="$root/install-sh" sh install.sh
          ASDF_INSTALL_VERSION="$version" ASDF_DOWNLOAD_PATH="$root/asdf-dl" ASDF_FLANG_RELEASE_URL="file://$assets" \
            bash packaging/asdf/bin/download
          ASDF_INSTALL_TYPE=version ASDF_INSTALL_VERSION="$version" ASDF_INSTALL_PATH="$root/asdf" \
            ASDF_DOWNLOAD_PATH="$root/asdf-dl" bash packaging/asdf/bin/install
          {
            echo "$PWD"
            echo "$root/work"
            printf 'tarball\t%s\n' "$tarball"
            printf 'install-sh\t%s\n' "$root/install-sh/bin/flang"
            printf 'asdf\t%s\n' "$root/asdf/bin/flang"
          } > packaging/install-parity.txt
          if [ "${{ matrix.os }}" = linux ]; then
            sudo dpkg -i "assets/flang-package_${version}_amd64.deb"
            mkdir -p "$root/rpm"
            (cd "$root/rpm" && rpm2cpio "$assets/flang-package-${version}-1.x86_64.rpm" | cpio -idm --quiet --no-absolute-filenames)
            printf 'deb\t%s\n' /usr/bin/flang >> packaging/install-parity.txt
            printf 'rpm\t%s\n' "$root/rpm/usr/bin/flang" >> packaging/install-parity.txt
          else
            sh packaging/prebuilt/manifests.sh "$version" assets/SHA256SUMS "$root/formula" "file://$assets"
            brew tap-new --no-git local/flangtest
            tap="$(brew --repository)/Library/Taps/local/homebrew-flangtest"
            cp "$root/formula/flang-package.rb" "$tap/Formula/"
            mkdir -p "$tap/Aliases"
            ln -s ../Formula/flang-package.rb "$tap/Aliases/flang"
            brew install local/flangtest/flang-package
            brew test local/flangtest/flang-package
            brew info local/flangtest/flang > "$root/brew-info.txt"
            head -1 "$root/brew-info.txt"
            ASDF_INSTALL_VERSION="$version" ASDF_DOWNLOAD_PATH="$root/asdf-src-dl" ASDF_FLANG_RELEASE_URL="file://$assets" \
              ASDF_FLANG_FROM_SOURCE=1 bash packaging/asdf/bin/download
            ASDF_INSTALL_TYPE=version ASDF_INSTALL_VERSION="$version" ASDF_INSTALL_PATH="$root/asdf-src" \
              ASDF_DOWNLOAD_PATH="$root/asdf-src-dl" ASDF_CONCURRENCY=3 bash packaging/asdf/bin/install
            # The Cellar path, not the bin/ symlink: flang names paths next to its
            # own real location in its answers, and the instrument replaces
            # the directory it was given.
            printf 'brew\t%s\n' "$(brew --cellar)/flang-package/$version/bin/flang" >> packaging/install-parity.txt
            printf 'asdf-source\t%s\n' "$root/asdf-src/bin/flang" >> packaging/install-parity.txt
          fi
          cat packaging/install-parity.txt
          echo "FLANG=$tarball" >> "$GITHUB_ENV"

      - name: Compare the installs
        run: |
          set -eu
          # bootstrap/flang is not in the checkout (it is a build product); the
          # prebuilt binary of this run takes its place to run the instrument.
          ln -sf "$FLANG" bootstrap/flang
          bootstrap/flang run-script install-parity:check

      # The instrument must go red when one install is damaged: here the
      # install.sh copy loses share/flang/js, and the run must fail on the
      # `emit --target js` call. An instrument that stays green on this is
      # indistinguishable from one that is switched off.
      - name: Probe the instrument with a damaged install
        run: |
          set -eu
          root="$RUNNER_TEMP/installs"
          rm -rf "$root/install-sh/share/flang/js" "$root/work-probe"
          mkdir -p "$root/work-probe"
          {
            echo "$PWD"
            echo "$root/work-probe"
            printf 'tarball\t%s\n' "$FLANG"
            printf 'install-sh-without-js\t%s\n' "$root/install-sh/bin/flang"
          } > packaging/install-parity.txt
          if bootstrap/flang run-script install-parity:check; then exit 1; fi
          echo "the instrument went red on the damaged install, as it must"

      - name: Probe the instrument with installs that all lack the library
        run: |
          set -eu
          root="$RUNNER_TEMP/installs"
          rm -rf "$root/install-sh/share/flang/stdlib" "$root/work-probe"
          mkdir -p "$root/work-probe"
          {
            echo "$PWD"
            echo "$root/work-probe"
            printf 'install-sh-without-library\t%s\n' "$root/install-sh/bin/flang"
            printf 'install-sh-without-library-again\t%s\n' "$root/install-sh/bin/flang"
          } > packaging/install-parity.txt
          if bootstrap/flang run-script install-parity:check; then exit 1; fi
          echo "the instrument refused installs without share/flang/stdlib, as it must"
