# Выпуск версии: релизный архив C на GitHub.
#
# Запускается только на теге вида v0.8.0 — не на каждый push в main. Причина в
# необратимости: тег — это явное решение человека «вот эту версию наружу», и
# оно должно приниматься отдельно от решения «влить ветку».
#
# ── ЧТО ЭТОТ ФАЙЛ ПЕРЕСТАЛ ДЕЛАТЬ 3 СЕНТЯБРЯ 2026 ───────────────────────────
#
# Он назывался `publish-npm.yml` и делал две работы сразу: собирал релизный
# архив И публиковал пакет в npm. Владелец решил npm убрать; половина про
# публикацию удалена целиком, половина про архив осталась здесь. Поимённо
# удалены шаги: «Установить зависимости» (`npm ci`), «Проверить состав пакета»
# (`npm pack --dry-run`), «Проверить, что пакет ставится и отдаёт двоичный»
# (`npm install` тарбола), «Проверить, настроен ли секрет» (`NPM_TOKEN`),
# «Опубликовать» (`npm publish --access public --provenance`) и «Показать, что
# было бы опубликовано» (`npm publish --dry-run`). Вместе с ними ушло право
# `id-token: write` — оно было нужно только провенансу npm.
#
# СЕКРЕТ `NPM_TOKEN` В ХРАНИЛИЩЕ GITHUB ЭТИМ НЕ ТРОНУТ. Его читал единственный
# шаг «Проверить, настроен ли секрет», и шага больше нет: задан токен или нет,
# ни одна работа этого дерева его теперь не спрашивает. Убирать сам секрет —
# решение владельца, не этой правки.
#
# ЧТО ПРИ ЭТОМ ПОТЕРЯНО, названо прямо: установка под Windows. `bin` в npm
# обязан быть файлом, который запустит `node`, — ради этого и жили обёртки
# `packaging/flang-launch.mjs` и `flang/bin/flang-lsp.mjs`. Формула Homebrew
# Windows не ставит, а релизный архив ниже — исходники C99 под `make`. Разбор:
# `tasks/8649-npm-leaves-the-tree.md`.
#
# ── ЧТО БЫЛО СЛОМАНО ЗДЕСЬ, И ЧИНИТСЯ ЭТОЙ ЖЕ ПРАВКОЙ ──────────────────────
#
# Шаг «Собрать релизный архив C» зовёт `bootstrap/flang`, а собирать его в этом
# файле было НЕКОМУ: `bootstrap/flang` — продукт сборки и в дереве не лежит
# (`.gitignore`), `npm ci` клал двоичный в `dvoichnyy/`, а не в `bootstrap/`, и
# единственное место, которое собирало семя само, — `./ярлык` — звалось шагом
# `npm test` ПОСЛЕ архива. То есть выпуск падал на первом же собственном шаге.
# То же самое записано словами в шапке `./ярлык`: «там `bootstrap/flang` не
# собирает никто». Теперь семя собирается явным шагом до архива.
#
# ── ПОЧЕМУ ПОРЯДОК ИМЕННО ТАКОЙ ────────────────────────────────────────────
#
# Собрали семя → собрали архив → сверили его хеш с формулой Homebrew →
# приложили к релизу → прогнали набор. Сверка хеша стоит ДО выкладки: разойдись
# он с формулой, `brew install` встал бы на скачивании у всех и сразу, и узнать
# об этом надо здесь, а не по жалобам.
#
# ── ВЫПУСК НЕ ОПИРАЕТСЯ НА КЕШ ПРИГОВОРОВ ──────────────────────────────────
#
# `AGENTS.md`, раздел «Кеш приговоров: где живёт и чему он НЕ основание», несёт
# правило, которое отменять нельзя: «Кешу верят для СКОРОСТИ. Для ИСТИНЫ — про-
# веряльщику. Выпуск не имеет права опираться на кеш: перед меткой всё пересчи-
# тывается начисто, без `FLANG_KESH_PRIGOVOROV`.» Принуждает его составное
# действие `.github/actions/release-without-cache`, и шаг стоит ПЕРВЫМ после
# выкладки. Сторож зовётся с `mode: release`, а не решает по среде: этот файл
# НИЧЕМ, кроме выпуска, не бывает.

name: Выпуск — релизный архив C на GitHub

on:
  push:
    tags: ["v*"]
  # Ручной запуск — сам себе проба: шаг выкладки идёт только на теге, поэтому
  # с ветки прогон соберёт архив и сверит его хеш, ничего никуда не выложив.
  # Отдельный ключ `dry-run` был нужен публикации в npm и ушёл вместе с ней.
  workflow_dispatch:

permissions:
  # contents: write — не расширение полномочий ради удобства, а то, без чего
  # порядок шагов остаётся кругом: релиз и вложение к нему создаются этим же
  # прогоном. Прежде стояло `read`, и приложить архив было нечем.
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история и все теги: журнал изменений печатается из них
          # (scripts/build-changelog.mjs), и набор сверяет записанный файл с
          # историей. В клоне из одной ревизии эта сверка сравнивает пустоту с
          # пустотой и молчит.
          fetch-depth: 0
          # `fetch-depth: 0` тянет всю историю КОММИТОВ, но не гарантирует сами
          # ТЕГИ — по умолчанию `actions/checkout` их не забирает, даже с
          # глубиной 0. Без этого шаг ниже, зовущий
          # `git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME"`,
          # находит тег как пустоту, и `gh release create` тихо подставляет
          # вместо заголовка метки первую строку коммита, на который она
          # указывает. Так вышел релиз v0.7.3 на main (найдено и починено
          # там же 3 сентября 2026) — перенесено сюда той же правкой.
          fetch-tags: true
      - name: Выпуск не опирается на кеш приговоров
        uses: ./.github/actions/release-without-cache
        with:
          mode: release

      # Node остаётся ради набора проверок (`./ярлык тесты` — это
      # `node --test`). `cache: npm` снят вместе с `package-lock.json`: без
      # замка этот ключ падает с «unable to cache dependencies», а `registry-url`
      # был нужен только публикации.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Семя собирается ЗДЕСЬ, до всего остального: им печатается архив.
      - name: Собрать точку раскрутки
        run: make -C bootstrap -j"$(nproc)"

      - name: Проверить, что тег совпадает с версией пакета
        if: startsWith(github.ref, 'refs/tags/v')
        # Имена переменных латиницей. В именах оболочка допускает только
        # [A-Za-z_][A-Za-z0-9_]*, поэтому «тег=…» она разбирает не как
        # присваивание, а как команду — и шаг падал с кодом 127 «command not
        # found», не назвав ни одной причины.
        #
        # Версия читается `sed`-ом, а не `node -p require("./package.json")`:
        # путь выпуска не обязан звать Node ради одной строки, а вид файла
        # закреплён — `package.json` печатается из `scripts/emit-package.flang`
        # знак в знак, и отступ в два пробела там часть договора.
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^  "version": "\([^"]*\)",$/\1/p' package.json)"
          if [ -z "$package_version" ]; then
            echo "::error::версию не вычитать из package.json — вид файла изменился, а его печатает scripts/emit-package.flang"
            exit 1
          fi
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::тег $GITHUB_REF_NAME обещает версию $tag_version, а package.json говорит $package_version"
            exit 1
          fi
          echo "версия $package_version подтверждена тегом"

      - name: Собрать релизный архив C
        # Скрипт не только печатает компилятор в C99, но и СОБИРАЕТ напечатанное
        # в окружении без Node в PATH и запускает собранное. Битый архив дальше
        # этого шага не уедет.
        #
        # Список файлов берётся вычитанием, а не перечислением: сборка идёт в том
        # же каталоге и оставляет рядом *.o, libcompiler_flang.a и сам бинарник —
        # `tar … .` унёс бы человеку бинарник чужой машины вместо исходников.
        # Перечислять имена поимённо тоже нельзя: между 0.5.1 и 0.5.2 два файла
        # из девяти переименовались, и список молча отстал бы.
        #
        # Ключи tar — ради ПОВТОРИМОСТИ: простой `tar -czf` кладёт в архив время
        # правки, права и владельца, и один и тот же каталог даёт разные байты.
        # Хеш, который нельзя повторить, нельзя и проверить.
        run: |
          set -eu
          LC_ALL=C.UTF-8 bootstrap/flang io scripts/release-in-c.flang --timeout 1800000
          version="$(sed -n 's/^  "version": "\([^"]*\)",$/\1/p' package.json)"
          files="$(cd output/release-c && ls | grep -Ev '\.(o|a)$|^flang(_cli)?$')"
          echo "в архив идут файлы:"; echo "$files" | sed 's/^/  /'
          tar --sort=name --format=ustar --owner=0 --group=0 --numeric-owner \
              --mtime=@0 --mode=u=rw,go=r,a+X -C output/release-c -cf - $files \
            | gzip -9n > "output/flang-$version-c.tar.gz"
          ls -l "output/flang-$version-c.tar.gz"
          sha256sum "output/flang-$version-c.tar.gz"
          echo "ARHIV=output/flang-$version-c.tar.gz" >> "$GITHUB_ENV"

      - name: Сверить хеш архива с формулой Homebrew
        # Формула несёт sha256 архива, и brew сверяет его сам: разойдись он —
        # `brew install` встанет на скачивании, у ВСЕХ и сразу. Проверять это
        # надо здесь, до того как архив уедет в релиз, а не по жалобам.
        run: |
          set -eu
          sobran="$(sha256sum "$ARHIV" | cut -d' ' -f1)"
          v_formule="$(sed -n 's/^ *sha256 "\([0-9a-f]\{64\}\)".*/\1/p' packaging/homebrew/flang.rb)"
          if [ "$sobran" != "$v_formule" ]; then
            echo "::error::архив собрался с sha256 $sobran, а packaging/homebrew/flang.rb ждёт $v_formule."
            echo "::error::Хеш описывает ДЕРЕВО, а не номер версии, и пересчитывается при каждом выпуске."
            echo "::error::Впишите в формулу: sha256 \"$sobran\" — и повторите тег."
            exit 1
          fi
          echo "хеш архива совпал с формулой: $sobran"

      - name: Приложить архив к релизу
        # `gh release create` на уже существующем релизе отвечает ошибкой —
        # поэтому сначала спрашиваем.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Архив C99: собирается одним \`make\`, Node не нужен. Или \`brew install digitable-lol/tap/flang\`. Пакета npm больше нет; вместе с ним у Windows не осталось пути установки."
          fi
          gh release upload "$GITHUB_REF_NAME" "$ARHIV" --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'

      - name: Прогнать весь набор проверок
        # Был `npm test` — это ровно `./ярлык тесты`, то есть
        # `node --test flang/test/*.test.mjs`. npm не делал здесь ничего, кроме
        # подстановки строки из `package.json`.
        run: ./ярлык тесты
