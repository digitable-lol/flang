name: Перепечатка

# ГЛАВНОЕ СВОЙСТВО САМОСБОРКИ НЕ ПРОВЕРЯЕТСЯ НИЧЕМ, И ВОТ ПОЧЕМУ.
#
# «Напечатанное совпадает с закоммиченным байт в байт» умеет проверять ровно
# одна команда — `sh scripts/raskrutka.sh --check`, и она ПЕЧАТАЕТ ЗАНОВО.
#
# ── ПАМЯТЬ БОЛЬШЕ НЕ ПРИЧИНА, И ЭТО ЗАМЕР, А НЕ МНЕНИЕ ──────────────────────
# До 1 сентября 2026 здесь стояло «258,9 ГиБ, в шестнадцать раз больше раннера,
# НЕ ВЛЕЗАЕТ». Число снято 24 августа — ДО починки арены рантайма, которая с тех
# пор уехала в само семя. Три захода 31 августа тем же прибором
# (`/usr/bin/time -v`, `Maximum resident set size`):
#
#   заход 1   24,3 ГиБ
#   заход 2   35,4 ГиБ   ← наибольший
#   заход 3   34,7 ГиБ
#
# Разрыв с прежним числом — 7,3 раза. Разбор: tasks/1310-semya-sverka-zheleza.md
# (замер Ч160 на стволе ef718648).
#
# ВЛЕЗАЕТ. Наибольший замер помещается в larger runner GitHub на 64 ГБ с запасом
# 1,7×. Отговаривать от работы памятью больше нельзя.
#
# ── ЧТО ДЕРЖИТ НА САМОМ ДЕЛЕ: ДЛИНА ────────────────────────────────────────
# Заход идёт 8 ч 34 мин – 9 ч 56 мин на ОДНОМ ядре (`Percent of CPU: 99%`), а у
# задания на раннере GitHub потолок шесть часов. Многоядерность не поможет:
# прогон однопоточный. Нужна машина с 64 ГБ и одним быстрым ядром, готовая
# считать 12 часов раз в неделю, — и это решение о железе, а не о коде
# (задача 1310).
#
# Поэтому работа `sverka` ниже стоит НЕ на ubuntu-latest, а на своём раннере, и
# включается переменной репозитория. Пока такого раннера нет, работа не
# запускается — и это честнее, чем зелёная галочка от работы, которая ничего не
# печатала.
#
# Вторая работа, `svezhest`, стоит копейки и идёт всегда: она не проверяет
# свойство, а НАЗЫВАЕТ, когда его проверяли в последний раз, и краснеет, если
# входы печати правили позже. Свойство, которое никто не проверяет, перестаёт
# быть свойством; проверка, которая об этом молчит, — вторая беда поверх первой.

on:
  schedule:
    # Раз в неделю, ночью в воскресенье. Не чаще: заход занимает машину на
    # полдня, и два одновременных её положат.
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Дёшево и всегда: состояние побайтовой сверки, вслух ───────────────────
  #
  # ПОЧЕМУ ЭТА РАБОТА ГОВОРИТ ДВЕ ВЕЩИ, А НЕ ОДНУ.
  #
  # Работа `sverka` ниже включается переменной репозитория и без своего раннера
  # просто НЕ ЗАПУСКАЕТСЯ. В ленте это выглядит как «Skipped» — серая строка,
  # которую не читают, а прогон в целом может быть зелёным. Получается та же
  # беда, от которой всё это заводилось: молчание, неотличимое от «всё хорошо».
  #
  # Поэтому состояние машины называется здесь, в работе, которая идёт ВСЕГДА, и
  # называется дважды: строкой в сводке прогона (её видно на странице прогона,
  # не открывая логов) и предупреждением-заметкой. И код возврата у работы
  # красный, пока хоть одно из двух не так: сверка устарела или считать её
  # не на чем.
  svezhest:
    name: Состояние побайтовой сверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: проверка спрашивает git о дате последней правки
          # входов печати. В клоне на одну ревизию ответа нет, и проверка
          # зеленела бы от пустоты.
          fetch-depth: 0
      - run: make -C bootstrap -j"$(nproc)"

      - name: Свежесть побайтовой сверки
        id: svezhest
        continue-on-error: true
        run: ./bootstrap/flang io scripts/reprint-freshness.flang 2>&1 | tee /tmp/svezhest.txt

      - name: Сказать вслух, на чём сверку считать
        if: always()
        env:
          MASHINA: ${{ vars.BOLSHAYA_PAMYAT }}
        run: |
          set -u
          {
            echo "## Побайтовая сверка перепечатки"
            echo
            echo '```'
            cat /tmp/svezhest.txt 2>/dev/null || echo "проверка свежести не отвечала"
            echo '```'
            echo
            if [ "${MASHINA:-}" = "da" ]; then
              echo "**Машина:** раннер с большой памятью объявлен (BOLSHAYA_PAMYAT=da),"
              echo "работа «Семя совпадает с печатью байт в байт» идёт этим же прогоном."
            else
              echo "**Машины нет.** Переменная репозитория \`BOLSHAYA_PAMYAT\` не равна \`da\`,"
              echo "и работа «Семя совпадает с печатью байт в байт» НЕ ЗАПУСКАЛАСЬ."
              echo
              echo "Держит НЕ память. Три захода 31 августа 2026 дали пик **24,3 / 35,4 /"
              echo "34,7 ГиБ** — наибольший влезает в larger runner GitHub на 64 ГБ с запасом"
              echo "**1,7×** (замер Ч160, tasks/1310-semya-sverka-zheleza.md). Прежнее число"
              echo "258,9 ГиБ снято 24 августа, до починки арены, и врёт в 7,3 раза."
              echo
              echo "Держит **длина**: заход идёт 8 ч 34 мин – 9 ч 56 мин на ОДНОМ ядре, а у"
              echo "задания на раннере GitHub потолок шесть часов. Нужна машина с 64 ГБ и"
              echo "одним быстрым ядром на 12 часов раз в неделю."
              echo
              echo "Пока такого раннера нет, главное свойство самосборки — что напечатанное"
              echo "совпадает с закоммиченным байт в байт — **не проверяется ничем**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${MASHINA:-}" != "da" ]; then
            echo "::warning title=Побайтовую сверку не на чем считать::раннер не объявлен; держит не память (пик 35,4 ГиБ, влезает в 64 ГБ с запасом 1,7×), а длина — 8 ч 34 мин на одном ядре при потолке задания в шесть часов; работа sverka не запускалась"
          fi

      - name: Приговор
        if: always()
        env:
          MASHINA: ${{ vars.BOLSHAYA_PAMYAT }}
          SVEZHEST: ${{ steps.svezhest.outcome }}
        run: |
          set -u
          bed=0
          if [ "$SVEZHEST" != "success" ]; then
            echo "побайтовая сверка устарела или её не было — подробности выше" >&2
            bed=1
          fi
          if [ "${MASHINA:-}" != "da" ]; then
            echo "считать побайтовую сверку не на чем: раннера с большой памятью нет" >&2
            bed=1
          fi
          exit "$bed"

  # ── Дёшево и перед дорогим: печать умеет печатать то, что соберётся ───────
  #
  # ПОЧЕМУ ЭТА РАБОТА СТОИТ ПЕРЕД `sverka`, А НЕ РЯДОМ С НЕЙ.
  #
  # 29 августа 2026 перепечатка дошла до конца впервые за заход: 6 ч 23 мин,
  # код 0, семя 40,7 МБ. И напечатанное семя не собралось СВОИМ ЖЕ Makefile —
  # строковая постоянная в 4614 знаков при обещанных C99 4095, а Makefile сам
  # просит `-pedantic -Werror`. Узнать об этом стоило шести часов печати плюс
  # 37,30 с сборки.
  #
  # Тот же ответ сторож даёт за 2,96 с и ДО печати: он спрашивает у самого
  # двоичного, умеет ли тот резать длинные постоянные, и называет по именам
  # входы печати, в которых такие постоянные лежат. Поэтому `sverka` теперь
  # ждёт его: полдня машины не тратятся на заведомо несобираемое семя.
  postoyannye:
    name: Постоянные под пределом C99
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Сторожу нужен ЖИВОЙ двоичный: вопрос «умеет ли печать резать» он задаёт
      # прогоном печати, а не чтением исходников. Чтением на него ответить
      # нельзя — печатью правит эмиттер, зашитый в двоичный, а не тот, что
      # лежит в дереве.
      - run: make -C bootstrap -j"$(nproc)"
      - name: сторож краснеет на подложенной длинной постоянной
        run: sh scripts/overlong-string-guard.sh --подлог
        env:
          FLANG_TMP: ${{ runner.temp }}
      - name: длинных строковых постоянных нет ни в семени, ни во входах печати
        run: sh scripts/overlong-string-guard.sh
        env:
          FLANG_TMP: ${{ runner.temp }}

  # ── Дорого и по расписанию: сама сверка ───────────────────────────────────
  #
  # Включается переменной репозитория BOLSHAYA_PAMYAT=da, и это не бюрократия:
  # работа, поставленная в очередь к несуществующему раннеру, висит до отмены и
  # выглядит как «идёт», хотя не идёт. Пусть лучше её не будет видно вовсе, чем
  # будет видно неправду.
  sverka:
    name: Семя совпадает с печатью байт в байт
    needs: postoyannye
    if: vars.BOLSHAYA_PAMYAT == 'da'
    runs-on: [self-hosted, bolshaya-pamyat]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"
      # ОТКАЗ «FLANG не задан» ЗДЕСЬ СНЯТ 1 сентября 2026, и вот чем он был неверен.
      #
      # Стояло: «потолок шагов закоммиченного семени — 1 000 000 000, а самый
      # дорогой шаг печати стоит больше ста миллиардов витков, значит стоковый
      # двоичный печатать дерево не может». Потолок 10^9 — свойство семени,
      # напечатанного 22 августа. В сегодняшнем семени стоит
      # `#define FL_MAX_STEPS 1400000000000` (bootstrap/flang_runtime.h:11), то
      # есть втрое больше измеренной цены шага 456 857 834 234
      # (scripts/raskrutka.sh, `MEASURED_COST`). Заход 31 августа 2026 шёл
      # СТОКОВЫМ `bootstrap/flang` и дошёл.
      #
      # Отказ, оставленный как был, останавливал бы заход, который дошёл бы.
      # Поэтому FLANG теперь НЕОБЯЗАТЕЛЕН: он назван — печатает он, не назван —
      # печатает семя, и об этом говорится вслух, а не молчанием.
      - name: Чем печатаем
        run: |
          if [ -n "${FLANG:-}" ]; then
            echo "печатает двоичный из FLANG: $FLANG"
          else
            echo "FLANG не задан — печатает семя bootstrap/flang."
            echo "Его потолок шагов:"
            grep '#define FL_MAX_STEPS' bootstrap/flang_runtime.h
            echo "Измеренная цена самого дорогого шага печати — 456 857 834 234"
            echo "(scripts/raskrutka.sh, MEASURED_COST). Потолок обязан быть не ниже."
          fi
        env:
          FLANG: ${{ vars.FLANG_VYSOKIY }}
      - name: Побайтовая сверка семени с печатью
        run: sh scripts/raskrutka.sh --check
        env:
          FLANG: ${{ vars.FLANG_VYSOKIY }}
          FLANG_TMP: ${{ runner.temp }}
      # Итог заносится в ведомость руками, одной строкой: дата, «сверка», итог,
      # секунды, пик, байты, потолок, откуда. Иначе следующий не узнает, что
      # сверка была, и `svezhest` останется красной при сделанной работе.
      - name: Напомнить о ведомости
        if: always()
        run: |
          echo "Занесите итог строкой в docs/reprint-ledger.tsv — без этого"
          echo "проверка свежести останется красной при сделанной работе."
