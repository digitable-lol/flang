name: Перепечатка

# ГЛАВНОЕ СВОЙСТВО САМОСБОРКИ НЕ ПРОВЕРЯЕТСЯ НИЧЕМ, И ВОТ ПОЧЕМУ.
#
# «Напечатанное совпадает с закоммиченным байт в байт» умеет проверять ровно
# одна команда — `sh scripts/raskrutka.sh --check`, и она ПЕЧАТАЕТ ЗАНОВО.
#
# ── ПАМЯТЬ БОЛЬШЕ НЕ ПРИЧИНА, И ЭТО ЗАМЕР, А НЕ МНЕНИЕ ──────────────────────
# До 1 сентября 2026 здесь стояло «258,9 ГиБ, в шестнадцать раз больше раннера,
# НЕ ВЛЕЗАЕТ». Число снято 24 августа — ДО починки арены рантайма, которая с тех
# пор уехала в само семя. Три захода 31 августа тем же прибором
# (`/usr/bin/time -v`, `Maximum resident set size`):
#
#   заход 1   24,3 ГиБ
#   заход 2   35,4 ГиБ   ← наибольший
#   заход 3   34,7 ГиБ
#
# Разрыв с прежним числом — 7,3 раза. Разбор: tasks/1310-semya-sverka-zheleza.md
# (замер Ч160 на стволе ef718648).
#
# ВЛЕЗАЕТ. Наибольший замер помещается в larger runner GitHub на 64 ГБ с запасом
# 1,7×. Отговаривать от работы памятью больше нельзя.
#
# ── ЧТО ДЕРЖИТ НА САМОМ ДЕЛЕ: ДЛИНА ────────────────────────────────────────
# Заход идёт 8 ч 34 мин – 9 ч 56 мин на ОДНОМ ядре (`Percent of CPU: 99%`), а у
# задания на раннере GitHub потолок шесть часов. Многоядерность не поможет:
# прогон однопоточный. Нужна машина с 64 ГБ и одним быстрым ядром, готовая
# считать 12 часов раз в неделю, — и это решение о железе, а не о коде
# (задача 1310).
#
# Поэтому работа `sverka` ниже стоит НЕ на ubuntu-latest, а на своём раннере, и
# включается переменной репозитория. Пока такого раннера нет, работа не
# запускается — и это честнее, чем зелёная галочка от работы, которая ничего не
# печатала.
#
# Вторая работа, `svezhest`, стоит копейки и идёт всегда: она не проверяет
# свойство, а НАЗЫВАЕТ, когда его проверяли в последний раз, и краснеет, если
# входы печати правили позже. Свойство, которое никто не проверяет, перестаёт
# быть свойством; проверка, которая об этом молчит, — вторая беда поверх первой.

on:
  schedule:
    # Раз в неделю, ночью в воскресенье. Не чаще: заход занимает машину на
    # полдня, и два одновременных её положат.
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Дёшево и всегда: состояние побайтовой сверки, вслух ───────────────────
  #
  # ПОЧЕМУ ЭТА РАБОТА ГОВОРИТ ДВЕ ВЕЩИ, А НЕ ОДНУ.
  #
  # Работа `sverka` ниже включается переменной репозитория и без своего раннера
  # просто НЕ ЗАПУСКАЕТСЯ. В ленте это выглядит как «Skipped» — серая строка,
  # которую не читают, а прогон в целом может быть зелёным. Получается та же
  # беда, от которой всё это заводилось: молчание, неотличимое от «всё хорошо».
  #
  # Поэтому состояние машины называется здесь, в работе, которая идёт ВСЕГДА, и
  # называется дважды: строкой в сводке прогона (её видно на странице прогона,
  # не открывая логов) и предупреждением-заметкой. И код возврата у работы
  # красный, пока хоть одно из двух не так: сверка устарела или считать её
  # не на чем.
  svezhest:
    name: freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: проверка спрашивает git о дате последней правки
          # входов печати. В клоне на одну ревизию ответа нет, и проверка
          # зеленела бы от пустоты.
          fetch-depth: 0
      - run: make -C bootstrap -j"$(nproc)"

      - name: Свежесть побайтовой сверки
        id: svezhest
        continue-on-error: true
        run: ./bootstrap/flang io scripts/reprint-freshness.flang 2>&1 | tee /tmp/svezhest.txt

      - name: Сказать вслух, на чём сверку считать
        if: always()
        env:
          MASHINA: ${{ vars.BOLSHAYA_PAMYAT }}
        run: |
          set -u
          {
            echo "## Побайтовая сверка перепечатки"
            echo
            echo '```'
            cat /tmp/svezhest.txt 2>/dev/null || echo "проверка свежести не отвечала"
            echo '```'
            echo
            if [ "${MASHINA:-}" = "da" ]; then
              echo "**Машина:** раннер с большой памятью объявлен (BOLSHAYA_PAMYAT=da),"
              echo "работа «Семя совпадает с печатью байт в байт» идёт этим же прогоном."
            else
              echo "**Машины нет.** Переменная репозитория \`BOLSHAYA_PAMYAT\` не равна \`da\`,"
              echo "и работа «Семя совпадает с печатью байт в байт» НЕ ЗАПУСКАЛАСЬ."
              echo
              echo "Держит НЕ память. Три захода 31 августа 2026 дали пик **24,3 / 35,4 /"
              echo "34,7 ГиБ** — наибольший влезает в larger runner GitHub на 64 ГБ с запасом"
              echo "**1,7×** (замер Ч160, tasks/1310-semya-sverka-zheleza.md). Прежнее число"
              echo "258,9 ГиБ снято 24 августа, до починки арены, и врёт в 7,3 раза."
              echo
              echo "Держит **длина**: заход идёт 8 ч 34 мин – 9 ч 56 мин на ОДНОМ ядре, а у"
              echo "задания на раннере GitHub потолок шесть часов. Нужна машина с 64 ГБ и"
              echo "одним быстрым ядром на 12 часов раз в неделю."
              echo
              echo "Пока такого раннера нет, главное свойство самосборки — что напечатанное"
              echo "совпадает с закоммиченным байт в байт — **не проверяется ничем**."
            fi
            # ВТОРАЯ ВЕЩЬ, КОТОРУЮ ЭТА РАБОТА ГОВОРИТ ВСЛУХ.
            #
            # Работа «Две печати одного дерева совпадают побайтово» стоит на той
            # же переменной и в ленте тоже бывает серым «Skipped». Серая строка
            # не читается и потому не сказана. Здесь она названа словами.
            echo
            echo "### Две печати одного дерева"
            echo
            if [ "${MASHINA:-}" = "da" ]; then
              echo "Работа **«Две печати одного дерева совпадают побайтово» запускалась этим"
              echo "прогоном** — её приговор стоит отдельной строкой в этой же ленте, вместе"
              echo "с кодом прибора \`scripts/two-prints-identical.sh\`."
              echo
              echo "Если её строки в ленте всё же нет, значит её не пустила работа"
              echo "«Постоянные под пределом C99», которую она ждёт. Тогда вопрос гейта Г6"
              echo "этим прогоном НЕ ЗАДАН — и это «не проверено», а не «сошлось»."
            else
              echo "Работа **«Две печати одного дерева совпадают побайтово» НЕ ЗАПУСКАЛАСЬ**."
              echo "Ей нужны ДВЕ печати подряд, то есть та же машина, что и сверке выше, и"
              echo "та же переменная \`BOLSHAYA_PAMYAT\` — она не равна \`da\`."
              echo
              echo "Её отсутствие не значит «печать воспроизводима». Оно значит, что вопрос"
              echo "гейта Г6 — даёт ли одно дерево при двух заходах побайтово одно и то же —"
              echo "**никем не задан**. Прибор \`scripts/two-prints-identical.sh\` в дереве"
              echo "лежит, но пока эта работа не идёт, он зовётся только руками, а Г6 требует"
              echo "дословно «проверяется автоматически, а не разово руками»: разовая сверка"
              echo "руками гейта не берёт, даже когда сошлась."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${MASHINA:-}" != "da" ]; then
            echo "::warning title=Побайтовую сверку не на чем считать::раннер не объявлен; держит не память (пик 35,4 ГиБ, влезает в 64 ГБ с запасом 1,7×), а длина — 8 ч 34 мин на одном ядре при потолке задания в шесть часов; работа sverka не запускалась"
          fi
          if [ "${MASHINA:-}" != "da" ]; then
            echo "::warning title=Две печати одного дерева никто не сверял::работа «Две печати одного дерева совпадают побайтово» не запускалась — нет машины; вопрос гейта Г6 этим прогоном НЕ ЗАДАН, и это не «сошлось»"
          fi

      - name: Приговор
        if: always()
        env:
          MASHINA: ${{ vars.BOLSHAYA_PAMYAT }}
          SVEZHEST: ${{ steps.svezhest.outcome }}
        run: |
          set -u
          bed=0
          if [ "$SVEZHEST" != "success" ]; then
            echo "побайтовая сверка устарела или её не было — подробности выше" >&2
            bed=1
          fi
          if [ "${MASHINA:-}" != "da" ]; then
            echo "считать побайтовую сверку не на чем: раннера с большой памятью нет" >&2
            bed=1
          fi
          exit "$bed"

  # ── Дёшево и перед дорогим: печать умеет печатать то, что соберётся ───────
  #
  # ПОЧЕМУ ЭТА РАБОТА СТОИТ ПЕРЕД `sverka`, А НЕ РЯДОМ С НЕЙ.
  #
  # 29 августа 2026 перепечатка дошла до конца впервые за заход: 6 ч 23 мин,
  # код 0, семя 40,7 МБ. И напечатанное семя не собралось СВОИМ ЖЕ Makefile —
  # строковая постоянная в 4614 знаков при обещанных C99 4095, а Makefile сам
  # просит `-pedantic -Werror`. Узнать об этом стоило шести часов печати плюс
  # 37,30 с сборки.
  #
  # Тот же ответ сторож даёт за 2,96 с и ДО печати: он спрашивает у самого
  # двоичного, умеет ли тот резать длинные постоянные, и называет по именам
  # входы печати, в которых такие постоянные лежат. Поэтому `sverka` теперь
  # ждёт его: полдня машины не тратятся на заведомо несобираемое семя.
  postoyannye:
    name: c99-limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Сторожу нужен ЖИВОЙ двоичный: вопрос «умеет ли печать резать» он задаёт
      # прогоном печати, а не чтением исходников. Чтением на него ответить
      # нельзя — печатью правит эмиттер, зашитый в двоичный, а не тот, что
      # лежит в дереве.
      - run: make -C bootstrap -j"$(nproc)"
      - name: сторож краснеет на подложенной длинной постоянной
        run: sh scripts/overlong-string-guard.sh --подлог
        env:
          FLANG_TMP: ${{ runner.temp }}
      - name: длинных строковых постоянных нет ни в семени, ни во входах печати
        run: sh scripts/overlong-string-guard.sh
        env:
          FLANG_TMP: ${{ runner.temp }}

  # ── Дёшево и перед дорогим: два имени не дают один идентификатор ──────────
  #
  # ПОЧЕМУ ЭТО СТОИТ ЗДЕСЬ, А НЕ ТОЛЬКО ВНУТРИ ПЕЧАТИ.
  #
  # 31 августа 2026 перепечатка шла 9 ч 56 мин и упала на последней стадии от
  # пары «Занято именем модуля C++» и «Занято именем модуля C»: плюсы в
  # идентификаторе не выживают, и оба имени давали `zanyato_imenem_modulya_c`.
  # Проверку тогда перенесли ВНУТРЬ печати, перед суд ядра, и отказ стал
  # приходить за 580 с вместо 35 760 (задача 1174).
  #
  # 2 сентября 2026 то же самое сожгло ЕЩЁ ДВЕ печати: 37 468 с и 37 796 с,
  # 20 ч 54 мин на двоих, пара «Обойти занятое целью C++» и «Обойти занятое
  # целью C». Ствол эту пару к тому часу уже починил — `cd5a9f26`, 1 сентября
  # 18:07, на десять часов раньше, — а печати шли из клона, застрявшего на
  # `ef718648`. Остановить их было НЕЧЕМУ: сторож
  # `scripts/latin-collision-guard.mjs` в дереве лежит, отвечает за 0,36 с и на
  # `ef718648` краснеет кодом 1, но его не звала ни одна проверка.
  #
  # Отсюда шаг: тот же ответ, что печать даёт за 580 с, здесь даётся за 0,36 с
  # и ДО того, как машина занята на полдня. Node тут уже есть; в
  # `scripts/raskrutka.sh` его нет намеренно («Node не нужен ни на одном шаге»),
  # и сторож туда не ставится.
  stolknoveniya:
    name: id-collisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: имена замыкания компилятора не схлопываются после «Змейки»
        run: node scripts/latin-collision-guard.mjs

  # ── Дорого и по расписанию: сама сверка ───────────────────────────────────
  #
  # Включается переменной репозитория BOLSHAYA_PAMYAT=da, и это не бюрократия:
  # работа, поставленная в очередь к несуществующему раннеру, висит до отмены и
  # выглядит как «идёт», хотя не идёт. Пусть лучше её не будет видно вовсе, чем
  # будет видно неправду.
  sverka:
    name: reprint-check
    needs: [postoyannye, stolknoveniya]
    if: vars.BOLSHAYA_PAMYAT == 'da'
    runs-on: [self-hosted, bolshaya-pamyat]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"
      # ОТКАЗ «FLANG не задан» ЗДЕСЬ СНЯТ 1 сентября 2026, и вот чем он был неверен.
      #
      # Стояло: «потолок шагов закоммиченного семени — 1 000 000 000, а самый
      # дорогой шаг печати стоит больше ста миллиардов витков, значит стоковый
      # двоичный печатать дерево не может». Потолок 10^9 — свойство семени,
      # напечатанного 22 августа. В сегодняшнем семени стоит
      # `#define FL_MAX_STEPS 1400000000000` (bootstrap/flang_runtime.h:11), то
      # есть втрое больше измеренной цены шага 456 857 834 234
      # (scripts/raskrutka.sh, `MEASURED_COST`). Заход 31 августа 2026 шёл
      # СТОКОВЫМ `bootstrap/flang` и дошёл.
      #
      # Отказ, оставленный как был, останавливал бы заход, который дошёл бы.
      # Поэтому FLANG теперь НЕОБЯЗАТЕЛЕН: он назван — печатает он, не назван —
      # печатает семя, и об этом говорится вслух, а не молчанием.
      - name: Чем печатаем
        run: |
          if [ -n "${FLANG:-}" ]; then
            echo "печатает двоичный из FLANG: $FLANG"
          else
            echo "FLANG не задан — печатает семя bootstrap/flang."
            echo "Его потолок шагов:"
            grep '#define FL_MAX_STEPS' bootstrap/flang_runtime.h
            echo "Измеренная цена самого дорогого шага печати — 456 857 834 234"
            echo "(scripts/raskrutka.sh, MEASURED_COST). Потолок обязан быть не ниже."
          fi
        env:
          FLANG: ${{ vars.FLANG_VYSOKIY }}
      - name: Побайтовая сверка семени с печатью
        run: sh scripts/raskrutka.sh --check
        env:
          FLANG: ${{ vars.FLANG_VYSOKIY }}
          FLANG_TMP: ${{ runner.temp }}
      # Итог заносится в ведомость руками, одной строкой: дата, «сверка», итог,
      # секунды, пик, байты, потолок, откуда. Иначе следующий не узнает, что
      # сверка была, и `svezhest` останется красной при сделанной работе.
      - name: Напомнить о ведомости
        if: always()
        run: |
          echo "Занесите итог строкой в docs/reprint-ledger.tsv — без этого"
          echo "проверка свежести останется красной при сделанной работе."

  # ── Дорого и по расписанию: печатает ли дерево дважды ОДНО И ТО ЖЕ ────────
  #
  # ЧЕМ ЭТА РАБОТА ОТЛИЧАЕТСЯ ОТ `sverka` ВЫШЕ. `sverka` спрашивает «печать
  # совпадает с ЗАКОММИЧЕННЫМ семенем». Эта спрашивает другое и более узкое:
  # «две печати ОДНОГО дерева совпадают между собой». Первый вопрос ловит
  # разъезд дерева и семени, второй — невоспроизводимость самой печати: время,
  # адреса, порядок обхода каталога, всё, что от захода к заходу разное. Дерево
  # может сойтись с семенем и при этом печатать каждый раз новое — тогда первая
  # проверка зелена, а свойство самосборки не держится. Это и есть гейт Г6.
  #
  # ПОЧЕМУ РАБОТОЙ В CI, А НЕ ПРОГОНОМ РУКАМИ. Г6 требует дословно
  # «проверяется автоматически, а не разово руками». Разовая сверка руками,
  # даже сошедшаяся, гейт не берёт: её нельзя повторить и никто не знает, что
  # именно сверяли. Прибор `scripts/two-prints-identical.sh` лежал в дереве с
  # 1 сентября 2026 и звался только руками — то есть гейта не брал.
  #
  # ── ЗАЧЕМ РАБОТА САМА ПИШЕТ «ПЕЧАТЬ КОД=» ───────────────────────────────
  #
  # Прибор считает печать законченной ТОЛЬКО по строке `ПЕЧАТЬ КОД=<код>` в
  # журнале рядом с деревом (two-prints-identical.sh, `gotova()`), и это
  # правильно: спрашивать «есть ли файл bootstrap/**» нельзя — эти файлы лежат
  # в дереве закоммиченными и до всякой печати, и прибор ответил бы «готово»
  # там, где печать не начиналась.
  #
  # Но этой строки НЕ ПИШЕТ НИКТО. Замер 2 сентября 2026:
  # `/usr/bin/grep -arl 'ПЕЧАТЬ КОД' /srv/tmp /srv/work` — 21 попадание, и все
  # до одного суть копии самих приборов в разных клонах. Ни `raskrutka.sh`, ни
  # рантайм, ни один журнал печати на машине её не пишут. Значит без этой
  # работы прибор физически не может вернуть ничего, кроме 3 «НЕ ПРОВЕРЕНО»:
  # сторож, стерегущий выдуманную строку.
  #
  # Поэтому строку дописывает ТА РАБОТА, КОТОРАЯ ПЕЧАТАЛА, — сразу после
  # печати и своим настоящим кодом возврата. Дописывать её должен тот, кто
  # знает код; всякий другой писал бы догадку.
  #
  # ── ЖУРНАЛЫ НАЗЫВАЮТСЯ ПРЯМО, А НЕ УГАДЫВАЮТСЯ ПО РАСКЛАДКЕ ─────────────
  #
  # Прежде прибор искал журнал как `ls -t <каталог>/../*.log | head -1` — самый
  # свежий `.log` рядом с деревом, — и на этом врал. ЗАМЕР 2 сентября 2026: два
  # дерева в одном родителе, рядом `pechat-1.log` с `ПЕЧАТЬ КОД=1` (печать
  # ОТКАЗАЛА) и более свежий `pechat-2.log` с `ПЕЧАТЬ КОД=0`. Прибор ответил
  # **0 — «печати совпали побайтово»**, хотя первой печати не было вовсе: отказ
  # прочёлся как успех, «не проверено» стало «сошлось».
  #
  # Прибор это чинит у себя (два журнала рядом — код 3; один журнал на две
  # печати — код 3; гадать он больше не берётся), а работа чинит у себя: она
  # НАЗЫВАЕТ журналы через `ZHURNAL_1=` и `ZHURNAL_2=`. Раскладка по разным
  # родительским каталогам оставлена, но она теперь запасная: договор — это
  # названный журнал, а не удачное расположение папок. Раскладку легко
  # нечаянно сломать правкой, и она молчит; названный журнал сломать молча
  # нельзя — прибор скажет «названный журнал не файл».
  #
  #   <база>/pervaya/derevo/   и  <база>/pervaya/pechat.log   → ZHURNAL_1
  #   <база>/vtoraya/derevo/   и  <база>/vtoraya/pechat.log   → ZHURNAL_2
  dve-pechati:
    name: reprint-reproducibility
    needs: postoyannye
    if: vars.BOLSHAYA_PAMYAT == 'da'
    runs-on: [self-hosted, bolshaya-pamyat]
    # Две печати подряд. Заход длится 8 ч 34 мин – 9 ч 56 мин (замер 31 августа
    # 2026, tasks/1310-semya-sverka-zheleza.md), на каждую даётся 11 ч — итого
    # 22 ч, и в потолок работы остаётся два часа на копии дерева, сборку семени
    # и саму сверку.
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"

      - name: Развести два дерева по разным каталогам
        env:
          BAZA: ${{ runner.temp }}/dve-pechati
        run: |
          set -u
          [ -n "$BAZA" ] || { echo "BAZA не задана" >&2; exit 2; }
          rm -rf "$BAZA"
          mkdir -p "$BAZA/pervaya/derevo" "$BAZA/vtoraya/derevo"
          # Копируется ВСЁ, вместе с .git и уже собранным bootstrap/flang:
          # печать спрашивает git, из какого коммита печатает, и отказывается
          # печатать из правленого дерева. Копия обязана быть чистой.
          cp -a "$GITHUB_WORKSPACE/." "$BAZA/pervaya/derevo/"
          cp -a "$GITHUB_WORKSPACE/." "$BAZA/vtoraya/derevo/"
          echo "первое дерево:  $BAZA/pervaya/derevo"
          echo "второе дерево:  $BAZA/vtoraya/derevo"
          # ПАРА ОБЯЗАНА БЫТЬ С ОДНОГО КОММИТА, и потому обе копии сняты с ОДНОЙ
          # выкладки, а не выложены дважды. Две печати с разных коммитов — не
          # пара: прибор сверит их и ответит про что угодно, только не про
          # воспроизводимость. Ровно так пропали прогоны af791d85 и ef718648
          # (tasks/9613-a-multi-hour-run-must-not-be-a-child-of-an-agent.md).
          #
          # Коммит НАЗЫВАЕТСЯ, а не подразумевается: у всякого числа называется
          # дерево, двоичный и коммит. И тождество копий проверяется, а не
          # берётся на веру.
          k1=$(git -C "$BAZA/pervaya/derevo" rev-parse HEAD 2>/dev/null || echo net)
          k2=$(git -C "$BAZA/vtoraya/derevo" rev-parse HEAD 2>/dev/null || echo net)
          if [ "$k1" != "$k2" ]; then
            echo "ДВЕ КОПИИ С РАЗНЫХ КОММИТОВ: $k1 и $k2 — это не пара" >&2
            exit 2
          fi
          echo "KOMMIT_PARY=$k1" >> "$GITHUB_ENV"
          echo "коммит пары: $k1"

      - name: Печать первая
        id: pechat1
        continue-on-error: true
        env:
          BAZA: ${{ runner.temp }}/dve-pechati
          FLANG: ${{ vars.FLANG_VYSOKIY }}
          FLANG_TMP: ${{ runner.temp }}
        run: |
          set -u
          ZH="$BAZA/pervaya/pechat.log"
          if ! cd "$BAZA/pervaya/derevo"; then
            echo "первого дерева нет: $BAZA/pervaya/derevo" >&2
            exit 2
          fi
          # Вывод идёт В ФАЙЛ, а не в конвейер `| tee`: после конвейера `$?` —
          # это код tee, то есть почти всегда 0, и отказ печати потерялся бы.
          #
          # `2>&1` ОБЯЗАТЕЛЬНО, а не для порядка: отметки хода печать пишет в
          # stderr (flang/src/emit/c/flang_repl.c:1557). Без него в журнале не
          # будет ни одной отметки, и `scripts/print-progress.sh` над ним
          # сказать ничего не сможет.
          timeout 39600 sh scripts/raskrutka.sh > "$ZH" 2>&1
          kod=$?
          # Строку пишем САМИ и настоящим кодом — её не пишет никто (см. выше).
          printf 'ПЕЧАТЬ КОД=%s\n' "$kod" >> "$ZH"
          if [ "$kod" -eq 124 ]; then
            echo "ПЕЧАТЬ ПЕРВАЯ УБИТА ПО ВРЕМЕНИ: 11 ч вышли, печать не кончилась." >&2
            echo "Это НЕ отказ печати и НЕ приговор — про неё не сказано ничего." >&2
          elif [ "$kod" -ne 0 ]; then
            echo "печать первая кончилась НЕ УСПЕХОМ: код $kod" >&2
          else
            echo "печать первая кончилась успехом"
          fi
          echo "PECHAT1_KOD=$kod" >> "$GITHUB_ENV"
          echo "── хвост журнала первой печати ──"
          tail -40 "$ZH"
          exit "$kod"

      - name: Печать вторая
        id: pechat2
        continue-on-error: true
        env:
          BAZA: ${{ runner.temp }}/dve-pechati
          FLANG: ${{ vars.FLANG_VYSOKIY }}
          FLANG_TMP: ${{ runner.temp }}
        run: |
          set -u
          ZH="$BAZA/vtoraya/pechat.log"
          if ! cd "$BAZA/vtoraya/derevo"; then
            echo "второго дерева нет: $BAZA/vtoraya/derevo" >&2
            exit 2
          fi
          # `2>&1` — по тому же доводу, что у первой печати: отметки хода идут
          # в stderr (flang/src/emit/c/flang_repl.c:1557).
          timeout 39600 sh scripts/raskrutka.sh > "$ZH" 2>&1
          kod=$?
          printf 'ПЕЧАТЬ КОД=%s\n' "$kod" >> "$ZH"
          if [ "$kod" -eq 124 ]; then
            echo "ПЕЧАТЬ ВТОРАЯ УБИТА ПО ВРЕМЕНИ: 11 ч вышли, печать не кончилась." >&2
            echo "Это НЕ отказ печати и НЕ приговор — про неё не сказано ничего." >&2
          elif [ "$kod" -ne 0 ]; then
            echo "печать вторая кончилась НЕ УСПЕХОМ: код $kod" >&2
          else
            echo "печать вторая кончилась успехом"
          fi
          echo "PECHAT2_KOD=$kod" >> "$GITHUB_ENV"
          echo "── хвост журнала второй печати ──"
          tail -40 "$ZH"
          exit "$kod"

      - name: Сверить две печати побайтово
        id: sverka
        continue-on-error: true
        env:
          BAZA: ${{ runner.temp }}/dve-pechati
          FLANG_TMP: ${{ runner.temp }}
        run: |
          set -u
          VYVOD="$BAZA/prigovor.txt"
          # Те же два пути, что писали шаги печати. Названы здесь ещё раз и
          # переданы прибору как ZHURNAL_1/ZHURNAL_2: пусть он берёт ИМЕННО их,
          # а не то, что подвернулось рядом с деревом.
          ZH1="$BAZA/pervaya/pechat.log"
          ZH2="$BAZA/vtoraya/pechat.log"
          if ! cd "$GITHUB_WORKSPACE"; then
            echo "рабочего каталога нет: $GITHUB_WORKSPACE" >&2
            exit 2
          fi
          echo "журнал первой печати:  $ZH1"
          echo "журнал второй печати:  $ZH2"
          # Опять В ФАЙЛ и `kod=$?` СЛЕДУЮЩЕЙ СТРОКОЙ. Прибор различает 0/1/2/3,
          # и весь смысл работы в том, чтобы этот код дошёл до приговора целым.
          ZHURNAL_1="$ZH1" ZHURNAL_2="$ZH2" timeout 1800 sh scripts/two-prints-identical.sh "$BAZA/pervaya/derevo" "$BAZA/vtoraya/derevo" > "$VYVOD" 2>&1
          kod=$?
          cat "$VYVOD"
          echo "DVE_PECHATI_KOD=$kod" >> "$GITHUB_ENV"
          exit "$kod"

      # ПЯТЬ ИСХОДОВ, И НИ ОДИН НЕ СЛИТ С ДРУГИМ.
      #
      # «Разошлись» и «не проверено» — РАЗНОЕ. Первое значит, что свойство
      # самосборки не держится: печать невоспроизводима, и это находка. Второе
      # значит, что про свойство не сказано ничего. Проверка, красящая оба
      # одинаково, врёт в обе стороны: то поднимает тревогу на пустом месте, то
      # прячет находку среди поломок машины.
      - name: Приговор
        if: always()
        env:
          BAZA: ${{ runner.temp }}/dve-pechati
          KOD: ${{ env.DVE_PECHATI_KOD }}
          KOD1: ${{ env.PECHAT1_KOD }}
          KOD2: ${{ env.PECHAT2_KOD }}
          KOMMIT: ${{ env.KOMMIT_PARY }}
        run: |
          set -u
          kod=${KOD:-net}
          kod1=${KOD1:-net}
          kod2=${KOD2:-net}
          kommit=${KOMMIT:-net}
          SVODKA=${GITHUB_STEP_SUMMARY:-/dev/null}
          # Говорится ДВАЖДЫ: в лог работы и в сводку прогона. Сводку видно, не
          # открывая логов, — а лог читают только когда уже заподозрили.
          skazat() {
            printf '%s\n' "$*"
            printf '%s\n' "$*" >> "$SVODKA"
          }
          skazat "## Две печати одного дерева совпадают побайтово"
          skazat ""
          skazat "коммит пары: $kommit"
          skazat ""
          skazat "Обе печати сняты с ОДНОЙ выкладки этого коммита. Пара с разных"
          skazat "коммитов парой не считается: сверка такой пары отвечает не про"
          skazat "воспроизводимость печати, а про разницу деревьев."
          skazat ""
          skazat "Код первой печати: \`$kod1\`. Код второй печати: \`$kod2\`."
          skazat "Код прибора \`scripts/two-prints-identical.sh\`: \`$kod\`."
          skazat ""
          skazat '```'
          if [ -f "$BAZA/prigovor.txt" ]; then
            cat "$BAZA/prigovor.txt"
            cat "$BAZA/prigovor.txt" >> "$SVODKA"
          else
            skazat "вывода прибора нет — шаг сверки до него не дошёл"
          fi
          skazat '```'
          skazat ""
          case "$kod" in
            0)
              skazat "**СОШЛИСЬ.** Два захода печати из одного дерева дали побайтово"
              skazat "одно и то же тело семени. Печать воспроизводима, и гейт Г6 на"
              skazat "ЭТОЙ паре взят — причём взят автоматически, а не разово руками."
              skazat ""
              skazat "Взят на паре, а не навсегда: свойство держится ровно до следующей"
              skazat "правки входов печати, потому эта работа и стоит в расписании."
              exit 0
              ;;
            1)
              skazat "**РАЗОШЛИСЬ. Это находка, а не поломка машины.**"
              skazat ""
              skazat "Одно дерево, два захода — и разное тело семени. Значит печать"
              skazat "НЕ ВОСПРОИЗВОДИМА: в вывод течёт что-то, чего нет во входах —"
              skazat "время, адреса, порядок обхода каталога. Главное свойство"
              skazat "самосборки на этом дереве НЕ ДЕРЖИТСЯ, и гейт Г6 не взят."
              skazat ""
              skazat "Файлы и первое расхождение названы выше. Чинить надо печать, а"
              skazat "не проверку: повтор даст то же самое."
              echo "::warning title=Две печати одного дерева РАЗОШЛИСЬ::печать невоспроизводима — одно дерево, два захода, разное тело семени; это находка, а не отказ машины; расхождения названы в сводке прогона"
              exit 1
              ;;
            2)
              skazat "**ПРИБОР ПОЗВАЛИ НЕВЕРНО.** Не два довода или названное — не каталог."
              skazat ""
              skazat "Это отказ ЭТОЙ РАБОТЫ, а не приговор печати. Про воспроизводимость"
              skazat "не сказано ничего: прибор до сверки не дошёл. Чинить надо зов в"
              skazat "\`.github/workflows/reprint.yml\`."
              echo "::warning title=Прибор сверки двух печатей позвали неверно::отказ работы CI, а не приговор печати; про воспроизводимость не сказано ничего"
              exit 2
              ;;
            3)
              skazat "**НЕ ПРОВЕРЕНО. Это НЕ «разошлись».**"
              skazat ""
              skazat "Одна из печатей не кончилась или кончилась не успехом, и сверять"
              skazat "было нечего. Про то, воспроизводима ли печать, НЕ СКАЗАНО НИЧЕГО:"
              skazat "ни «да», ни «нет». Гейт Г6 этим прогоном не взят и не провален —"
              skazat "он не задан."
              skazat ""
              skazat "Смотреть надо коды печатей выше и их журналы, а не искать"
              skazat "расхождение: расхождения никто не видел."
              echo "::warning title=Две печати не сверены — НЕ ПРОВЕРЕНО::одна из печатей не кончилась или кончилась не успехом; это не «разошлись», про воспроизводимость не сказано ничего"
              exit 3
              ;;
            124)
              skazat "**ПРИБОР УБИТ ПО ВРЕМЕНИ (код 124).** Сверка шла дольше 30 минут."
              skazat ""
              skazat "Убитый прогон — НЕ ВЕРДИКТ. Он не значит ни «сошлись», ни"
              skazat "«разошлись»: прибор не досчитал. Красное здесь стоит за"
              skazat "машину, а не за печать."
              echo "::warning title=Сверка двух печатей убита по времени::прибор не досчитал за 30 минут; убитый прогон не вердикт — ни «сошлись», ни «разошлись»"
              exit 124
              ;;
            *)
              skazat "**ШАГ СВЕРКИ НЕ ДОШЁЛ ДО ПРИБОРА** (кода нет: \`$kod\`)."
              skazat ""
              skazat "Работу сняли, машина упала или шаг отказал раньше зова. Как и"
              skazat "«не проверено», это НЕ «разошлись» — но и не «не проверено»:"
              skazat "прибор не отвечал вовсе."
              echo "::warning title=Сверка двух печатей не дошла до прибора::кода прибора нет; работу сняли или шаг отказал раньше зова"
              exit 5
              ;;
          esac
