name: Перепечатка

# ГЛАВНОЕ СВОЙСТВО САМОСБОРКИ НЕ ПРОВЕРЯЕТСЯ НИЧЕМ, И ВОТ ПОЧЕМУ.
#
# «Напечатанное совпадает с закоммиченным байт в байт» умеет проверять ровно
# одна команда — `sh scripts/raskrutka.sh --check`, и она ПЕЧАТАЕТ ЗАНОВО.
# Цена последнего дошедшего захода, 24 августа 2026 (docs/reprint-ledger.tsv,
# /srv/work/semya3.log, код 0): 5 ч 30 мин 07 с и 271 526 800 кБ пика, то есть
# 258,9 ГиБ.
#
# У раннера GitHub — 16 ГБ. Не «медленно», а НЕ ВЛЕЗАЕТ: в шестнадцать раз
# меньше того, что замерено. Поэтому работа `sverka` ниже стоит НЕ на
# ubuntu-latest, а на своём раннере с большой памятью, и включается переменной
# репозитория. Пока такого раннера нет, работа не запускается — и это честнее,
# чем зелёная галочка от работы, которая ничего не печатала.
#
# Вторая работа, `svezhest`, стоит копейки и идёт всегда: она не проверяет
# свойство, а НАЗЫВАЕТ, когда его проверяли в последний раз, и краснеет, если
# входы печати правили позже. Свойство, которое никто не проверяет, перестаёт
# быть свойством; проверка, которая об этом молчит, — вторая беда поверх первой.

on:
  schedule:
    # Раз в неделю, ночью в воскресенье. Не чаще: заход занимает машину на
    # полдня, и два одновременных её положат.
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Дёшево и всегда: когда сверку делали в последний раз ──────────────────
  svezhest:
    name: Когда побайтовую сверку делали в последний раз
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: проверка спрашивает git о дате последней правки
          # входов печати. В клоне на одну ревизию ответа нет, и проверка
          # зеленела бы от пустоты.
          fetch-depth: 0
      - run: make -C bootstrap -j"$(nproc)"
      - name: Свежесть побайтовой сверки
        run: ./bootstrap/flang io scripts/reprint-freshness.flang

  # ── Дорого и по расписанию: сама сверка ───────────────────────────────────
  #
  # Включается переменной репозитория BOLSHAYA_PAMYAT=da, и это не бюрократия:
  # работа, поставленная в очередь к несуществующему раннеру, висит до отмены и
  # выглядит как «идёт», хотя не идёт. Пусть лучше её не будет видно вовсе, чем
  # будет видно неправду.
  sverka:
    name: Семя совпадает с печатью байт в байт
    if: vars.BOLSHAYA_PAMYAT == 'da'
    runs-on: [self-hosted, bolshaya-pamyat]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - run: make -C bootstrap -j"$(nproc)"
      # Двоичный из закоммиченного семени печатать дерево СЕГОДНЯ НЕ МОЖЕТ:
      # его потолок шагов — 1 000 000 000 (bootstrap/flang_runtime.h), а самый
      # дорогой шаг печати стоит больше ста миллиардов витков (замер 29 августа
      # 2026, docs/reprint-cost.md). Поэтому печатает НЕ он, а двоичный с
      # поднятым потолком, собранный по рецепту из шапки scripts/raskrutka.sh;
      # путь к нему даёт переменная FLANG.
      #
      # Если FLANG не задан, сверка пойдёт стоковым двоичным и умрёт на потолке
      # через несколько часов. Поэтому здесь она сначала спрашивается.
      - name: Двоичный с поднятым потолком назван
        run: |
          if [ -z "${FLANG:-}" ]; then
            echo "FLANG не задан: стоковое семя печатать дерево не может (потолок 10^9," >&2
            echo "самый дорогой шаг печати — больше 10^11). Соберите двоичный по рецепту" >&2
            echo "из шапки scripts/raskrutka.sh и назовите его переменной FLANG." >&2
            exit 1
          fi
        env:
          FLANG: ${{ vars.FLANG_VYSOKIY }}
      - name: Побайтовая сверка семени с печатью
        run: sh scripts/raskrutka.sh --check
        env:
          FLANG: ${{ vars.FLANG_VYSOKIY }}
          FLANG_TMP: ${{ runner.temp }}
      # Итог заносится в ведомость руками, одной строкой: дата, «сверка», итог,
      # секунды, пик, байты, потолок, откуда. Иначе следующий не узнает, что
      # сверка была, и `svezhest` останется красной при сделанной работе.
      - name: Напомнить о ведомости
        if: always()
        run: |
          echo "Занесите итог строкой в docs/reprint-ledger.tsv — без этого"
          echo "проверка свежести останется красной при сделанной работе."
