name: Reprint

# ГЛАВНОЕ СВОЙСТВО САМОСБОРКИ — ЧТО ОДНО ДЕРЕВО ПЕЧАТАЕТ СЕБЯ ДВАЖДЫ ОДИНАКОВО —
# ПРОВЕРЯЕТСЯ ТОЛЬКО ДВУМЯ ПЕЧАТЯМИ ПОДРЯД, И ВОТ ЧТО ЭТО СТОИТ.
#
# «Напечатанное совпадает с закоммиченным байт в байт» умеет проверять ровно
# одна команда — `sh scripts/bootstrap-reprint.sh --check`, и она ПЕЧАТАЕТ ЗАНОВО.
#
# ── ПАМЯТЬ: ЗАМЕР, А НЕ МНЕНИЕ ─────────────────────────────────────────────────
# Пики дошедших печатей по пульсу самой печати (docs/reprint-ledger.tsv и
# разбор по стадиям в docs/reprint-cost.md, «По стадиям»):
#
#   партия 6, печать 1   13 октября 2026    62,1 ГиБ
#   партия 8             18 октября 2026    84,3 ГиБ
#   партия 9a            19 октября 2026    90,3 ГиБ
#
# Пик растёт вместе с деревом примерно на 4 ГиБ за партию. Раннер GitHub даёт
# 16 ГБ: не влезает впятеро. Поэтому обе дорогие работы ниже стоят на своём
# раннере с метками `self-hosted, big-memory`, и каждая печать идёт под потолком
# памяти (`ulimit -v`), чтобы раннер не ушёл в подкачку молча.
#
# ── ЧТО ДЕРЖИТ НА САМОМ ДЕЛЕ: ДЛИНА ───────────────────────────────────────────
# Потолок задания на раннере GitHub — шесть часов, а прогон однопоточный, и
# лишние ядра его не ускоряют (`Percent of CPU: 99%`).
#
# Дошедшие печати октября 2026 идут от 1 ч 48 мин (партия 6, печать 1) до
# 7 ч 48 мин (партия 8) — docs/reprint-ledger.tsv. Разница между ними — не
# работа, а печатник: стадия «Проверить доказательства» делает те же 2,6–2,8 трлн
# шагов, но двоичным партии 6 и позже — в 6–8 раз медленнее на шаг (разбор по
# стадиям в docs/reprint-cost.md, задача 6425). Потолки ниже считаны от
# САМОЙ ДОЛГОЙ дошедшей печати октября, а не от круглых чисел.
#
# ── ПОЧЕМУ НА КАЖДЫЙ ПУШ В dev, А НЕ РАЗ В НЕДЕЛЮ ────────────────────────────
# Условие 1 дороги до 1.0 (docs/road-to-1-0.md) взято, когда «сверка двух
# печатей зелёная на стволе при каждом изменении flang/self/**, без ручного
# запуска». Поэтому работа `two-prints` идёт по push в dev, когда менялись входы
# печати (`paths:` ниже), — а не только по расписанию.
#
# ── ПОЧЕМУ БЕЗ РАННЕРА РАБОТА ПАДАЕТ, А НЕ ПРОПУСКАЕТСЯ И НЕ ВИСИТ ──────────
# Прежде обе работы включались переменной репозитория (транслит
# `BOLSHAYA_PAMYAT=da`, снят 24 октября 2026 — имена переменных в этом дереве
# английские) и без неё НЕ ЗАПУСКАЛИСЬ: серая строка «Skipped», которую не
# читают. Работа, поставленная в очередь к несуществующему раннеру, — другая
# беда: она висит «в очереди» до отмены и выглядит идущей; GitHub снимает такую
# работу сам только через 24 часа.
#
# Поэтому теперь ТРИ рубежа, и ни один не молчит:
#   1. `big-memory-runner` (ubuntu-latest): переменная репозитория
#      `BIG_MEMORY_RUNNER` не равна `yes` — работа ПАДАЕТ кодом 1 и называет
#      команду регистрации раннера. Дорогие работы её ждут (`needs:`) и без неё
#      в очередь не встают.
#   2. `runner-watch` (ubuntu-latest): переменная есть, а раннер выключен —
#      через 30 минут ожидания работа ПАДАЕТ с сообщением и снимает прогон,
#      чтобы он не висел сутки. Снятый прогон несёт её ошибку в аннотациях и
#      в сводке; сделать из очереди «провал» иначе GitHub не умеет.
#   3. Сама печать идёт под `timeout` и `ulimit -v`: не дошла за срок —
#      код 124 и слова «убита по времени», а не тишина.

on:
  push:
    branches: [dev]
    paths:
      - "flang/self/**"
      - "flang/src/emit/c/**"
      - "bootstrap/**"
      - "scripts/bootstrap-reprint.sh"
      - "scripts/seed/two-prints-identical.fscript"
      - ".github/workflows/reprint.yml"
  schedule:
    # Раз в неделю, ночью в воскресенье: сверка семени со стволом (`reprint-check`)
    # идёт только отсюда и по кнопке — она не про воспроизводимость, а про
    # разъезд дерева и семени, и на каждый пуш её не зовут.
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Дёшево и всегда: состояние побайтовой сверки, вслух ───────────────────
  #
  # Состояние машины называется здесь, в работе, которая идёт ВСЕГДА, и
  # называется дважды: строкой в сводке прогона (её видно на странице прогона,
  # не открывая логов) и предупреждением-заметкой. И код возврата у работы
  # красный, пока хоть одно из двух не так: сверка устарела или считать её
  # не на чем.
  freshness:
    name: freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Нужна история: проверка спрашивает git о дате последней правки
          # входов печати. В клоне на одну ревизию ответа нет, и проверка
          # зеленела бы от пустоты.
          fetch-depth: 0
      - run: make -C bootstrap -j"$(nproc)"

      - name: Check reprint freshness
        id: freshness
        continue-on-error: true
        run: ./bootstrap/flang io scripts/seed/reprint-freshness.fscript --на-веру 2>&1 | tee /tmp/freshness.txt

      - name: Note reprint basis
        if: always()
        env:
          RUNNER_DECLARED: ${{ vars.BIG_MEMORY_RUNNER }}
        run: |
          set -u
          {
            echo "## Побайтовая сверка перепечатки"
            echo
            echo '```'
            cat /tmp/freshness.txt 2>/dev/null || echo "проверка свежести не отвечала"
            echo '```'
            echo
            if [ "${RUNNER_DECLARED:-}" = "yes" ]; then
              echo "**Машина:** раннер с большой памятью объявлен (BIG_MEMORY_RUNNER=yes);"
              echo "работа «Семя совпадает с печатью байт в байт» идёт по расписанию и по кнопке,"
              echo "работа «Две печати одного дерева совпадают побайтово» — ещё и на каждый пуш в dev,"
              echo "где менялись входы печати."
            else
              echo "**Машины нет.** Переменная репозитория \`BIG_MEMORY_RUNNER\` не равна \`yes\`:"
              echo "работа \`big-memory-runner\` этого прогона красная, и обе дорогие работы за ней"
              echo "в очередь не встали. Это провал, а не серое «Skipped»: главное свойство"
              echo "самосборки на этом пуше **не проверено ничем**."
              echo
              echo "Держит не память и не код, а железо: нужна машина с памятью не меньше"
              echo "128 ГБ (пик печати партии 9a — 90,3 ГиБ, растёт около 4 ГиБ за партию),"
              echo "одним быстрым ядром и свободная на 16 ч за прогон двух печатей."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${RUNNER_DECLARED:-}" != "yes" ]; then
            echo "::warning title=Побайтовую сверку не на чем считать::раннер с метками self-hosted, big-memory не объявлен (BIG_MEMORY_RUNNER не равна yes); работа big-memory-runner красная, печати не идут"
          fi

      - name: Report verdict
        if: always()
        env:
          RUNNER_DECLARED: ${{ vars.BIG_MEMORY_RUNNER }}
          FRESHNESS: ${{ steps.freshness.outcome }}
        run: |
          set -u
          trouble=0
          if [ "$FRESHNESS" != "success" ]; then
            echo "побайтовая сверка устарела или её не было — подробности выше" >&2
            trouble=1
          fi
          if [ "${RUNNER_DECLARED:-}" != "yes" ]; then
            echo "считать побайтовую сверку не на чем: раннера с большой памятью нет" >&2
            trouble=1
          fi
          exit "$trouble"

  # ── Дёшево и перед дорогим: печать умеет печатать то, что соберётся ───────
  #
  # 29 августа 2026 перепечатка дошла до конца впервые за заход: 6 ч 23 мин,
  # код 0, семя 40,7 МБ. И напечатанное семя не собралось СВОИМ ЖЕ Makefile —
  # строковая постоянная в 4614 знаков при обещанных C99 4095, а Makefile сам
  # просит `-pedantic -Werror`. Узнать об этом стоило шести часов печати плюс
  # 37,30 с сборки. Тот же ответ сторож даёт за 2,96 с и ДО печати: он
  # спрашивает у самого двоичного, умеет ли тот резать длинные постоянные.
  c99-limits:
    name: c99-limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Сторожу нужен ЖИВОЙ двоичный: вопрос «умеет ли печать резать» он задаёт
      # прогоном печати, а не чтением исходников.
      - run: make -C bootstrap -j"$(nproc)"
      - name: Probe long strings
        run: sh scripts/guards/overlong-string-guard.sh --подлог
        env:
          FLANG_TMP: ${{ runner.temp }}
      - name: Check long strings
        run: sh scripts/guards/overlong-string-guard.sh
        env:
          FLANG_TMP: ${{ runner.temp }}

  # ── Дёшево и перед дорогим: два имени не дают один идентификатор ──────────
  #
  # 31 августа 2026 перепечатка шла 9 ч 56 мин и упала на последней стадии от
  # пары «Занято именем модуля C++» и «Занято именем модуля C»: плюсы в
  # идентификаторе не выживают, и оба имени давали `zanyato_imenem_modulya_c`.
  # 2 сентября 2026 то же самое сожгло ещё две печати, 20 ч 54 мин на двоих.
  # Тот же ответ, что печать даёт за 580 с, здесь даётся ДО того, как машина
  # занята на полдня: двойник на flang (задача 0049), 374 с и 5,5 ГиБ.
  id-collisions:
    name: id-collisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make -C bootstrap -j"$(nproc)"
      - name: Check name collisions
        run: bootstrap/flang io scripts/guards/latin-collision-guard.fscript --на-веру --max-steps 2000000000

  # ── Дёшево и всегда: та же повторимость, но на входе побольше ─────────────
  #
  # ЧЕМ ЭТО ОТЛИЧАЕТСЯ ОТ `reprint-determinism` в `binary.yml`. Прибор тот же,
  # вход другой. На пуш ставят самый дорогой вход, чья ПАРА печатей укладывается
  # в полминуты (`flang/self/lexer.flang` — 12,21 с, 399 МиБ). Здесь можно
  # позволить вход на порядок дороже: `flang/self/emit-c.flang` — 71,77 с
  # и 1,67 ГиБ (замер 6 сентября 2026, машина отряда, bootstrap/flang 0.7.11).
  # Это НЕ замена паре печатей: до замыкания отсюда ещё два порядка. Пик
  # 1,67 ГиБ — меньше десятой доли памяти обычного раннера.
  wide-determinism:
    name: reprint-determinism-wide
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make -C bootstrap -j"$(nproc)"
      - name: Probe print determinism
        run: bootstrap/flang io scripts/seed/print-is-repeatable.fscript --plan Forgery --timeout 600000
        env:
          FLANG_TMP: ${{ runner.temp }}
      - name: Check print determinism
        run: bootstrap/flang io scripts/seed/print-is-repeatable.fscript --plan Check --timeout 1800000 -- flang/self/emit-c.flang
        env:
          FLANG_TMP: ${{ runner.temp }}

  # ── Дёшево и первым: есть ли машина, на которой считать ───────────────────
  #
  # Падает, а не пропускается. Серое «Skipped» неотличимо от «всё хорошо», а
  # очередь к несуществующему раннеру неотличима от «идёт». Красная работа с
  # командой регистрации — единственный исход, который читают.
  #
  # Как зарегистрировать раннер (решение о железе принимает владелец; команды
  # идут НА МАШИНЕ РАННЕРА, токен выдаёт `gh` с правом admin на репозиторий):
  #
  #   gh api -X POST repos/digitable-lol/flang/actions/runners/registration-token --jq .token
  #   ./config.sh --url https://github.com/digitable-lol/flang --token <токен> \
  #       --labels big-memory --name <имя-машины> --unattended
  #   sudo ./svc.sh install && sudo ./svc.sh start
  #   gh variable set BIG_MEMORY_RUNNER --body yes --repo digitable-lol/flang
  #
  # Машина: память не меньше 128 ГБ (пик печати 90,3 ГиБ, партия 9a; растёт
  # около 4 ГиБ за партию), одно быстрое ядро на печать, диск 2 ГБ под две
  # копии дерева и два семени, `cc`, `make`, `git`, `jq`; свободная на 16 ч за
  # прогон и не общая с чужой работой: раннер исполняет код веток репозитория.
  big-memory-runner:
    name: big-memory-runner
    runs-on: ubuntu-latest
    steps:
      - name: Require the declared runner
        env:
          RUNNER_DECLARED: ${{ vars.BIG_MEMORY_RUNNER }}
        run: |
          set -u
          if [ "${RUNNER_DECLARED:-}" = "yes" ]; then
            echo "раннер с метками self-hosted, big-memory объявлен переменной BIG_MEMORY_RUNNER=yes"
            exit 0
          fi
          {
            echo "## Раннера с большой памятью нет"
            echo
            echo "Переменная репозитория \`BIG_MEMORY_RUNNER\` не равна \`yes\`. Две печати одного"
            echo "дерева и сверка семени со стволом на этом прогоне НЕ ШЛИ: считать их не на чем."
            echo
            echo "Зарегистрировать раннер (на машине с памятью не меньше 128 ГБ, см. шапку"
            echo "\`.github/workflows/reprint.yml\`) и поставить переменную:"
            echo
            echo '```'
            echo "gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runners/registration-token --jq .token"
            echo "./config.sh --url https://github.com/${GITHUB_REPOSITORY} --token <токен> --labels big-memory --name <имя> --unattended"
            echo "gh variable set BIG_MEMORY_RUNNER --body yes --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Раннера с большой памятью нет::переменная BIG_MEMORY_RUNNER не равна yes; две печати одного дерева на этом пуше не шли — команда регистрации в сводке прогона"
          exit 1

  # ── Дёшево и рядом с дорогим: раннер объявлен, но взял ли он работу ────────
  #
  # Переменная говорит «раннер есть», а раннер может быть выключен. Тогда
  # `two-prints` стоит в очереди, прогон «идёт», и так — сутки, пока GitHub не
  # снимет работу сам. Эта работа спрашивает у GitHub состояние `two-prints`
  # раз в минуту и через 30 минут очереди ПАДАЕТ с сообщением и снимает прогон.
  # Снятый прогон несёт её ошибку в аннотациях и сводке — сделать из очереди
  # «провал» иначе нельзя: у работы, которая не началась, нет кода возврата.
  # Право `actions: write` нужно только этой работе и только ради `cancel`.
  runner-watch:
    name: runner-watch
    needs: big-memory-runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait for the runner to take the prints
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHED: reprint-reproducibility
          MINUTES: "30"
        run: |
          set -u
          minute=0
          while [ "$minute" -lt "$MINUTES" ]; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"${WATCHED}\") | .status" 2>/dev/null | head -1)
            case "${status:-}" in
              in_progress|completed)
                echo "работа «${WATCHED}» взята раннером: ${status} (через ${minute} мин)"
                exit 0
                ;;
            esac
            minute=$((minute + 1))
            sleep 60
          done
          {
            echo "## Раннер объявлен, но работу не взял"
            echo
            echo "Работа «${WATCHED}» простояла в очереди ${MINUTES} минут: раннер с метками"
            echo "\`self-hosted, big-memory\` выключен или занят. Прогон снят, чтобы не висеть"
            echo "сутки; про воспроизводимость печати НЕ СКАЗАНО НИЧЕГО."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Раннер не взял печать за ${MINUTES} минут::работа ${WATCHED} стоит в очереди; раннер self-hosted, big-memory выключен или занят; прогон снят, про воспроизводимость не сказано ничего"
          exit 1

      - name: Stop the run that nobody will take
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"

  # ── Дорого и по расписанию: семя совпадает с печатью ──────────────────────
  #
  # Спрашивает «печать совпадает с ЗАКОММИЧЕННЫМ семенем». На пуш не зовётся:
  # это вопрос о разъезде дерева и семени, а не о воспроизводимости, и он
  # стоит ещё одну печать поверх двух.
  reprint-check:
    name: reprint-check
    needs: [c99-limits, id-collisions, big-memory-runner]
    # Раннер общий с хозяином, и защита не должна держаться на одном отсутствии
    # триггера pull_request (задача 9971) — она держится ещё и здесь, на каждой
    # self-hosted работе одинаково.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, big-memory]
    # Одна печать: 16 ч — вдвое дольше самой долгой дошедшей печати октября
    # 2026 (7 ч 48 мин, партия 8); сборка семени и пробы — ещё час.
    timeout-minutes: 1020
    steps:
      # ВСЯ ИСТОРИЯ, А НЕ ОДИН КОММИТ: шаг «Check seed against the trunk» ниже
      # спрашивает git, лежит ли коммит отпечатка в стволе. На обрезанном клоне
      # ответа нет — проверка отвечает кодом 5 «ПРОВЕРИТЬ НЕ УДАЛОСЬ».
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: make -C bootstrap -j"$(nproc)"
      # ДЁШЕВЫЙ ВОПРОС ДО ДОРОГОГО, А НЕ ПОСЛЕ (задачи 1426, 8567): если
      # отпечаток дерева уже не сходится со стволом, печать пропадёт, а
      # узнается это через полсуток. Этот шаг задаёт тот же вопрос за секунды.
      - name: Check seed against the trunk
        run: sh scripts/bootstrap-reprint.sh --bystro
        env:
          FLANG_TMP: ${{ runner.temp }}
      # FLANG НЕОБЯЗАТЕЛЕН: назван — печатает он (переменная репозитория
      # FLANG_PRINTER, путь к двоичному с поднятым потолком шагов на машине
      # раннера), не назван — печатает семя, и об этом говорится вслух.
      - name: Note binary used
        run: |
          if [ -n "${FLANG:-}" ]; then
            echo "печатает двоичный из FLANG_PRINTER: $FLANG"
          else
            echo "FLANG_PRINTER не задан — печатает семя bootstrap/flang."
            echo "Его потолок шагов:"
            grep '#define FL_MAX_STEPS' bootstrap/flang_runtime.h
          fi
        env:
          FLANG: ${{ vars.FLANG_PRINTER }}
      - name: Check seed reprint
        env:
          FLANG: ${{ vars.FLANG_PRINTER }}
          FLANG_TMP: ${{ runner.temp }}
          MEMORY_CEILING_GB: ${{ vars.PRINT_MEMORY_CEILING_GB || '140' }}
        run: |
          set -u
          ulimit -v $((MEMORY_CEILING_GB * 1024 * 1024))
          timeout 57600 sh scripts/bootstrap-reprint.sh --check
      # Итог заносится в ведомость руками, одной строкой: дата, «сверка», итог,
      # секунды, пик, байты, потолок, откуда. Иначе следующий не узнает, что
      # сверка была, и `freshness` останется красной при сделанной работе.
      - name: Remind about ledger
        if: always()
        run: |
          echo "Занесите итог строкой в docs/reprint-ledger.tsv — без этого"
          echo "проверка свежести останется красной при сделанной работе."

  # ── Дорого и на каждый пуш во входы печати: печатает ли дерево дважды ОДНО И ТО ЖЕ
  #
  # ЧЕМ ЭТА РАБОТА ОТЛИЧАЕТСЯ ОТ `reprint-check` ВЫШЕ. Та спрашивает «печать
  # совпадает с ЗАКОММИЧЕННЫМ семенем». Эта спрашивает другое и более узкое:
  # «две печати ОДНОГО дерева совпадают между собой». Первый вопрос ловит
  # разъезд дерева и семени, второй — невоспроизводимость самой печати: время,
  # адреса, порядок обхода каталога, всё, что от захода к заходу разное. Это
  # и есть гейт Г6 и условие 1 дороги до 1.0.
  #
  # ЗАЧЕМ РАБОТА САМА ПИШЕТ «ПЕЧАТЬ КОД=». Прибор считает печать законченной
  # ТОЛЬКО по строке `ПЕЧАТЬ КОД=<код>` в журнале рядом с деревом
  # (two-prints-identical.fscript): файлы bootstrap/** лежат в дереве
  # закоммиченными и до всякой печати, и по ним прибор ответил бы «готово» там,
  # где печать не начиналась. Строку дописывает ТА РАБОТА, КОТОРАЯ ПЕЧАТАЛА, —
  # своим настоящим кодом возврата. Всякий другой писал бы догадку.
  #
  # ЖУРНАЛЫ НАЗЫВАЮТСЯ ПРЯМО, А НЕ УГАДЫВАЮТСЯ ПО РАСКЛАДКЕ. 2 сентября 2026
  # прибор, бравший «самый свежий .log рядом с деревом», прочёл отказ печати
  # как успех. Теперь журналы НАЗЫВАЮТСЯ через `FLANG_PRINT_LOG_1=` и
  # `FLANG_PRINT_LOG_2=`; раскладка оставлена как запасная:
  #
  #   <base>/first/tree/    и  <base>/first/print.log    → FLANG_PRINT_LOG_1
  #   <base>/second/tree/   и  <base>/second/print.log   → FLANG_PRINT_LOG_2
  two-prints:
    name: reprint-reproducibility
    needs: [c99-limits, big-memory-runner]
    # Тот же довод, что у `reprint-check` выше и у задачи 9971 для binary.yml —
    # защита не должна держаться на одном отсутствии триггера pull_request.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, big-memory]
    # ДВЕ ПЕЧАТИ ПОДРЯД, И ПОТОЛОК СЧИТАН ОТ ИЗМЕРЕННОГО, А НЕ ОТ ОКРУГЛОГО.
    # На печать даётся 16 ч (`PRINT_SECONDS` ниже) — вдвое дольше самой долгой
    # дошедшей печати октября 2026 (7 ч 48 мин, партия 8, docs/reprint-ledger.tsv);
    # итого 32 ч, и в потолок работы остаются три часа на копии дерева, сборку
    # семени и саму сверку. Прежние 48 ч на печать считались от захода 23–25
    # сентября (35 ч 45 мин) на машине втрое медленнее; та строка ведомости
    # старше всех октябрьских и в потолок больше не берётся.
    timeout-minutes: 2100
    env:
      # Потолок памяти на одну печать, ГиБ: 140 — это пик партии 9a (90,3 ГиБ)
      # с запасом в полтора раза. `ulimit -v` режет виртуальную память, она
      # выше резидентной; упёршись, печать падает с ошибкой выделения, а не
      # уводит раннер в подкачку. Переопределяется переменной репозитория.
      MEMORY_CEILING_GB: ${{ vars.PRINT_MEMORY_CEILING_GB || '140' }}
      PRINT_SECONDS: "57600"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make -C bootstrap -j"$(nproc)"

      - name: Prepare two trees
        env:
          BASE: ${{ runner.temp }}/two-prints
        run: |
          set -u
          [ -n "$BASE" ] || { echo "BASE не задана" >&2; exit 2; }
          rm -rf "$BASE"
          mkdir -p "$BASE/first/tree" "$BASE/second/tree"
          # Копируется ВСЁ, вместе с .git и уже собранным bootstrap/flang:
          # печать спрашивает git, из какого коммита печатает, и отказывается
          # печатать из правленого дерева. Копия обязана быть чистой.
          cp -a "$GITHUB_WORKSPACE/." "$BASE/first/tree/"
          cp -a "$GITHUB_WORKSPACE/." "$BASE/second/tree/"
          echo "первое дерево:  $BASE/first/tree"
          echo "второе дерево:  $BASE/second/tree"
          # ПАРА ОБЯЗАНА БЫТЬ С ОДНОГО КОММИТА, и потому обе копии сняты с ОДНОЙ
          # выкладки. Две печати с разных коммитов — не пара (задача 9613).
          # Тождество копий проверяется, а не берётся на веру.
          first=$(git -C "$BASE/first/tree" rev-parse HEAD 2>/dev/null || echo none)
          second=$(git -C "$BASE/second/tree" rev-parse HEAD 2>/dev/null || echo none)
          if [ "$first" != "$second" ]; then
            echo "ДВЕ КОПИИ С РАЗНЫХ КОММИТОВ: $first и $second — это не пара" >&2
            exit 2
          fi
          echo "PAIR_COMMIT=$first" >> "$GITHUB_ENV"
          echo "коммит пары: $first"

      - name: First print
        id: first
        continue-on-error: true
        env:
          BASE: ${{ runner.temp }}/two-prints
          FLANG: ${{ vars.FLANG_PRINTER }}
          FLANG_TMP: ${{ runner.temp }}
        run: |
          set -u
          LOG="$BASE/first/print.log"
          if ! cd "$BASE/first/tree"; then
            echo "первого дерева нет: $BASE/first/tree" >&2
            exit 2
          fi
          ulimit -v $((MEMORY_CEILING_GB * 1024 * 1024))
          # Вывод идёт В ФАЙЛ, а не в конвейер `| tee`: после конвейера `$?` —
          # это код tee, то есть почти всегда 0, и отказ печати потерялся бы.
          # `2>&1` ОБЯЗАТЕЛЬНО: отметки хода печать пишет в stderr
          # (flang/src/emit/c/flang_repl.c, repl_hod_say), и без него по журналу
          # нечего будет разложить по стадиям (scripts/seed/print-stages.fscript).
          timeout "$PRINT_SECONDS" sh scripts/bootstrap-reprint.sh > "$LOG" 2>&1
          code=$?
          # Строку пишем САМИ и настоящим кодом — её не пишет никто (см. выше).
          printf 'ПЕЧАТЬ КОД=%s\n' "$code" >> "$LOG"
          if [ "$code" -eq 124 ]; then
            echo "ПЕЧАТЬ ПЕРВАЯ УБИТА ПО ВРЕМЕНИ: $PRINT_SECONDS с вышли, печать не кончилась." >&2
            echo "Это НЕ отказ печати и НЕ приговор — про неё не сказано ничего." >&2
          elif [ "$code" -ne 0 ]; then
            echo "печать первая кончилась НЕ УСПЕХОМ: код $code" >&2
          else
            echo "печать первая кончилась успехом"
          fi
          echo "PRINT1_CODE=$code" >> "$GITHUB_ENV"
          echo "── хвост журнала первой печати ──"
          tail -40 "$LOG"
          exit "$code"

      - name: Second print
        id: second
        continue-on-error: true
        env:
          BASE: ${{ runner.temp }}/two-prints
          FLANG: ${{ vars.FLANG_PRINTER }}
          FLANG_TMP: ${{ runner.temp }}
        run: |
          set -u
          LOG="$BASE/second/print.log"
          if ! cd "$BASE/second/tree"; then
            echo "второго дерева нет: $BASE/second/tree" >&2
            exit 2
          fi
          ulimit -v $((MEMORY_CEILING_GB * 1024 * 1024))
          timeout "$PRINT_SECONDS" sh scripts/bootstrap-reprint.sh > "$LOG" 2>&1
          code=$?
          printf 'ПЕЧАТЬ КОД=%s\n' "$code" >> "$LOG"
          if [ "$code" -eq 124 ]; then
            echo "ПЕЧАТЬ ВТОРАЯ УБИТА ПО ВРЕМЕНИ: $PRINT_SECONDS с вышли, печать не кончилась." >&2
            echo "Это НЕ отказ печати и НЕ приговор — про неё не сказано ничего." >&2
          elif [ "$code" -ne 0 ]; then
            echo "печать вторая кончилась НЕ УСПЕХОМ: код $code" >&2
          else
            echo "печать вторая кончилась успехом"
          fi
          echo "PRINT2_CODE=$code" >> "$GITHUB_ENV"
          echo "── хвост журнала второй печати ──"
          tail -40 "$LOG"
          exit "$code"

      # Разбор по стадиям обеих печатей — в сводку, тем же прибором, что и в
      # docs/reprint-cost.md: видно, какая стадия сколько шла, не открывая логов.
      - name: Break the prints down by stage
        if: always()
        env:
          BASE: ${{ runner.temp }}/two-prints
        run: |
          set -u
          for side in first second; do
            log="$BASE/$side/print.log"
            [ -f "$log" ] || continue
            {
              echo "### По стадиям: печать $side"
              echo
              bootstrap/flang io scripts/seed/print-stages.fscript --plan Check --timeout 600000 -- "$log" 2>/dev/null | grep '^{' | jq -r '.result // .error'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Compare two prints
        id: compare
        continue-on-error: true
        env:
          BASE: ${{ runner.temp }}/two-prints
          FLANG_TMP: ${{ runner.temp }}
        run: |
          set -u
          VERDICT="$BASE/verdict.txt"
          LOG1="$BASE/first/print.log"
          LOG2="$BASE/second/print.log"
          if ! cd "$GITHUB_WORKSPACE"; then
            echo "рабочего каталога нет: $GITHUB_WORKSPACE" >&2
            exit 2
          fi
          echo "журнал первой печати:  $LOG1"
          echo "журнал второй печати:  $LOG2"
          # Опять В ФАЙЛ и `code=$?` СЛЕДУЮЩЕЙ СТРОКОЙ. Прибор различает 0/1/2/3,
          # и весь смысл работы в том, чтобы этот код дошёл до приговора целым.
          FLANG_PRINT_LOG_1="$LOG1" FLANG_PRINT_LOG_2="$LOG2" timeout 1800 bootstrap/flang io scripts/seed/two-prints-identical.fscript --plan Check --timeout 1800000 -- "$BASE/first/tree" "$BASE/second/tree" > "$VERDICT.raw" 2>&1
          code=$?
          grep '^{' "$VERDICT.raw" | jq -r '.result // .error' > "$VERDICT"
          [ -s "$VERDICT" ] || cp "$VERDICT.raw" "$VERDICT"
          cat "$VERDICT"
          echo "COMPARE_CODE=$code" >> "$GITHUB_ENV"
          exit "$code"

      # ПЯТЬ ИСХОДОВ, И НИ ОДИН НЕ СЛИТ С ДРУГИМ. «Разошлись» и «не проверено»
      # — РАЗНОЕ: первое значит, что свойство самосборки не держится, второе —
      # что про свойство не сказано ничего. Проверка, красящая оба одинаково,
      # врёт в обе стороны.
      - name: Report verdict
        if: always()
        env:
          BASE: ${{ runner.temp }}/two-prints
          CODE: ${{ env.COMPARE_CODE }}
          CODE1: ${{ env.PRINT1_CODE }}
          CODE2: ${{ env.PRINT2_CODE }}
          COMMIT: ${{ env.PAIR_COMMIT }}
        run: |
          set -u
          code=${CODE:-none}
          code1=${CODE1:-none}
          code2=${CODE2:-none}
          commit=${COMMIT:-none}
          SUMMARY=${GITHUB_STEP_SUMMARY:-/dev/null}
          # Говорится ДВАЖДЫ: в лог работы и в сводку прогона. Сводку видно, не
          # открывая логов, — а лог читают только когда уже заподозрили.
          say() {
            printf '%s\n' "$*"
            printf '%s\n' "$*" >> "$SUMMARY"
          }
          say "## Две печати одного дерева совпадают побайтово"
          say ""
          say "коммит пары: $commit"
          say ""
          say "Обе печати сняты с ОДНОЙ выкладки этого коммита. Пара с разных"
          say "коммитов парой не считается."
          say ""
          say "Код первой печати: \`$code1\`. Код второй печати: \`$code2\`."
          say "Код прибора \`scripts/seed/two-prints-identical.fscript\`: \`$code\`."
          say ""
          say '```'
          if [ -f "$BASE/verdict.txt" ]; then
            cat "$BASE/verdict.txt"
            cat "$BASE/verdict.txt" >> "$SUMMARY"
          else
            say "вывода прибора нет — шаг сверки до него не дошёл"
          fi
          say '```'
          say ""
          case "$code" in
            0)
              say "**СОШЛИСЬ.** Два захода печати из одного дерева дали побайтово"
              say "одно и то же тело семени. Печать воспроизводима, и условие 1 дороги"
              say "до 1.0 на ЭТОМ коммите взято — автоматически, а не разово руками."
              exit 0
              ;;
            1)
              say "**РАЗОШЛИСЬ. Это находка, а не поломка машины.**"
              say ""
              say "Одно дерево, два захода — и разное тело семени. Значит печать"
              say "НЕ ВОСПРОИЗВОДИМА: в вывод течёт что-то, чего нет во входах."
              say "Файлы и первое расхождение названы выше. Чинить надо печать, а"
              say "не проверку: повтор даст то же самое."
              echo "::warning title=Две печати одного дерева РАЗОШЛИСЬ::печать невоспроизводима — одно дерево, два захода, разное тело семени; расхождения названы в сводке прогона"
              exit 1
              ;;
            2)
              say "**ПРИБОР ПОЗВАЛИ НЕВЕРНО.** Не два довода или названное — не каталог."
              say "Это отказ ЭТОЙ РАБОТЫ, а не приговор печати. Чинить надо зов в"
              say "\`.github/workflows/reprint.yml\`."
              echo "::warning title=Прибор сверки двух печатей позвали неверно::отказ работы CI, а не приговор печати; про воспроизводимость не сказано ничего"
              exit 2
              ;;
            3)
              say "**НЕ ПРОВЕРЕНО. Это НЕ «разошлись».**"
              say ""
              say "Одна из печатей не кончилась или кончилась не успехом, и сверять"
              say "было нечего. Смотреть надо коды печатей выше и их журналы."
              echo "::warning title=Две печати не сверены — НЕ ПРОВЕРЕНО::одна из печатей не кончилась или кончилась не успехом; это не «разошлись», про воспроизводимость не сказано ничего"
              exit 3
              ;;
            124)
              say "**ПРИБОР УБИТ ПО ВРЕМЕНИ (код 124).** Сверка шла дольше 30 минут."
              say "Убитый прогон — НЕ ВЕРДИКТ: прибор не досчитал."
              echo "::warning title=Сверка двух печатей убита по времени::прибор не досчитал за 30 минут; убитый прогон не вердикт"
              exit 124
              ;;
            *)
              say "**ШАГ СВЕРКИ НЕ ДОШЁЛ ДО ПРИБОРА** (кода нет: \`$code\`)."
              say "Работу сняли, машина упала или шаг отказал раньше зова."
              echo "::warning title=Сверка двух печатей не дошла до прибора::кода прибора нет; работу сняли или шаг отказал раньше зова"
              exit 5
              ;;
          esac
