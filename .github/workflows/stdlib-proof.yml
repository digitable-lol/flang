name: Ведомость по библиотеке

# ОТЧЁТ О ДОКАЗАТЕЛЬСТВАХ НЕ СНИМАЛСЯ С ДВУХ МОДУЛЕЙ БИБЛИОТЕКИ, И ЭТОГО НЕ
# ВИДЕЛ НИКТО ПОЛТОРА МЕСЯЦА.
#
# `flang check --proof flang/stdlib/math-classics.flang` выходил кодом 1 с
# ПУСТЫМ стандартным выводом: ведомости не печаталось ни строки. Обычный
# `flang check` того же файла был зелен, печать в C — зелена, и все проверки
# дерева оставались зелены вместе с ними. Причина ровно одна: НИ ОДНА проверка
# не звала `--proof` по стандартной библиотеке. Молчал только отчёт, и увидеть
# это мог лишь тот, кто отчёт позвал руками (задача 8455).
#
# Прогон 19 сентября 2026 показал, что модуля таких ДВА, а не один: тем же
# обещанием падал `numbers.flang`. Это и есть цена непозванной проверки —
# второй случай не был известен, пока проверку не позвали.
#
# ── ЦЕНА, СНЯТАЯ СВОИМ ПРОГОНОМ 19 сентября 2026 ───────────────────────────
# Машина 256 ядер, шла чужая работа; двоичный 0.7.20, собран
# `make -C bootstrap CFLAGS='-std=c99 -O0'` за 1 мин 13 с. Прогон
# `check --proof` по всем 51 модулю библиотеки, по восемь разом:
#
#   ЧИСЛА-ПРОГОН
#
# Числа сняты на 256-ядерной машине; у раннера GitHub два ядра, и там прогон
# идёт по два разом, а не по восемь. Считать эти числа потолком нельзя — они
# пол.
#
# ── ПОЧЕМУ ПО РАСПИСАНИЮ, А НЕ НА ПУШ ──────────────────────────────────────
# Граница дерева объявлена до всяких замеров (ci.yml, шапка): работа дороже
# ПЯТИ МИНУТ стенного времени вместе со сборкой семени на каждый пуш не идёт.
# Здесь одна только сборка семени стоит 1 мин 13 с, а прогон — ЦЕНА-СТЕННАЯ,
# то есть граница перекрыта в разы. Поэтому дорогая половина стоит здесь, по
# расписанию, а ДЕШЁВАЯ половина того же сторожа (`--скобки`, 0,3 с, двоичного
# не надо) ушла на каждый пуш в ci.yml и в хук перед пушем: она ловит ту форму
# записи, на которой стояла беда 8455, ещё до того, как та доедет до отчёта.
#
# Час выбран вне окон других расписаний: reprint.yml — воскресенье 02:00 UTC,
# dvoyniki.yml — понедельник 04:00 UTC, install-path.yml — ежедневно 04:17 UTC,
# provability.yml — ежедневно 05:23 UTC.
#
# ── ПОЧЕМУ РАБОТА ЗЕЛЕНА, ХОТЯ БЕДА ЖИВА ───────────────────────────────────
# Сторож — ХРАПОВИК, а не порог: модули, с которых ведомость не снимается,
# названы поимённо в scripts/ledgers/stdlib-proof-debt.tsv с кодом и причиной,
# и работа краснеет в обе стороны — на новом отказе («ПРИБАВИЛОСЬ») и на
# закрытом долге, чья запись осталась («НАДГРОБИЕ»).
#
# Вечно красная работа — это выключенная работа (довод стоит в шапке
# dvoyniki.yml и не выдуман здесь заново). Правка задачи 8455 лежит в
# flang/self/zapis.flang и доезжает до двоичного только перепечаткой семени
# (scripts/raskrutka.sh, около 11 часов), а не пересевом; до перепечатки
# `math-classics` и `numbers` отказывают у любого собранного двоичного. После
# перепечатки обе строки станут надгробиями, работа покраснеет и попросит их
# убрать — это и есть то, ради чего храповик заводится.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vedomost:
    name: stdlib-proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make -C bootstrap -j"$(nproc)"
      - name: сторож краснеет на подложенной дизъюнкции без скобок
        run: |
          set -u
          if sh scripts/guards/stdlib-proof-guard.sh --подлог-скобки; then
            echo "сторож промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi
        env:
          FLANG_TMP: ${{ runner.temp }}
      - name: сторож краснеет на подложенном модуле с необеспеченным обещанием
        run: |
          set -u
          if sh scripts/guards/stdlib-proof-guard.sh --подлог; then
            echo "сторож промолчал на подлоге — проверять им нечего" >&2
            exit 1
          fi
        env:
          FLANG_TMP: ${{ runner.temp }}
      - name: ведомость доказательств снимается с каждого модуля библиотеки
        run: |
          set +e
          export LC_ALL=C.UTF-8
          log="$RUNNER_TEMP/stdlib-proof.log"
          PARALLEL=$(nproc) sh scripts/guards/stdlib-proof-guard.sh --check > "$log" 2>&1
          kod=$?
          cat "$log"
          {
            echo "## Ведомость по библиотеке — код $kod"
            echo
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$kod"
        env:
          FLANG_TMP: ${{ runner.temp }}
