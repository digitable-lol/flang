name: Typing holes search

on:
  schedule:
    - cron: "41 3 * * *"
    - cron: "41 4 * * 0"
  pull_request:
    paths:
      - "scripts/fuzz/**"
      - ".github/workflows/typing-holes-fuzz.yml"
      - "flang/proof/tables/typing-holes.tsv"
  workflow_dispatch:
    inputs:
      seed:
        description: "first seed of the moving half (empty = from the clock)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  fuzz:
    name: typing-holes-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build bootstrap
        run: make -C bootstrap -j"$(nproc)"
      - name: Build proof checker
        run: make -C flang/proof/checker

      - name: Oracles turn red on planted holes
        run: bootstrap/flang run-script typing-holes:selftest -- "$RUNNER_TEMP/selftest"

      - name: Fixed seeds 1..600
        if: github.event.schedule != '41 4 * * 0'
        run: |
          set +e
          bootstrap/flang run-script typing-holes:campaign \
            -- "$RUNNER_TEMP/fixed" 1 600 "$(nproc)" c 10 5 > "$RUNNER_TEMP/fixed.json" 2>&1
          kod=$?
          cat "$RUNNER_TEMP/fixed/summary.txt" 2>/dev/null || cat "$RUNNER_TEMP/fixed.json"
          { echo "## Неподвижные зёрна 1..600 — код $kod"; echo; echo '```'; cat "$RUNNER_TEMP/fixed/summary.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$kod" > "$RUNNER_TEMP/fixed.code"

      - name: Moving seeds
        if: github.event.schedule != '41 4 * * 0'
        run: |
          set +e
          seed="${{ github.event.inputs.seed }}"
          [ -n "$seed" ] || seed=$(( $(date +%s) % 2000000000 + 1000 ))
          bootstrap/flang run-script typing-holes:campaign \
            -- "$RUNNER_TEMP/moving" "$seed" 600 "$(nproc)" c 10 5 > "$RUNNER_TEMP/moving.json" 2>&1
          kod=$?
          cat "$RUNNER_TEMP/moving/summary.txt" 2>/dev/null || cat "$RUNNER_TEMP/moving.json"
          { echo "## Зёрна от $seed — код $kod"; echo; echo '```'; cat "$RUNNER_TEMP/moving/summary.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$kod" > "$RUNNER_TEMP/moving.code"

      - name: Proof records of the tree
        if: github.event.schedule == '41 4 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          set +e
          bootstrap/flang run-script typing-holes:campaign \
            -- "$RUNNER_TEMP/corpus" corpus 0 "$(nproc)" > "$RUNNER_TEMP/corpus.json" 2>&1
          kod=$?
          cat "$RUNNER_TEMP/corpus/summary.txt" 2>/dev/null || cat "$RUNNER_TEMP/corpus.json"
          { echo "## Записи доказательств дерева — код $kod"; echo; echo '```'; cat "$RUNNER_TEMP/corpus/summary.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$kod" > "$RUNNER_TEMP/corpus.code"

      - name: Keep findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typing-holes-findings
          path: |
            ${{ runner.temp }}/*/p/*/finding-*.txt
            ${{ runner.temp }}/*/p/*/prog.flang
            ${{ runner.temp }}/*/summary.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Verdict
        run: |
          bad=0
          for k in fixed moving corpus; do
            [ -f "$RUNNER_TEMP/$k.code" ] || continue
            c=$(cat "$RUNNER_TEMP/$k.code")
            echo "$k: $c (0 nothing new, 1 findings, 3 the search could not look)"
            [ "$c" -eq 0 ] || bad=1
          done
          exit $bad
