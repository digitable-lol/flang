name: "FTS check"
description: >-
  Compiles, validates, and runs the executable examples of every FTS model
  touched in a change, and annotates any diagnostic inline in the diff.
author: "FTS"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  paths:
    description: >-
      Newline- or comma-separated glob patterns (supporting * and **)
      selecting which .fts files to check, relative to the repository root.
      Defaults to every .fts file in the repository.
    required: false
    default: "**/*.fts"
  changed-only:
    description: >-
      When "true", only check .fts files that differ from the pull request
      base (via `git diff --name-only`) instead of every file matched by
      `paths`. Requires the checkout to have enough history to reach the base
      ref (e.g. actions/checkout with fetch-depth: 0, or fetch-depth: 2+ on a
      push).
    required: false
    default: "false"
  fail-on-warning:
    description: >-
      When "true", warning-severity diagnostics also fail the action. By
      default only error-severity diagnostics do.
    required: false
    default: "false"
  ftsc:
    description: >-
      When "true", also run `ftsc check` over the repository root to validate
      module imports and functors between FTS modules, provided tools/ftsc is
      present in this checkout. Silently skipped otherwise.
    required: false
    default: "false"
  ftspec:
    description: >-
      When "true", also run `ftspec check` over the repository root to
      validate a specification corpus, provided tools/ftspec is present in
      this checkout. Silently skipped otherwise.
    required: false
    default: "false"
  summary:
    description: >-
      When "true", write a per-model "model — examples converge —
      diagnostics" table to the job summary.
    required: false
    default: "true"

outputs:
  models:
    description: "Number of FTS models (files) checked."
  diagnostics:
    description: "Total number of diagnostics (errors + warnings) reported."
  errors:
    description: "Number of error-severity diagnostics."
  warnings:
    description: "Number of warning-severity diagnostics."
  examples-failed:
    description: "Number of executable examples whose actual result did not match the expected one."

runs:
  using: "node20"
  main: ".github/actions/fts-check/index.mjs"
