# Заготовка записи для github-linguist/linguist, языка flang.
#
# СОСТОЯНИЕ: подавать РАНО. Linguist требует «широкого использования на
# публичных репозиториях» — сотни репозиториев на расширение, либо более 2000
# результатов поиска при широком разбросе. Дословно из их CONTRIBUTING:
# «PRs for very new or hobby languages will be closed.» У нас один репозиторий,
# и подача сегодня будет закрыта.
#
# Что должно быть готово к подаче, кроме числа репозиториев:
#   1. Грамматика для подсветки (TextMate или tree-sitter). В дереве нет ни
#      одной. Это отдельная работа и она обязательна: без грамматики запись не
#      примут.
#   2. Образцы кода — editors/linguist/samples/; каталога сегодня нет.
#   3. Поисковый запрос, показывающий использование в дикой природе.
#
# `language_id` намеренно не заполнен: его назначают сопровождающие Linguist
# командой script/update-ids при приёме, и потом он не меняется никогда.
#
# Вставлять в алфавитном порядке.

flang:
  type: programming
  color: "#00e5e5"
  # Расширений у языка четыре и они равноправны (ADR-0016): `.flang` —
  # основное, `.fp` — короткое, `.фп` — «функциональная программа», `.фланг` —
  # она же длинной кириллицей. Первым стоит `.flang`: у Linguist порядок в
  # списке — это порядок предпочтения, и primary_extension берётся первым.
  #
  # `.фп` и `.фланг` вне ASCII, и это отдельный разговор с сопровождающими
  # Linguist: их собственные проверки такого расширения в дереве ещё не видели.
  # Если запись примут без них — язык от этого не меняется, кириллические
  # расширения останутся законными у компилятора и у редакторов, просто GitHub
  # не покрасит файл.
  extensions:
  - ".flang"
  - ".fp"
  - ".фп"
  - ".фланг"
  tm_scope: source.flang
  ace_mode: text
  # language_id назначает Linguist — не заполнять
