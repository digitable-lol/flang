# Заготовка записи для github-linguist/linguist, языка flang.
#
# СОСТОЯНИЕ: подавать РАНО. Linguist требует «широкого использования на
# публичных репозиториях» — сотни репозиториев на расширение, либо более 2000
# результатов поиска при широком разбросе. Дословно из их CONTRIBUTING:
# «PRs for very new or hobby languages will be closed.» У нас один репозиторий,
# и подача сегодня будет закрыта.
#
# Что должно быть готово к подаче, кроме числа репозиториев:
#   1. Грамматика для подсветки (TextMate или tree-sitter). Сегодня в дереве
#      есть грамматики для .fts (editors/tree-sitter-fts, editors/vscode-fts,
#      editors/chroma/fts.xml), и НИ ОДНА не покрывает .flang. Это отдельная
#      работа и она обязательна: без грамматики запись не примут.
#   2. Образцы кода — editors/linguist/samples/, сейчас там только .fts.
#   3. Поисковый запрос, показывающий использование в дикой природе.
#
# `language_id` намеренно не заполнен: его назначают сопровождающие Linguist
# командой script/update-ids при приёме, и потом он не меняется никогда.
#
# Вставлять в алфавитном порядке.

flang:
  type: programming
  color: "#00e5e5"
  extensions:
  - ".flang"
  tm_scope: source.flang
  ace_mode: text
  # language_id назначает Linguist — не заполнять
