<rect x="772.55" y="363" width="203.45" height="18" class="fill-r1" opacity="0.9"/>
<text x="34" y="401" class="lbl-strong" text-anchor="start">покрытие</text>
<rect x="234" y="386" width="203.45" height="22" class="fill-cov"/>
<rect x="234" y="386" width="203.45" height="22" class="cell-edge"/>
<rect x="437.45" y="386" width="65.82" height="22" class="fill-cov"/>
<rect x="437.45" y="386" width="65.82" height="22" class="cell-edge"/>
<rect x="503.27" y="386" width="203.45" height="22" class="fill-cov"/>
<rect x="503.27" y="386" width="203.45" height="22" class="cell-edge"/>
<rect x="706.73" y="386" width="65.82" height="22" class="fill-over"/>
<rect x="706.73" y="386" width="65.82" height="22" class="cell-edge"/>
<rect x="728.44" y="391" width="22.4" height="13" class="chip"/>
<text x="739.64" y="401" class="mark-lbl" text-anchor="middle">×2</text>
<rect x="772.55" y="386" width="203.45" height="22" class="fill-over"/>
<rect x="772.55" y="386" width="203.45" height="22" class="cell-edge"/>
<rect x="863.07" y="391" width="22.4" height="13" class="chip"/>
<text x="874.27" y="401" class="mark-lbl" text-anchor="middle">×2</text>
<line x1="234" y1="416" x2="976" y2="416" class="axis"/>
<text x="34" y="420" class="lbl-strong" text-anchor="start">«сумма»</text>
<line x1="470.36" y1="412" x2="470.36" y2="420" class="tick"/>
<text x="470.36" y="432" class="val" text-anchor="middle">0</text>
<line x1="739.64" y1="412" x2="739.64" y2="420" class="tick"/>
<text x="739.64" y="444" class="val" text-anchor="middle">10000</text>
<text x="234" y="426" class="lbl" text-anchor="start">−∞</text>
<text x="976" y="426" class="lbl" text-anchor="end">+∞</text>
<text x="34" y="461" class="lbl-strong" text-anchor="start">◇ Скидка неотрицательна</text>
<rect x="234" y="448" width="203.45" height="16" class="cell-edge"/>
<text x="335.73" y="460" class="mark-bad" text-anchor="middle">✕</text>
<rect x="437.45" y="448" width="65.82" height="16" class="cell-edge"/>
<text x="470.36" y="460" class="mark-tight" text-anchor="middle">=</text>
<rect x="503.27" y="448" width="203.45" height="16" class="cell-edge"/>
