<text x="739.64" y="480" class="mark-ok" text-anchor="middle">·</text>
<rect x="772.55" y="468" width="203.45" height="16" class="cell-edge"/>
<text x="874.27" y="480" class="mark-ok" text-anchor="middle">·</text>
<rect x="24" y="512" width="14" height="12" class="fill-r0"/>
<rect x="24" y="512" width="14" height="12" class="cell-edge"/>
<text x="46" y="522" class="note" text-anchor="start">«Большая покупка» → добавить 10 % от поля «сумма» · область: «сумма» ∈ [10000, +∞)</text>
<rect x="24" y="528" width="14" height="12" class="fill-r1"/>
<rect x="24" y="528" width="14" height="12" class="cell-edge"/>
<text x="46" y="538" class="note" text-anchor="start">«Постоянный клиент» → добавить 5 % от поля «сумма» · область: «постоянный клиент» = да</text>
<text x="24" y="559" class="mark-bad" text-anchor="start">✕</text>
<text x="42" y="559" class="note" text-anchor="start">свойство «Скидка неотрицательна» (результат ≥ 0): предел недостижим на области, где правила меняют результат: равенство встречается только там, где результат</text>
<text x="42" y="573" class="note" text-anchor="start">остаётся начальным (0); при этом свойство нарушается при «сумма» ∈ (−∞, 0), «постоянный клиент» = да</text>
<text x="24" y="591" class="mark-bad" text-anchor="start">✕</text>
<text x="42" y="591" class="note" text-anchor="start">свойство «Скидка ограничена» (результат ≤ 20 % от поля «сумма»): предел недостижим на области, где правила меняют результат: равенство встречается только</text>
<text x="42" y="605" class="note" text-anchor="start">там, где результат остаётся начальным (0), ближайший подход — 75 % от предела; при этом свойство нарушается при «сумма» ∈ (−∞, 0), «постоянный клиент» = нет</text>
<text x="24" y="623" class="mark-bad" text-anchor="start">▨</text>
<text x="42" y="623" class="note" text-anchor="start">дыра: при «сумма» ∈ (−∞, 10000), «постоянный клиент» = нет результат остаётся 0</text>
<line x1="24" y1="642" x2="976" y2="642" class="axis"/>
<text x="24" y="669" class="h2" text-anchor="start">Как читать</text>
<rect x="24" y="678" width="22" height="14" class="fill-cov"/>
<rect x="24" y="678" width="22" height="14" class="cell-edge"/>
<text x="54" y="689" class="note" text-anchor="start">покрыто — сработало ровно одно правило</text>
<rect x="24" y="696" width="22" height="14" class="fill-over"/>
<rect x="24" y="696" width="22" height="14" class="cell-edge"/>
<text x="54" y="707" class="note" text-anchor="start">пересечение — сработало несколько правил (подпись ×N)</text>
<rect x="24" y="714" width="22" height="14" class="fill-hole"/>
<rect x="24" y="714" width="22" height="14" class="cell-edge"/>
<text x="54" y="725" class="note" text-anchor="start">дыра — не сработало ни одно правило, результат остаётся начальным</text>
<rect x="24" y="732" width="22" height="14" class="fill-mix"/>
<rect x="24" y="732" width="22" height="14" class="cell-edge"/>
<text x="54" y="743" class="note" text-anchor="start">смешанно — под пятном лежат клетки с разным поведением или условие не разобрано</text>
<text x="32" y="761" class="mark-bad" text-anchor="start">✕</text>
<text x="54" y="761" class="note" text-anchor="start">свойство нарушено на входе из этой клетки</text>
<text x="32" y="779" class="mark-tight" text-anchor="start">=</text>
<text x="54" y="779" class="note" text-anchor="start">предел свойства достигнут точно</text>
<text x="32" y="797" class="mark-ok" text-anchor="start">·</text>
<text x="54" y="797" class="note" text-anchor="start">свойство выполнено с запасом — предел ничего не ограничивает</text>
<text x="32" y="815" class="mark-mix" text-anchor="start">?</text>
<text x="54" y="815" class="note" text-anchor="start">определить не удалось: ядро отвергло вход</text>
<text x="24" y="833" class="note" text-anchor="start">Насыщенная заливка правила — оно срабатывает во всей клетке; бледная — только на части представителей (условие сравнивает поля между собой).</text>
<text x="24" y="851" class="note" text-anchor="start">Ось не в масштабе: между порогами равные промежутки, у самого порога — узкая клетка-точка. Ромб ◇ у имени свойства значит «предел недостижим».</text>
<text x="24" y="869" class="note" text-anchor="start">Метод покоординатный: зависимости между полями и нелинейности внутри клетки он не видит. Это выборка на представителях клеток, а не доказательство.</text>
</svg>
