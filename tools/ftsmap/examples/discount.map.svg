<rect x="772.55" y="448" width="203.45" height="16" class="cell-edge"/>
<text x="874.27" y="460" class="mark-ok" text-anchor="middle">·</text>
<text x="34" y="481" class="lbl-strong" text-anchor="start">◇ Скидка ограничена</text>
<rect x="234" y="468" width="203.45" height="16" class="cell-edge"/>
<text x="335.73" y="480" class="mark-bad" text-anchor="middle">✕</text>
<rect x="437.45" y="468" width="65.82" height="16" class="cell-edge"/>
<text x="470.36" y="480" class="mark-tight" text-anchor="middle">=</text>
