<rect x="0" y="0" width="1000" height="904" class="page"/>
<text x="24" y="40" class="h1" text-anchor="start">Карта покрытия правил · категория «Продажи»</text>
<text x="24" y="61" class="lbl" text-anchor="start">утилит 1 · дыр 1 · пересечений 1 · недостижимых свойств 2 · нарушенных свойств 2</text>
<text x="24" y="88" class="h1" text-anchor="start">Утилита «Рассчитать скидку»</text>
<text x="24" y="107" class="lbl" text-anchor="start">объект «Покупка» · начальное значение 0 · клеток 10 · дыр 1 · пересечений 1 · недостижимых свойств 2</text>
<text x="24" y="125" class="lbl" text-anchor="start">вид: решётка — строки по признакам, столбцы по числовым полям</text>
<text x="24" y="145" class="h2" text-anchor="start">«постоянный клиент» = нет</text>
