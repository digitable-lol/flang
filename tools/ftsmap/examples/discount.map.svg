<rect x="706.73" y="282" width="65.82" height="16" class="cell-edge"/>
<text x="739.64" y="294" class="mark-ok" text-anchor="middle">·</text>
<rect x="772.55" y="282" width="203.45" height="16" class="cell-edge"/>
<text x="874.27" y="294" class="mark-ok" text-anchor="middle">·</text>
<text x="24" y="331" class="h2" text-anchor="start">«постоянный клиент» = да</text>
<rect x="24" y="340" width="200" height="18" class="lane-bg"/>
<rect x="24" y="340" width="4" height="18" class="fill-r0"/>
<text x="34" y="353" class="lbl-strong" text-anchor="start">Большая покупка</text>
<rect x="706.73" y="340" width="65.82" height="18" class="fill-r0" opacity="0.9"/>
<rect x="772.55" y="340" width="203.45" height="18" class="fill-r0" opacity="0.9"/>
