<!doctype html>

<title>Градины — приложение на flang</title>
<!--
  Страница приложения «Градины».

  Здесь НЕТ ни одной строки прикладной логики. Всё, что решает, что показать и
  что делать с нажатием, написано на flang (`hailstone.flang`, 16 тотальных
  функций, 31 пример). Здесь — разметка и четыре строки запуска: разобрать
  программу, взять хозяина браузера, отдать ему план.

  Разметка размечена двумя признаками, и это весь договор между страницей и
  хозяином:

    данные-место     — сюда хозяин пишет текст поручения «Показать»;
    данные-событие   — отсюда хозяин берёт события для «Ждать событие»,
    данные-значение  — и вот это значение он к событию прикладывает.

  Ни одно из этих имён язык не знает. Программа называет место строкой «экран»,
  которую придумала сама.

  ЗДЕСЬ НЕТ НИ ОДНОЙ СТРОКИ JavaScript, И ЭТО ПРОВЕРЯЕТСЯ ГЛАЗАМИ: тег
  <script> ниже несёт только два признака. `src` — хозяин вкладки, единственное,
  что вообще едет в браузер помимо самой программы; `данные-модуль` — имя
  напечатанного модуля, который хозяин заведёт сам. Ни разбора, ни вызова, ни
  обработчика: связывает их код хозяина, написанный один раз на всё дерево.

  Модуль `gradiny.js` — это `hailstone.flang`, напечатанный в JavaScript тем же
  двоичным компилятором. Он производная, в дереве его нет; печатает его

    sh web/sobrat.sh

  Запуск стенда — тоже без Node и без python3, стенд написан на flang:

    bootstrap/flang io web/stend.flang --max-orders 100000

  и открыть http://127.0.0.1:8908/
-->
