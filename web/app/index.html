<!doctype html>
<meta charset="utf-8">
<title>Градины — приложение на flang</title>
<!--
  Страница приложения «Градины».

  Здесь НЕТ ни одной строки прикладной логики. Всё, что решает, что показать и
  что делать с нажатием, написано на flang (`hailstone.flang`, 16 тотальных
  функций, 31 пример). Здесь — разметка и четыре строки запуска: разобрать
  программу, взять хозяина браузера, отдать ему план.

  Разметка размечена двумя признаками, и это весь договор между страницей и
  хозяином:

    данные-место     — сюда хозяин пишет текст поручения «Показать»;
    данные-событие   — отсюда хозяин берёт события для «Ждать событие»,
    данные-значение  — и вот это значение он к событию прикладывает.

  Ни одно из этих имён язык не знает. Программа называет место строкой «экран»,
  которую придумала сама.

  Запуск: любой статический сервер поверх корня дерева, например
    python3 -m http.server 8907
  и открыть /web/app/index.html — модули flang грузятся прямо из `flang/src`,
  сборки не нужно: они настоящий ESM без единого импорта из Node.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0; padding: 2rem; display: grid; gap: 1.5rem;
    justify-items: start; max-width: 40rem;
  }
  h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
  p { margin: 0; opacity: .75; font-size: .85rem; }
  pre[данные-место] {
    margin: 0; padding: 1rem 1.25rem; min-width: 18rem; min-height: 8.5rem;
    border: 1px solid currentColor; border-radius: .5rem; font-size: 1rem;
  }
  .ряд { display: flex; flex-wrap: wrap; gap: .4rem; }
  button {
    font: inherit; padding: .45rem .8rem; min-width: 2.6rem; cursor: pointer;
    border: 1px solid currentColor; border-radius: .4rem; background: transparent;
    color: inherit;
  }
  button:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
</style>

<h1>Градины — сиракузская последовательность</h1>
<p>Наберите число цифрами, нажмите «пуск». «Шаг» двигает на такт, «бег» считает сам.</p>

<pre данные-место="экран">загружаем…</pre>

<div class="ряд">
  <button данные-событие="кнопка" данные-значение="1">1</button>
  <button данные-событие="кнопка" данные-значение="2">2</button>
  <button данные-событие="кнопка" данные-значение="3">3</button>
  <button данные-событие="кнопка" данные-значение="4">4</button>
  <button данные-событие="кнопка" данные-значение="5">5</button>
  <button данные-событие="кнопка" данные-значение="6">6</button>
  <button данные-событие="кнопка" данные-значение="7">7</button>
  <button данные-событие="кнопка" данные-значение="8">8</button>
  <button данные-событие="кнопка" данные-значение="9">9</button>
  <button данные-событие="кнопка" данные-значение="0">0</button>
</div>
<div class="ряд">
  <button данные-событие="кнопка" данные-значение="пуск">пуск</button>
  <button данные-событие="кнопка" данные-значение="шаг">шаг</button>
  <button данные-событие="кнопка" данные-значение="бег">бег</button>
  <button данные-событие="кнопка" данные-значение="сброс">сброс</button>
</div>

<p данные-место="итог"></p>

<script type="module">
  import { parse } from "../../flang/src/parser.mjs"
  import { runPlan } from "../../flang/src/io.mjs"
  import { browserHost } from "../../flang/src/host/browser.mjs"

  const исходник = await (await fetch("./hailstone.flang")).text()
  const программа = parse(исходник, { file: "hailstone.flang" })
  const хозяин = browserHost({ документ: document })

  /*
   * Предел поручений снят, и это ЕДИНСТВЕННОЕ, что переворот цикла стоил
   * вызывающему. Умолчание `runPlan` — 10 000 поручений на прогон — мера
   * пакетной программы: она кончается, и предел ловит зациклившуюся. Вкладка
   * не кончается, и то же самое число здесь означало бы «приложение умрёт
   * после пяти тысяч нажатий». Своей завершаемости приложение и не обещает:
   * ветки «Конец работы» в нём нет ни одной, кончает его человек.
   */
  runPlan(программа, "Градины", хозяин, { maxOrders: Infinity }).catch((беда) => {
    /* Отказ плана — такой же результат, как ответ, и он показывается человеку,
       а не прячется в консоль. */
    const место = document.querySelector('[данные-место="итог"]')
    if (место !== null) место.textContent = `${беда.code ?? "FLANG"}: ${беда.message}`
  })
</script>
